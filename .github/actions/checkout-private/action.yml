name: Check out the private source
description: Clones termenbox/termenbox at a sha with a read-only token, silently, and keeps no credentials.
inputs:
  sha: { description: "Commit to check out; empty means the head of develop", default: "" }
  token: { description: Read-only token for the private repo, required: true }
  path: { description: Directory to clone into, default: . }
  depth: { description: "Fetch depth; 0 fetches the whole history", default: "1" }
  base: { description: Extra commit to fetch (the base of a pull request), default: "" }
  branch: { description: "Branch whose head is taken when no sha is given", default: develop }
  remote: { description: "Keep an origin remote and a repo-local auth header for steps that fetch more (git fetch origin master); the header sits in .git/config", default: "false" }
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        SHA: ${{ inputs.sha }}
        BASE: ${{ inputs.base }}
        DEST: ${{ inputs.path }}
        DEPTH: ${{ inputs.depth }}
        REMOTE: ${{ inputs.remote }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set +x
        for v in "$SHA" "$BASE"; do case "$v" in *[!0-9a-f]*) echo "bad sha"; exit 1;; esac; done
        url="https://x-access-token:${TOKEN}@github.com/termenbox/termenbox.git"
        # a scheduled or manual run has no commit in its payload: take the head of the branch (develop by default)
        if [ -z "$SHA" ]; then SHA=$(git ls-remote "$url" "refs/heads/$BRANCH" 2>/dev/null | cut -f1); fi
        [ -n "$SHA" ] || { echo "no sha"; exit 1; }
        err=$(mktemp)
        command -v git >/dev/null || { echo "git is not installed in this job"; exit 1; }
        git config --global --add safe.directory '*' 2>/dev/null || true
        {
          git init -q "$DEST" && cd "$DEST"
          if [ "$DEPTH" = 0 ]; then d=""; else d="--depth=$DEPTH"; fi
          git -c credential.helper= fetch -q --no-tags $d "$url" "$SHA" ${BASE:+"$BASE"}
          git checkout -q FETCH_HEAD
          if [ "$REMOTE" = true ]; then
            git remote add origin https://github.com/termenbox/termenbox.git
            git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          fi
        } >/dev/null 2>"$err" || { echo "checkout failed:"; sed "s#${TOKEN}#***#g" "$err" | head -3; exit 1; }
        echo "checked out $SHA"

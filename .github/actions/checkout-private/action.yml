name: Check out the source
description: Clones termenbox/termenbox-source at a sha with a read-only token, silently, and keeps no credentials.
inputs:
  sha: { description: "Commit to check out; empty means the head of develop", default: "" }
  app-id: { description: "The reporter app's id (secret REPORTER_APP_ID): a read-only token of one hour is minted for the source in place of `token`", default: '' }
  app-key: { description: "The reporter app's private key (secret REPORTER_APP_KEY)", default: '' }
  token: { description: Read-only token for the source repo, required: true }
  path: { description: Directory to clone into, default: . }
  depth: { description: "Fetch depth; 0 fetches the whole history", default: "1" }
  base: { description: Extra commit to fetch (the base of a pull request), default: "" }
  branch: { description: "Branch whose head is taken when no sha is given", default: develop }
  fetch: { description: "Branches to fetch into refs/remotes/origin/<branch> during this step (space separated), for jobs that compare the commit with master or develop; no credential is left behind, so a later step cannot fetch", default: "" }
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        APP_ID: ${{ inputs.app-id }}
        APP_KEY: ${{ inputs.app-key }}
        SHA: ${{ inputs.sha }}
        BASE: ${{ inputs.base }}
        DEST: ${{ inputs.path }}
        DEPTH: ${{ inputs.depth }}
        FETCH: ${{ inputs.fetch }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set +x
        if [ -n "$APP_ID" ]; then
          TOKEN=$(MINT_STDOUT=1 REPO=termenbox/termenbox-source PERMISSIONS='{"contents":"read"}' bash "$GITHUB_ACTION_PATH/../app-token/mint.sh" 2>&1) || { echo "$TOKEN"; exit 1; }
          echo "::add-mask::$TOKEN"
        fi
        for v in "$SHA" "$BASE"; do case "$v" in *[!0-9a-f]*) echo "bad sha"; exit 1;; esac; done
        refspecs=""
        for b in $FETCH; do case "$b" in ''|*[!A-Za-z0-9._-]*) echo "bad branch"; exit 1;; esac; refspecs="$refspecs +refs/heads/$b:refs/remotes/origin/$b"; done
        url="https://x-access-token:${TOKEN}@github.com/termenbox/termenbox-source.git"
        # a scheduled or manual run has no commit in its payload: take the head of the branch (develop by default)
        if [ -z "$SHA" ]; then SHA=$(git ls-remote "$url" "refs/heads/$BRANCH" 2>/dev/null | cut -f1); fi
        [ -n "$SHA" ] || { echo "no sha"; exit 1; }
        err=$(mktemp)
        command -v git >/dev/null || { echo "git is not installed in this job"; exit 1; }
        git config --global --add safe.directory '*' 2>/dev/null || true
        {
          git init -q "$DEST" && cd "$DEST"
          if [ "$DEPTH" = 0 ]; then d=""; else d="--depth=$DEPTH"; fi
          git -c credential.helper= fetch -q --no-tags $d "$url" "$SHA" ${BASE:+"$BASE"} $refspecs
          git checkout -q FETCH_HEAD
          git remote add origin https://github.com/termenbox/termenbox-source.git
        } >/dev/null 2>"$err" || { echo "checkout failed:"; sed "s#${TOKEN}#***#g" "$err" | head -3; exit 1; }
        echo "checked out $SHA"

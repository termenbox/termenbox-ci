name: Setup silent shell
description: Installs scripts/quiet.sh as the `quiet` command used as defaults.run.shell (also inside job containers).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
        $SUDO install -m 755 "$GITHUB_ACTION_PATH/../../../scripts/quiet.sh" /usr/local/bin/quiet

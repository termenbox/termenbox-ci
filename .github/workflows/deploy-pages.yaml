name: Deploy to Cloudflare Pages

# One deployment per release channel: a stable tag deploys app.termenbox.dev, a beta tag
# beta.app.termenbox.dev, a nightly nightly.app.termenbox.dev. A push to master or develop deploys nothing. Stable and
# beta deploy inside the signing job of release-build.yaml, so one approval covers the release and its client; this
# workflow is the nightly deploy and the manual one. The build runs in its own job (.github/actions/build-client) that
# holds no deploy credential; the deploy job (.github/actions/deploy-pages) takes the built client from an artifact. Each runs in the GitHub Environment of its channel, so each channel has its
# own GitHub OAuth app (TERMENBOX_GITHUB_CLIENT_ID / _SECRET); the D1 database, signing key and salt are repository-level
# and shared. Stable deploys only on a stable tag, so migrations must stay additive: beta and nightly apply them first.
# Run by hand it builds and deploys the chosen channel from the ref it is run on.

on:
  workflow_call:
    inputs:
      channel:
        description: 'stable, beta or nightly'
        type: string
        required: true
      sha:
        description: 'Commit to build (default: the calling workflow commit)'
        type: string
        default: ''
      version:
        description: 'Version the app shows (default: packages/server/Cargo.toml)'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to deploy'
        type: choice
        options: [stable, beta, nightly]
        default: stable
      sha:
        description: 'Commit to build (default: the head of the branch). A staged deploy needs the commit its release tag points to.'
        type: string
        default: ''
      tag:
        description: 'Release tag holding a staged client bundle and its owner signature (bundle.json.sig): deploys exactly those bytes. Needed for a channel with a pinned bundle key.'
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: quiet {0}

env:
  TB_EVENT: ${{ github.event.client_payload.event || github.event_name }}
  TB_TAG: ${{ github.event.client_payload.tag }}
  CHANNEL: ${{ inputs.channel }}

jobs:
  # The one review of this run. It holds no secret and runs no code; every job that uses a channel Environment needs it
  # (scripts/check-approval-jobs.mjs), so the channel Environments carry secrets and a branch policy but no reviewer.
  approve:
    name: Approve
    if: ${{ inputs.channel != 'nightly' }}
    runs-on: ubuntu-latest
    environment: approve-${{ inputs.channel }}
    steps:
      - shell: bash
        run: echo "approved"

  # Builds the client from the commit in a job that holds no deploy credential: it reads the public client id and the source
  # token. The Cloudflare token, the function secrets and the certificate key are in the deploy job. A deploy of a staged
  # bundle (tag) builds nothing.
  build:
    name: Build ${{ inputs.channel }} client
    needs: approve
    if: ${{ !cancelled() && inputs.tag == '' && (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.channel }}
    permissions:
      contents: read
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: ./.github/actions/build-client
        with:
          channel: ${{ inputs.channel }}
          version: ${{ inputs.version }}
          github-client-id: ${{ secrets.TERMENBOX_GITHUB_CLIENT_ID }}
          client-origin: ${{ vars.TERMENBOX_CLIENT_ORIGIN }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: client-dist
          path: packages/client/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          key: ${{ secrets.LOG_KEY }}
          name: build-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}
            ${{ secrets.TERMENBOX_GITHUB_CLIENT_ID }}

  deploy:
    name: Deploy ${{ inputs.channel }} to Cloudflare Pages
    needs: [approve, build]
    if: ${{ !cancelled() && needs.build.result != 'failure' && (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    timeout-minutes: 15
    environment: ${{ inputs.channel }}
    # Two deployments of one channel never overlap (the D1 migrations in particular). A newer one waits, and a newer
    # one replaces an older one that is still waiting: the last deployment is the one that matters.
    concurrency:
      group: pages-deploy-${{ inputs.channel }}
      cancel-in-progress: false
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Fetch the built client
        if: inputs.tag == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: client-dist
          path: packages/client/dist

      # A staged bundle is deployed as it is, after its owner signature verifies (the action checks it).
      - name: Fetch the staged bundle
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: termenbox/termenbox
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/staged" packages/client/dist
          gh release download "$TAG" -p client-bundle.tar -p bundle.json.sig -D "$RUNNER_TEMP/staged"
          tar -xf "$RUNNER_TEMP/staged/client-bundle.tar" -C packages/client/dist --no-same-owner
          cp "$RUNNER_TEMP/staged/bundle.json.sig" packages/client/dist/bundle.json.sig

      - uses: ./.github/actions/deploy-pages
        with:
          prebuilt: ${{ inputs.tag != '' }}
          tag: ${{ inputs.tag }}
          channel: ${{ inputs.channel }}
          pages-project-name: ${{ vars.TERMENBOX_PAGES_PROJECT_NAME }}
          d1-database-id: ${{ vars.TERMENBOX_D1_DATABASE_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github-client-id: ${{ secrets.TERMENBOX_GITHUB_CLIENT_ID }}
          github-client-secret: ${{ secrets.TERMENBOX_GITHUB_CLIENT_SECRET }}
          cert-signing-key: ${{ secrets.TERMENBOX_CERT_SIGNING_KEY }}
          cert-kid: ${{ vars.TERMENBOX_CERT_KID }}
          directory-salt: ${{ secrets.TERMENBOX_DIRECTORY_SALT }}

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          key: ${{ secrets.LOG_KEY }}
          name: deploy-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            ${{ secrets.CLOUDFLARE_API_TOKEN }}
            ${{ secrets.GITHUB_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}
            ${{ secrets.TERMENBOX_CERT_SIGNING_KEY }}
            ${{ secrets.TERMENBOX_DIRECTORY_SALT }}
            ${{ secrets.TERMENBOX_GITHUB_CLIENT_ID }}
            ${{ secrets.TERMENBOX_GITHUB_CLIENT_SECRET }}

  # Reads the origin the way a browser does once the deployment is up; it holds no secret and runs code of this repository
  # only. A failure leaves the deployment in place and turns the run red.
  verify-origin:
    name: Verify the origin
    needs: [deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the origin
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          case "$CHANNEL" in
            stable) host=app.termenbox.dev ;;
            beta) host=beta.app.termenbox.dev ;;
            nightly) host=nightly.app.termenbox.dev ;;
            *) echo "unknown channel"; exit 1 ;;
          esac
          node release/verify_origin.mjs "https://$host" "$CHANNEL" 150

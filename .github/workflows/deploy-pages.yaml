# Generated from the Termenbox source. Do not edit here.
name: Deploy to Cloudflare Pages

# One deployment per release channel: a stable tag deploys app.termenbox.dev, a beta tag
# beta.app.termenbox.dev, a nightly nightly.app.termenbox.dev. A push to master or develop deploys nothing. Stable and
# beta deploy inside the signing job of release-build.yaml, so one approval covers the release and its client; this
# workflow is the nightly deploy and the manual one. Both run the composite action .github/actions/deploy-pages. The job runs in the GitHub Environment of its channel, so each channel has its
# own GitHub OAuth app (TERMENBOX_GITHUB_CLIENT_ID / _SECRET); the D1 database, signing key and salt are repository-level
# and shared. Stable deploys only on a stable tag, so migrations must stay additive: beta and nightly apply them first.
# Run by hand it builds and deploys the chosen channel from the ref it is run on.

on:
  workflow_call:
    inputs:
      channel:
        description: 'stable, beta or nightly'
        type: string
        required: true
      sha:
        description: 'Commit to build (default: the calling workflow commit)'
        type: string
        default: ''
      version:
        description: 'Version the app shows (default: packages/server/Cargo.toml)'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to deploy'
        type: choice
        options: [stable, beta, nightly]
        default: stable
      sha:
        description: 'Commit to build (default: the head of the branch). A staged deploy needs the commit its release tag points to.'
        type: string
        default: ''
      tag:
        description: 'Release tag holding a staged client bundle and its owner signature (bundle.json.sig): deploys exactly those bytes. Needed for a channel with a pinned bundle key.'
        type: string
        default: ''

permissions:
  contents: read
  deployments: write

defaults:
  run:
    shell: quiet {0}

env:
  TB_EVENT: ${{ github.event.client_payload.event || github.event_name }}
  TB_TAG: ${{ github.event.client_payload.tag }}
  CHANNEL: ${{ inputs.channel }}

jobs:
  deploy:
    name: Deploy ${{ inputs.channel }} to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.channel }}
    # Two deployments of one channel never overlap (the D1 migrations in particular). A newer one waits, and a newer
    # one replaces an older one that is still waiting: the last deployment is the one that matters.
    concurrency:
      group: deploy-pages-${{ inputs.channel }}
      cancel-in-progress: false
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@main

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@main
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          remote: true

      # A staged bundle is deployed as it is, after its owner signature verifies (the action checks it).
      - name: Fetch the staged bundle
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: termenbox/termenbox-ci
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/staged" packages/client/dist
          gh release download "$TAG" -p client-bundle.tar -p bundle.json.sig -D "$RUNNER_TEMP/staged"
          tar -xf "$RUNNER_TEMP/staged/client-bundle.tar" -C packages/client/dist --no-same-owner
          cp "$RUNNER_TEMP/staged/bundle.json.sig" packages/client/dist/bundle.json.sig

      - uses: ./.github/actions/deploy-pages
        with:
          prebuilt: ${{ inputs.tag != '' }}
          tag: ${{ inputs.tag }}
          channel: ${{ inputs.channel }}
          version: ${{ inputs.version }}
          pages-project-name: ${{ vars.TERMENBOX_PAGES_PROJECT_NAME }}
          d1-database-id: ${{ vars.TERMENBOX_D1_DATABASE_ID }}
          client-origin: ${{ vars.TERMENBOX_CLIENT_ORIGIN }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github-client-id: ${{ secrets.TERMENBOX_GITHUB_CLIENT_ID }}
          github-client-secret: ${{ secrets.TERMENBOX_GITHUB_CLIENT_SECRET }}
          cert-signing-key: ${{ secrets.TERMENBOX_CERT_SIGNING_KEY }}
          cert-kid: ${{ vars.TERMENBOX_CERT_KID }}
          directory-salt: ${{ secrets.TERMENBOX_DIRECTORY_SALT }}

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@main
        with:
          key: ${{ secrets.LOG_KEY }}
          name: deploy-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            ${{ secrets.CLOUDFLARE_API_TOKEN }}
            ${{ secrets.GITHUB_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}
            ${{ secrets.TERMENBOX_CERT_SIGNING_KEY }}
            ${{ secrets.TERMENBOX_DIRECTORY_SALT }}
            ${{ secrets.TERMENBOX_GITHUB_CLIENT_ID }}
            ${{ secrets.TERMENBOX_GITHUB_CLIENT_SECRET }}

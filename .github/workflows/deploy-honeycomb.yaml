name: Deploy Honeycomb board
run-name: "Deploy Honeycomb board · ${{ inputs.action }} · ${{ inputs.sha || 'head of develop' }}"
# Plans or applies infra/honeycomb of the source: the product telemetry board, its four queries and the two triggers
# (canary-stale, install-failure-rate) in the owner's Honeycomb environment. The job sits in the `cloud` environment,
# whose required reviewer is the owner: nothing runs until they approve. The Terraform state lives in the R2 bucket of the
# main account (the same backend as deploy-infra). Only status lines are printed, never Terraform's variable values.
# Secrets in the `cloud` environment: HONEYCOMB_CONFIG_API_KEY (a configuration key that manages boards, queries,
# triggers, columns and recipients, never the ingest key), HONEYCOMB_ALERT_EMAIL; CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID
# and R2_SECRET_ACCESS_KEY are the backend's.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
      sha:
        description: 'Source commit to deploy; empty means the head of develop'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: deploy-honeycomb
jobs:
  terraform:
    name: Terraform ${{ inputs.action }} (Honeycomb board)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloud
    env:
      TF_VERSION: '1.9'
      TF_VAR_honeycomb_config_key: ${{ secrets.HONEYCOMB_CONFIG_API_KEY }}
      TF_VAR_alert_email: ${{ secrets.HONEYCOMB_ALERT_EMAIL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@8a830ae40dc43ed9db9c18a5bc7d30c965eab7c1
        with:
          sha: ${{ inputs.sha }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Credentials are set
        run: |
          for v in TF_VAR_honeycomb_config_key TF_VAR_alert_email AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || { echo "the cloud environment lacks the secret behind $v"; exit 1; }
          done
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || { echo "the cloud environment lacks CLOUDFLARE_ACCOUNT_ID (the state backend)"; exit 1; }
          echo "credentials present"
      - name: Thresholds agree with the board
        run: node scripts/check-honeycomb-tf.mjs
      - name: Terraform init
        working-directory: infra/honeycomb
        run: |
          terraform init -input=false \
            -backend-config="endpoint=https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            -backend-config="access_key=$AWS_ACCESS_KEY_ID" \
            -backend-config="secret_key=$AWS_SECRET_ACCESS_KEY" >/dev/null 2>&1 || { echo "terraform init failed"; exit 1; }
          echo "terraform init ok"
      - name: Terraform plan
        working-directory: infra/honeycomb
        run: |
          terraform plan -input=false -no-color -out=tfplan 2>&1 | grep -vE 'api_token|key|secret|token|address|email' | tail -40
          test "${PIPESTATUS[0]}" -eq 0
      - name: Terraform apply
        if: inputs.action == 'apply'
        working-directory: infra/honeycomb
        run: |
          terraform apply -input=false -no-color tfplan 2>&1 | grep -vE 'api_token|key|secret|token|address|email' | tail -20
          test "${PIPESTATUS[0]}" -eq 0

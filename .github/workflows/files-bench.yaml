name: Files bench

# A one-shot harness for the Files tab (plan files-tab-midnight-commander 1.4, 3.3, 4.5, 5.2): it builds the release server and the
# e2e bundle of one source ref, then runs e2e/files-huge.mjs (a 100000-entry folder, downloads) and e2e/files-tasks.mjs (keys, clicks
# and milliseconds per task) against a real termenbox-server with the pinned tmux. Only the `bench` and `HUGE`/`TASKS` lines reach the
# log; every build output goes to a file that is uploaded encrypted. Never add a pull_request trigger: a fork PR could change this
# file and print the checkout.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref to measure (a branch, tag or sha of termenbox-source)
        default: feat/file-manager-2
      which:
        description: Scenarios to run, a list of huge-list, huge-transfer, tasks-ops, tasks-transfer
        default: 'huge-list,tasks-ops,huge-transfer,tasks-transfer'
      rounds:
        description: Rounds of each scenario (each takes the median of 5 runs itself)
        default: '1'

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - id: rt-src
        name: Token for the next step (contents)
        uses: termenbox/termenbox-ci/.github/actions/app-token@8a830ae40dc43ed9db9c18a5bc7d30c965eab7c1
        with:
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          permissions: '{"contents":"read"}'
      - name: Check out the ref
        env:
          TOKEN: ${{ steps.rt-src.outputs.token }}
          REF: ${{ inputs.ref }}
        run: |
          set +x
          git -c credential.helper= clone --quiet "https://x-access-token:${TOKEN}@github.com/termenbox/termenbox-source.git" src >/dev/null 2>&1
          git -C src remote set-url origin https://github.com/termenbox/termenbox-source.git
          sha=$(git -C src rev-parse --verify --quiet "origin/$REF" || git -C src rev-parse --verify --quiet "$REF") || { echo "no such ref"; exit 1; }
          git -C src checkout --quiet --detach "$sha" >/dev/null 2>&1 || { echo "checkout failed"; exit 1; }
          echo "checked out ${REF} ($(printf '%.8s' "$sha"))"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      # The tmux the owner runs is the pinned static build of the release, not the runner's apt tmux: take the one ci.yaml saved
      # (same key as release-build.yaml) and build it only when it is not there.
      - name: Restore the pinned tmux built by CI
        id: tmux
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmux-out
          key: tmux-x86_64-${{ hashFiles('src/.github/scripts/build-tmux.sh') }}
      - name: Build the pinned tmux (pinned sources, static)
        if: steps.tmux.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -qq bison musl-tools >/dev/null 2>&1
          (cd src && .github/scripts/build-tmux.sh ../tmux-out) > tmux-build.log 2>&1 || { tail -5 tmux-build.log; exit 1; }
      - name: Build the release server and the e2e bundle (output withheld)
        id: build
        run: |
          set +e
          (cd src && CARGO_PROFILE_RELEASE_STRIP=false cargo build --release -p termenbox-server && pnpm install --frozen-lockfile && cd packages/client && pnpm run build && pnpm run e2e:build) > build.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Run the scenarios (output withheld except the readings)
        id: bench
        if: steps.build.outputs.exit == '0'
        env:
          WHICH: ${{ inputs.which }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          set +e
          export PATH="$PWD/tmux-out:$PATH"
          export TERMENBOX_BIN="$PWD/src/target/release/termenbox-server"
          echo "runner: $(nproc) cores, load $(cut -d' ' -f1-3 /proc/loadavg), $(command -v tmux) $(tmux -V), $(google-chrome --version 2>/dev/null)"
          cd src/packages/client
          : > ../../../rows.txt
          rc=0
          i=1
          while [ "$i" -le "$ROUNDS" ]; do
            for w in $(echo "$WHICH" | tr ',' ' '); do
              case "$w" in
                huge-list) cmd="e2e/files-huge.mjs --only list" ;;
                huge-transfer) cmd="e2e/files-huge.mjs --only transfer" ;;
                tasks-ops) cmd="e2e/files-tasks.mjs --only ops" ;;
                tasks-transfer) cmd="e2e/files-tasks.mjs --only transfer" ;;
                *) echo "unknown scenario $w"; rc=1; continue ;;
              esac
              node $cmd > ../../../one.out 2>> ../../../bench.err || { echo "scenario $w failed a threshold or crashed"; rc=1; }
              grep -E '^(bench |HUGE |TASKS )' ../../../one.out | sed "s/^/round=$i $w /" | tee -a ../../../rows.txt
            done
            i=$((i + 1))
          done
          [ -s ../../../rows.txt ] || rc=1
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          { echo '```'; cat ../../../rows.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Encrypt logs
        if: always()
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          touch build.log bench.err
          cat build.log bench.err > all.log
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in all.log -out all.log.enc 2>/dev/null || true
          rm -f build.log bench.err all.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: files-bench-log-encrypted
          path: all.log.enc
          retention-days: 7
      # A broken threshold fails this step on purpose: the run is red while a limit is broken and the table is still in the summary.
      - name: Result
        env:
          BUILD: ${{ steps.build.outputs.exit }}
          BENCH: ${{ steps.bench.outputs.exit }}
        run: test "$BUILD" = 0 && test "$BENCH" = 0

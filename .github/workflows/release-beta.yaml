name: Release (beta)
run-name: "Release (beta) · ${{ github.event.client_payload.pr && format('PR #{0}', github.event.client_payload.pr) || github.event.client_payload.tag || github.event.client_payload.event || 'manual' }}${{ github.event.client_payload.sha && format(' · {0}', github.event.client_payload.sha) || '' }}"

# A tag vX.Y.Z-rc.N or vX.Y.Z-beta.N on master publishes a beta prerelease, signed by the beta key `b1`
# from the `beta` environment, and moves channel-beta to it when it is the newest. It is never GitHub's "latest"
# release, so the stable address releases/latest/download is untouched. The Docker tags come from docker-build.yaml.
# Run by hand it does everything but publish, so the pipeline can be tested.

on:
  repository_dispatch:
    types: [source-tag]
  workflow_dispatch:
    inputs:
      version:
        description: 'X.Y.Z-rc.N or X.Y.Z-beta.N for a dry run (nothing is published)'
        default: '0.0.0-rc.0'

permissions:
  contents: read

defaults:
  run:
    shell: quiet {0}

env:
  TB_EVENT: ${{ github.event.client_payload.event || github.event_name }}
  TB_TAG: ${{ github.event.client_payload.tag }}

jobs:
  # The one review of this run. It holds no secret and runs no code; every job that uses a channel Environment needs it
  # (scripts/check-approval-jobs.mjs), so the channel Environments carry secrets and a branch policy but no reviewer.
  approve:
    name: Approve
    if: ${{ contains(github.event.client_payload.tag || format('v{0}', inputs.version), '-') }}
    runs-on: ubuntu-latest
    environment: approve-beta
    steps:
      - shell: bash
        run: echo "approved"

  gate:
    needs: approve
    if: ${{ !cancelled() && needs.approve.result == 'success' }}
    name: Gate
    runs-on: ubuntu-latest
    # The gate reads the review repo with REVIEWS_TOKEN, a secret of this Environment; the review itself is the approve job above.
    environment: beta
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
      run: ${{ steps.g.outputs.run }}
      version: ${{ steps.g.outputs.version }}
      tag: ${{ steps.g.outputs.tag }}
      aliases: ${{ steps.g.outputs.aliases }}
      docker_tags: ${{ steps.g.outputs.docker_tags }}
      publish: ${{ steps.g.outputs.publish }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845
      - uses: termenbox/termenbox-ci/.github/actions/release-tools@e737203677459b53d9f48012f376e46b2d809845

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          depth: 0
          base: ${{ github.event.client_payload.base }}
          remote: true
          branch: master
      - id: g
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "$TB_EVENT" = tag ]; then
            tag="$TB_TAG"; publish=true
          else
            tag="v$DISPATCH_VERSION"; publish=false
          fi
          plan="$(python3 "$TB_RELEASE_TOOLS/release_plan.py" tag "$tag")"
          channel="$(jq -r .channel <<<"$plan")"
          if [ "$channel" != beta ]; then
            echo "::notice::$tag is not a beta tag; nothing to do"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          crate="$(grep -m1 '^version' packages/server/Cargo.toml | cut -d'"' -f2)"
          core="$(jq -r .core <<<"$plan")"
          if [ "$publish" = true ]; then
            [ "$core" = "$crate" ] || { echo "tag $tag has core $core but packages/server/Cargo.toml says $crate"; exit 1; }
            git fetch -q origin master
            git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/master || { echo "$tag is not on master (decision 0129): a beta comes only from master"; exit 1; }
          fi
          {
            echo "run=true"; echo "publish=$publish"; echo "tag=$tag"
            echo "version=$(jq -r .version <<<"$plan")"
            echo "aliases=$(jq -r '.aliases | join(" ")' <<<"$plan")"
            echo "docker_tags=$(jq -r '.docker_tags | join(" ")' <<<"$plan")"
          } >> "$GITHUB_OUTPUT"
      # No signing job runs unless this step passes.
      # It also runs on a dry run, so a stale or open review shows up before a real tag does.
      - name: Security review gate
        if: steps.g.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.REVIEWS_TOKEN }}
        run: |
          # Rule 1: the gate runs from master's copy of its script and the scripts it runs, not from the release
          # commit's checkout. A script not yet on master stops the release.
          set -eu
          git fetch -q origin master
          gate="$RUNNER_TEMP/gate"
          mkdir -p "$gate"
          for f in check-security-review.mjs check-security-surface.mjs check-security-counts.mjs; do
            git show "refs/remotes/origin/master:scripts/$f" > "$gate/$f" || { echo "scripts/$f is not on origin/master: the release gate cannot run, so nothing is released"; exit 1; }
          done
          node "$gate/check-security-review.mjs" "$(git rev-parse HEAD)"

      # A signed freeze (release-freeze.yaml) holds the channel until a release newer than it is made.
      - name: Freeze gate
        if: steps.g.outputs.run == 'true' && steps.g.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: termenbox/termenbox
          VERSION: ${{ steps.g.outputs.version }}
        run: sh "$TB_RELEASE_TOOLS/check_not_frozen.sh" beta "$VERSION"

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: gate-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.GITHUB_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}
            ${{ secrets.REVIEWS_TOKEN }}

  # GitHub does not start a workflow for a tag its own token created, and a second run would need its own approvals, so
  # the image is built by calling the workflow in this run. The release waits for the image tag and signs its digests.
  image:
    name: Image
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-build.yaml
    secrets: inherit
    with:
      sha: ${{ github.event.client_payload.sha }}
      version: ${{ needs.gate.outputs.version }}
      tags: ${{ needs.gate.outputs.docker_tags }}
      channel: beta

  release:
    name: Release
    needs: gate
    if: needs.gate.outputs.run == 'true'
    permissions:
      actions: read
      contents: write
      deployments: write
      packages: read
    uses: ./.github/workflows/release-build.yaml
    secrets: inherit
    with:
      channel: beta
      kid: b1
      version: ${{ needs.gate.outputs.version }}
      tag: ${{ needs.gate.outputs.tag }}
      sha: ${{ github.event.client_payload.sha }}
      publish: ${{ needs.gate.outputs.publish == 'true' }}
      prerelease: true
      latest: false
      aliases: ${{ needs.gate.outputs.aliases }}
      deploy: true

name: Release build

# The build, manifest, signature and publish steps of every channel. The wrappers release-stable.yaml,
# release-beta.yaml and release-nightly.yaml decide when a release is allowed and what it is called; this workflow does
# the work and holds nothing channel-specific except the environment (and so the signing key) it runs in.
# publish=false does everything but publish, with a throwaway key when the real one is not configured, so the
# pipeline can be tested.
#
# Where a release goes: the project's R2 bucket under <channel>/<version>/ (what installers read, through
# dl.termenbox.dev), then the Releases of the public product repo termenbox/termenbox as a mirror and an immutable record,
# written with MIRROR_TOKEN (contents write on that repo only, held in the channel's environment).
# The stable and beta callers run the security review gate in a job this one needs, so nothing below runs without it;
# nightly is exempt. Hosts are not trusted: the installer checks the signed manifest, not the host.
#
# ci.yaml is canonical for how things are built: it runs far more often than a release, so this workflow follows it
# instead of defining a setup of its own.
#   - The two cargo variables below equal ci.yaml's. Swatinem/rust-cache puts CARGO*/RUST*/CC* variables into its key,
#     so a different value here is a different key and CI's cache is not found.
#   - The cargo cache and the bundled tmux are restored from what CI saved (same keys as the static and tmux jobs of
#     ci.yaml). A release run only reads: it never writes a cache entry, so releases cannot crowd out the 10 GB budget.
#   - A miss is not an error. The build then simply runs cold, as it always did.
# Caches are only visible from the default branch (and the ref itself), so they hit when CI's pushes to the default
# branch wrote them. Look for "Cache hit" in the log of the two restore steps.

on:
  workflow_call:
    inputs:
      channel: { description: 'stable, beta or nightly; also the GitHub Environment that holds the signing key', required: true, type: string }
      kid: { description: 'id of the channel signing key in release-keys.txt (r1, b1, n1)', required: true, type: string }
      version: { description: 'manifest version, full SemVer', required: true, type: string }
      tag: { description: 'release tag of the mirror release in the product repo', required: true, type: string }
      sha: { description: 'commit to build', required: true, type: string }
      publish: { description: 'upload to R2, create the mirror release and move the aliases and pointers', required: true, type: boolean }
      prerelease: { required: true, type: boolean }
      latest: { description: 'GitHub marks it as the latest release (only stable)', required: true, type: boolean }
      aliases: { description: 'space separated rolling releases that may point at it', required: false, type: string, default: '' }
      deploy: { description: 'deploy the channel client after publishing, in the same approved job (stable and beta)', required: false, type: boolean, default: false }
      notes: { description: 'text put before the generated release notes', required: false, type: string, default: '' }

permissions:
  contents: read

defaults:
  run:
    shell: quiet {0}

env:
  TB_EVENT: ${{ github.event.client_payload.event || github.event_name }}
  TB_TAG: ${{ github.event.client_payload.tag }}
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          sha: ${{ github.event.client_payload.sha }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}

      # A dry run may use any version (the default is 0.0.0); the gates of the wrappers hold a published one to the tag.
      - name: The version has the Cargo.toml version as its core
        if: inputs.publish
        env:
          VERSION: ${{ inputs.version }}
        run: |
          crate="$(grep -m1 '^version' packages/server/Cargo.toml | cut -d'"' -f2)"
          case "$VERSION" in
            "$crate"|"$crate"-*) ;;
            *) echo "version $VERSION does not start from packages/server/Cargo.toml version $crate"; exit 1 ;;
          esac

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      # The same keys as the static job of ci.yaml. Restore only: save-if is false.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: static-${{ matrix.arch }}
          key: ${{ matrix.target }}
          save-if: false

      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          TERMENBOX_BUILD: ${{ inputs.sha }}
          # the binary reports the full SemVer, and so knows its own channel
          TERMENBOX_RELEASE_VERSION: ${{ inputs.version }}
        run: cargo build --release --locked -p termenbox-server --target ${{ matrix.target }}

      - name: Gate - the binary reports the release version, not a dev build
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
        run: |
          bin=target/$TARGET/release/termenbox-server
          if [ "$ARCH" = x86_64 ]; then
            test "$("$bin" --version)" = "termenbox-server $VERSION"
          fi
          # the commit is baked in: a binary run on a host has no TERMENBOX_BUILD to read
          sha="$SHA"
          strings "$bin" | grep -q "${sha:0:7}"

      - name: Gate - the binary is fully static
        run: |
          bin=target/${{ matrix.target }}/release/termenbox-server
          strip "$bin"
          if readelf -l "$bin" | grep -q INTERP; then echo "the binary asks for a dynamic loader"; exit 1; fi
          if readelf -d "$bin" 2>/dev/null | grep -q NEEDED; then echo "the binary needs shared libraries"; exit 1; fi
          mkdir -p dist
          cp "$bin" dist/termenbox-server-${{ matrix.arch }}-linux

      # The tmux build depends on the pinned sources only, not on the version: take the one the tmux job of ci.yaml saved
      # (the same key), and build it here only when it is not there.
      - name: Restore the bundled tmux built by CI
        id: tmux
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmux-out
          key: tmux-${{ matrix.arch }}-${{ hashFiles('.github/scripts/build-tmux.sh') }}

      - name: Build the bundled tmux (pinned sources, static, terminfo compiled in)
        if: steps.tmux.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y bison
          .github/scripts/build-tmux.sh tmux-out

      - name: Gate - tmux is static and runs with an empty PATH and no terminfo on the host
        run: |
          .github/scripts/check-tmux.sh tmux-out/tmux
          cp tmux-out/tmux dist/tmux-${{ matrix.arch }}-linux

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/termenbox-server-${{ matrix.arch }}-linux
            dist/tmux-${{ matrix.arch }}-linux
          retention-days: 7

      # The licence texts are the same for both architectures; one copy ships next to the binaries.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.arch == 'x86_64'
        with:
          name: release-tmux-notices
          path: |
            tmux-out/tmux-COPYING
            tmux-out/tmux-libevent-LICENSE
            tmux-out/tmux-ncurses-COPYING
          retention-days: 7

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          key: ${{ secrets.LOG_KEY }}
          name: build-${{ strategy.job-index }}
          status: ${{ job.status }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.REPORTER_APP_KEY }}

  # Every channel's release workflow calls docker-build.yaml as its `Image` job beside this workflow, so the image may
  # still be building: wait for the multi-architecture tag and record the digests the signed manifest will name. It holds
  # no secret. A dry run pushes none.
  # The build is not a job this one needs, so while it waits the script asks whether the "Image / " jobs of this run
  # already failed or were cancelled and then stops at once (the 70 minutes stay as the backstop). The manifest job needs
  # this one, so a failed image build leaves it skipped and nothing is published.
  image:
    name: Image digests
    needs: build
    if: inputs.publish
    environment: ${{ inputs.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
      - uses: termenbox/termenbox-ci/.github/actions/release-tools@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          sha: ${{ github.event.client_payload.sha }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USER || 'termenbox' }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Wait for the image of this version and read its digests
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 "$TB_RELEASE_TOOLS/image_digests.py" "ghcr.io/termenbox/termenbox:${VERSION}" image-digests.json --commit "$SHA" --wait 4200 --build-jobs "Image / "
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-image
          path: image-digests.json
          retention-days: 7

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          key: ${{ secrets.LOG_KEY }}
          name: image-${{ strategy.job-index }}
          status: ${{ job.status }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          secrets: |-
            ${{ secrets.GHCR_TOKEN }}
            ${{ secrets.GITHUB_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.REPORTER_APP_KEY }}

  # The manifest is written, signed, checked, published and deployed by five jobs so that no job runs code it does not
  # need while it holds a credential:
  #   manifest  source scripts, no Environment, no secret of a channel: writes the unsigned manifest
  #   sign      the release signing key, ci-repo code only: no checkout of the source, no package install, no built binary
  #   verify    no Environment: runs the built server binary against the signed manifest, writes SHA256SUMS
  #   publish   R2 and mirror credentials: uploads what verify checked
  #   deploy    Cloudflare credentials: the client of the channel
  manifest:
    name: Manifest
    needs: [build, image]
    # The image job is skipped for a dry run; anything else that skipped or failed must stop here.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CHANNEL: ${{ inputs.channel }}
      KID: ${{ inputs.kid }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      PUBLISH: ${{ inputs.publish }}
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
      - uses: termenbox/termenbox-ci/.github/actions/release-tools@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          sha: ${{ github.event.client_payload.sha }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Write the manifest
        run: |
          image=""; [ ! -f dist/image-digests.json ] || image="--image-digests dist/image-digests.json"
          python3 "$TB_RELEASE_TOOLS/make_manifest.py" "$VERSION" dist dist/manifest.json --channel "$CHANNEL" --tag "$TAG" $image

      - name: The manifest lists tmux for both architectures, with its notices
        run: |
          cat dist/manifest.json
          python3 - <<'PY'
          import json
          m = json.load(open("dist/manifest.json"))
          for arch in ("x86_64", "aarch64"):
              assert m["tmux"][arch]["url"].endswith(f"/tmux-{arch}-linux"), arch
              assert len(m["tmux"][arch]["sha256"]) == 64, arch
          assert sorted(m["tmux_notices"]) == ["tmux-COPYING", "tmux-libevent-LICENSE", "tmux-ncurses-COPYING"]
          PY

      - name: Keep the key list that signs and verifies
        run: |
          mkdir -p keys
          cp packages/server/release-keys.txt keys/release-keys.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-manifest
          path: |
            dist/manifest.json
            keys/release-keys.txt
          retention-days: 7

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          key: ${{ secrets.LOG_KEY }}
          name: manifest-${{ strategy.job-index }}
          status: ${{ job.status }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.REPORTER_APP_KEY }}

  sign:
    name: Sign the manifest
    needs: [manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The signing key is the secret RELEASE_SIGNING_KEY of this environment, so a channel's key is only ever
    # available to a run of that channel. This job checks out nothing; the only code it runs is this workflow and the
    # release-tools copy of this repository, and it signs nothing before the manifest matches the built files.
    environment: ${{ inputs.channel }}
    permissions:
      contents: read
    env:
      CHANNEL: ${{ inputs.channel }}
      KID: ${{ inputs.kid }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      PUBLISH: ${{ inputs.publish }}
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
      - uses: termenbox/termenbox-ci/.github/actions/release-tools@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: unsigned-manifest
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: built
          merge-multiple: true

      # The build jobs run the source's code and could upload any manifest: sign only what is exactly the built files.
      - name: The manifest is the one of the built files
        run: python3 "$TB_RELEASE_TOOLS/check_manifest.py" dist/manifest.json built "$VERSION" "$CHANNEL"

      - name: Sign the manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          # A dry run never touches the real key, so it also works for a channel whose key is not set up yet.
          if [ -n "$RELEASE_SIGNING_KEY" ] && [ "$PUBLISH" = true ]; then
            printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release_key"
            cp keys/release-keys.txt "$RUNNER_TEMP/release-keys.txt"
          elif [ "$PUBLISH" = true ]; then
            echo "RELEASE_SIGNING_KEY is not set in the $CHANNEL environment: refusing to publish an unsigned release"; exit 1
          else
            echo "::warning::dry run: signing with a throwaway key"
            ssh-keygen -q -t ed25519 -N '' -C throwaway -f "$RUNNER_TEMP/release_key"
            bound=""; [ "$CHANNEL" = stable ] || bound=" channel=$CHANNEL"
            echo "$KID $(cut -d' ' -f1,2 "$RUNNER_TEMP/release_key.pub")$bound" > "$RUNNER_TEMP/release-keys.txt"
          fi
          ssh-keygen -Y sign -n termenbox-release -f "$RUNNER_TEMP/release_key" dist/manifest.json
          rm -f "$RUNNER_TEMP/release_key"
          # the same check the installer makes with plain ssh-keygen
          # only the channel's own key counts: a key of another channel (the stable key in a beta environment) is refused here
          grep -v '^#' "$RUNNER_TEMP/release-keys.txt" | awk -v kid="$KID" '$1 == kid && NF >= 3 { print "termenbox-release " $2 " " $3 }' > "$RUNNER_TEMP/allowed_signers"
          [ -s "$RUNNER_TEMP/allowed_signers" ] || { echo "release-keys.txt has no key $KID: add its public half (owner work, decision 0130)"; exit 1; }
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I termenbox-release -n termenbox-release -s dist/manifest.json.sig < dist/manifest.json
          cp "$RUNNER_TEMP/release-keys.txt" keys/release-keys.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-manifest
          path: |
            dist/manifest.json
            dist/manifest.json.sig
            keys/release-keys.txt
          retention-days: 7

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          key: ${{ secrets.LOG_KEY }}
          name: sign-${{ strategy.job-index }}
          status: ${{ job.status }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.RELEASE_SIGNING_KEY }}
            ${{ secrets.REPORTER_APP_KEY }}

  verify:
    name: Verify, licence and SHA256SUMS
    needs: [sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CHANNEL: ${{ inputs.channel }}
      KID: ${{ inputs.kid }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      PUBLISH: ${{ inputs.publish }}
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          sha: ${{ github.event.client_payload.sha }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-manifest
          path: .

      - name: The server binary accepts what was just signed
        run: |
          TERMENBOX_RELEASE_KEYS_FILE="$PWD/keys/release-keys.txt"
          chmod +x dist/termenbox-server-x86_64-linux
          # this binary was built with the release version, so it follows the channel being released
          TERMENBOX_RELEASE_KEYS="$(cat "$TERMENBOX_RELEASE_KEYS_FILE")" dist/termenbox-server-x86_64-linux \
            --verify-release dist/manifest.json --release-sig dist/manifest.json.sig --release-arch aarch64 | tee "$RUNNER_TEMP/verify.txt"
          grep -qx "kid=$KID" "$RUNNER_TEMP/verify.txt"
          grep -qx "version=$VERSION" "$RUNNER_TEMP/verify.txt"
          # and refuses a changed manifest
          cp dist/manifest.json "$RUNNER_TEMP/changed.json" && echo ' ' >> "$RUNNER_TEMP/changed.json"
          if TERMENBOX_RELEASE_KEYS="$(cat "$TERMENBOX_RELEASE_KEYS_FILE")" dist/termenbox-server-x86_64-linux \
            --verify-release "$RUNNER_TEMP/changed.json" --release-sig dist/manifest.json.sig; then echo "a changed manifest was accepted"; exit 1; fi

      # The installer of the release, with this channel's address, keys and version floor baked in (what /i serves), so a
      # person can fetch it from the release of the product repo instead of from the hosting account. Stable and beta only.
      - name: The installer of this release
        run: |
          case "$CHANNEL" in
            stable) origin=https://app.termenbox.dev ;;
            beta) origin=https://beta.app.termenbox.dev ;;
            *) exit 0 ;;
          esac
          CHANNEL="$CHANNEL" ORIGIN="$origin" node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { bakeInstaller } from "./packages/client/installer/bake.mjs";
            const r = (p) => readFileSync(p, "utf8");
            writeFileSync("dist/install.sh", bakeInstaller(r("packages/client/installer/install.sh"), process.env.ORIGIN, process.env.CHANNEL,
              r("packages/server/release-keys.txt"), r("packages/client/bundle-keys.txt"), r("packages/client/bundle-min-version.txt")));
          '
          sh -n dist/install.sh

      # The licence texts and the two checked scripts (the docs link them as release assets) ship next to the binaries, and SHA256SUMS lets a second host be compared byte for byte.
      - name: Licence, notices and SHA256SUMS
        run: |
          cp LICENSE NOTICES dist/
          # a tag cut from a commit before the scripts existed ships without them (check_sums.py lists them as optional)
          extra=""; [ ! -f dist/install.sh ] || extra="install.sh"
          for s in install-verified.sh uninstall-verified.sh; do
            if [ -f "scripts/$s" ]; then cp "scripts/$s" dist/; extra="$extra $s"; fi
          done
          (cd dist && sha256sum termenbox-server-*-linux tmux-*-linux tmux-COPYING tmux-libevent-LICENSE tmux-ncurses-COPYING LICENSE NOTICES $extra manifest.json manifest.json.sig > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-manifest
          path: |
            dist/manifest.json
            dist/manifest.json.sig
            dist/SHA256SUMS
            dist/LICENSE
            dist/NOTICES
            dist/install-verified.sh
            dist/uninstall-verified.sh
            dist/install.sh
          retention-days: 7
          if-no-files-found: warn

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          key: ${{ secrets.LOG_KEY }}
          name: verify-${{ strategy.job-index }}
          status: ${{ job.status }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.REPORTER_APP_KEY }}

  sign-sums:
    name: Sign SHA256SUMS
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds the signing key like the sign job and runs only ci-repo code: it recomputes every hash itself, then signs
    # SHA256SUMS in a namespace of its own, so this signature can never be replayed as the signature of a manifest.
    environment: ${{ inputs.channel }}
    permissions:
      contents: read
    env:
      CHANNEL: ${{ inputs.channel }}
      KID: ${{ inputs.kid }}
      VERSION: ${{ inputs.version }}
      PUBLISH: ${{ inputs.publish }}
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
      - uses: termenbox/termenbox-ci/.github/actions/release-tools@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-manifest
          path: signed

      - name: SHA256SUMS lists exactly the release files
        run: python3 "$TB_RELEASE_TOOLS/check_sums.py" dist/SHA256SUMS dist signed/dist/manifest.json

      - name: Sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          if [ -n "$RELEASE_SIGNING_KEY" ] && [ "$PUBLISH" = true ]; then
            printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release_key"
            cp signed/keys/release-keys.txt "$RUNNER_TEMP/release-keys.txt"
          elif [ "$PUBLISH" = true ]; then
            echo "RELEASE_SIGNING_KEY is not set in the $CHANNEL environment: refusing to publish an unsigned release"; exit 1
          else
            echo "::warning::dry run: signing with a throwaway key"
            ssh-keygen -q -t ed25519 -N '' -C throwaway -f "$RUNNER_TEMP/release_key"
            bound=""; [ "$CHANNEL" = stable ] || bound=" channel=$CHANNEL"
            echo "$KID $(cut -d' ' -f1,2 "$RUNNER_TEMP/release_key.pub")$bound" > "$RUNNER_TEMP/release-keys.txt"
          fi
          ssh-keygen -Y sign -n termenbox-sums -f "$RUNNER_TEMP/release_key" dist/SHA256SUMS
          rm -f "$RUNNER_TEMP/release_key"
          grep -v '^#' "$RUNNER_TEMP/release-keys.txt" | awk -v kid="$KID" '$1 == kid && NF >= 3 { print "termenbox-release " $2 " " $3 }' > "$RUNNER_TEMP/allowed_signers"
          [ -s "$RUNNER_TEMP/allowed_signers" ] || { echo "release-keys.txt has no key $KID"; exit 1; }
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I termenbox-release -n termenbox-sums -s dist/SHA256SUMS.sig < dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-sums-signature
          path: dist/SHA256SUMS.sig
          retention-days: 7

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          key: ${{ secrets.LOG_KEY }}
          name: sign-sums-${{ strategy.job-index }}
          status: ${{ job.status }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.RELEASE_SIGNING_KEY }}
            ${{ secrets.REPORTER_APP_KEY }}

  publish:
    name: Publish
    needs: [verify, sign-sums]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pointer moves are one read and two writes with a forward-only check between them, so two releases that can move the
    # same pointer must not overlap. A stable release moves the stable and the beta pointer, a beta release the beta one,
    # a nightly its own: so anything that can write the beta pointer is in r2-pointers-beta, and nothing writes the stable
    # pointer alone (hence no r2-pointers-stable); nightly is r2-pointers-nightly. A run behind another waits; a newer one
    # replaces the one still waiting (GitHub keeps one pending run per group), so the newest release of the group wins and
    # the displaced one is run again by hand. A freeze is NOT in these groups (release-freeze.yaml has its own per channel,
    # so a release can never displace a waiting freeze); publish_r2.sh's forward-only check, which reads each pointer
    # right before it writes it, is what keeps a release and a freeze that overlap from moving a pointer backwards.
    concurrency:
      group: r2-pointers-${{ inputs.channel == 'nightly' && 'nightly' || 'beta' }}
      cancel-in-progress: false
    environment: ${{ inputs.channel }}
    permissions:
      contents: write
      deployments: write
    env:
      CHANNEL: ${{ inputs.channel }}
      KID: ${{ inputs.kid }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      PUBLISH: ${{ inputs.publish }}
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
      - uses: termenbox/termenbox-ci/.github/actions/release-tools@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          sha: ${{ github.event.client_payload.sha }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      # The fast path: what the installer and the helper fetch. Versioned objects are immutable; the channel pointer
      # only moves forward (publish_r2.sh). The key is the secret of this channel's environment, scoped to the bucket.
      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_RELEASE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
          ALIASES: ${{ inputs.aliases }}
        run: sh "$TB_RELEASE_TOOLS/publish_r2.sh" dist "$CHANNEL" "$VERSION" "$ALIASES"

      # The mirror: the same files in a Release of the public product repo (MIRROR_TOKEN, GH_REPO below),
      # which the installer falls back to only for a manifest R2 cannot serve. The source commit is not in that repo,
      # so the release has no --target and the notes name the commit.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          GH_REPO: termenbox/termenbox
          SHA: ${{ inputs.sha }}
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
          LATEST: ${{ inputs.latest }}
        run: |
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          if [ "$LATEST" = true ]; then args+=(--latest); else args+=(--latest=false); fi
          body="Built from source commit ${SHA}. Mirror of https://dl.termenbox.dev/${CHANNEL}/${VERSION}/: SHA256SUMS lists every file, and the signed manifest.json is what installers trust, not this host."
          if [ -n "$NOTES" ]; then body="${NOTES}"$'\n\n'"${body}"; fi
          files=(dist/termenbox-server-x86_64-linux dist/termenbox-server-aarch64-linux
            dist/tmux-x86_64-linux dist/tmux-aarch64-linux dist/tmux-COPYING dist/tmux-libevent-LICENSE dist/tmux-ncurses-COPYING
            dist/LICENSE dist/NOTICES dist/SHA256SUMS dist/manifest.json dist/manifest.json.sig)
          for f in install.sh install-verified.sh uninstall-verified.sh; do [ ! -f "dist/$f" ] || files+=("dist/$f"); done
          files+=(dist/SHA256SUMS.sig)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A run again after R2 succeeded and this step did not. The R2 step above has just found the published manifest
            # to be the one built here (it fails otherwise), so completing the same release adds nothing new. A manifest
            # already on the Release must be that one too.
            mkdir -p "$RUNNER_TEMP/held"
            if gh release download "$TAG" -p manifest.json -D "$RUNNER_TEMP/held" --clobber 2>/dev/null; then
              cmp -s "$RUNNER_TEMP/held/manifest.json" dist/manifest.json || { echo "$TAG exists with a different manifest: left alone"; exit 1; }
            fi
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes "$body" "${args[@]}" "${files[@]}"
          fi

      # The rolling releases of the mirror only ever move forward (a stable release moves channel-beta when it is newer than the
      # last beta); they hold a copy of the manifest and nothing else, the assets stay under the tag above.
      - name: Move the aliases
        if: inputs.aliases != ''
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          GH_REPO: termenbox/termenbox
          ALIASES: ${{ inputs.aliases }}
        run: |
          for alias in $ALIASES; do
            sh "$TB_RELEASE_TOOLS/update_alias.sh" "$alias" dist/manifest.json dist/manifest.json.sig
          done

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          key: ${{ secrets.LOG_KEY }}
          name: publish-${{ strategy.job-index }}
          status: ${{ job.status }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.MIRROR_TOKEN }}
            ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
            ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
            ${{ secrets.REPORTER_APP_KEY }}

  # The client is built in a job that holds no deploy credential: it reads the public client id and the source token, and
  # hands packages/client/dist to the deploy job as an artifact. The job that holds the Cloudflare token, the function
  # secrets and the certificate key installs only from the lockfile, without install scripts.
  build-client:
    name: Build the client
    needs: [publish]
    if: ${{ inputs.publish && inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.channel }}
    permissions:
      contents: read
    env:
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ inputs.version }}
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          sha: ${{ github.event.client_payload.sha }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}

      - name: Build the client
        uses: ./.github/actions/build-client
        with:
          channel: ${{ inputs.channel }}
          version: ${{ inputs.version }}
          github-client-id: ${{ secrets.TERMENBOX_GITHUB_CLIENT_ID }}
          client-origin: ${{ vars.TERMENBOX_CLIENT_ORIGIN }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: client-dist
          path: packages/client/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          key: ${{ secrets.LOG_KEY }}
          name: build-client-${{ strategy.job-index }}
          status: ${{ job.status }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.TERMENBOX_GITHUB_CLIENT_ID }}
            ${{ secrets.REPORTER_APP_KEY }}

  deploy:
    name: Deploy the client
    needs: [build-client, publish]
    if: ${{ inputs.publish && inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The client of this channel, from the same commit, after the release is published; a failure leaves the release
    # published and the run red. Two deploys of one channel do not overlap.
    concurrency:
      group: pages-deploy-${{ inputs.channel }}
      cancel-in-progress: false
    environment: ${{ inputs.channel }}
    permissions:
      contents: write
      deployments: write
    env:
      CHANNEL: ${{ inputs.channel }}
      KID: ${{ inputs.kid }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
      PUBLISH: ${{ inputs.publish }}
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          sha: ${{ github.event.client_payload.sha }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: client-dist
          path: packages/client/dist

      - name: Deploy the client
        uses: ./.github/actions/deploy-pages
        with:
          channel: ${{ inputs.channel }}
          stage-tag: ${{ inputs.tag }}
          github-token: ${{ secrets.MIRROR_TOKEN }}
          release-repo: termenbox/termenbox
          pages-project-name: ${{ vars.TERMENBOX_PAGES_PROJECT_NAME }}
          d1-database-id: ${{ vars.TERMENBOX_D1_DATABASE_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github-client-id: ${{ secrets.TERMENBOX_GITHUB_CLIENT_ID }}
          github-client-secret: ${{ secrets.TERMENBOX_GITHUB_CLIENT_SECRET }}
          cert-signing-key: ${{ secrets.TERMENBOX_CERT_SIGNING_KEY }}
          cert-kid: ${{ vars.TERMENBOX_CERT_KID }}
          directory-salt: ${{ secrets.TERMENBOX_DIRECTORY_SALT }}

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          key: ${{ secrets.LOG_KEY }}
          name: deploy-${{ strategy.job-index }}
          status: ${{ job.status }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          secrets: |-
            ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            ${{ secrets.CLOUDFLARE_API_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.MIRROR_TOKEN }}
            ${{ secrets.TERMENBOX_CERT_SIGNING_KEY }}
            ${{ secrets.TERMENBOX_DIRECTORY_SALT }}
            ${{ secrets.TERMENBOX_GITHUB_CLIENT_ID }}
            ${{ secrets.TERMENBOX_GITHUB_CLIENT_SECRET }}
            ${{ secrets.REPORTER_APP_KEY }}

  # Reads the origin the way a browser does once the deployment is up; it holds no secret and runs code of this repository
  # only. A failure leaves the deployment in place and turns the run red.
  verify-origin:
    name: Verify the origin
    needs: [deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the origin
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          case "$CHANNEL" in
            stable) host=app.termenbox.dev ;;
            beta) host=beta.app.termenbox.dev ;;
            nightly) host=nightly.app.termenbox.dev ;;
            *) echo "unknown channel"; exit 1 ;;
          esac
          node release/verify_origin.mjs "https://$host" "$CHANNEL" 150

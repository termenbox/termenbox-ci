name: Deploy control plane
run-name: "Deploy control plane · ${{ inputs.sha || 'head of develop' }}"
# Deploys the organisation control plane Worker (packages/control of the source) to the owner's Cloudflare account.
# The job sits in the `cloud` environment, whose required reviewer is the owner: nothing runs until they approve. The Worker's
# signing secret (POLICY_SIGNER) is put in by the owner with `wrangler secret put`; this workflow never reads or sets it.
# Only status lines are printed, never wrangler's raw output.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Source commit to deploy; empty means the head of develop'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: deploy-control
jobs:
  deploy:
    name: Deploy control plane (cloud)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: wrangler@3.114.0
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@8a830ae40dc43ed9db9c18a5bc7d30c965eab7c1
        with:
          sha: ${{ inputs.sha }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Credentials are set
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "the cloud environment lacks CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Control plane tests
        working-directory: packages/control
        run: |
          npm install --no-audit --no-fund --ignore-scripts >/dev/null 2>&1 || { echo "npm install failed"; exit 1; }
          npx vitest run 2>&1 | tail -6
      - name: Database and bucket exist
        working-directory: packages/control
        run: |
          # `d1 info` fails when the database is missing: create it, then read its id (an identifier, not a secret).
          npx --yes "$WRANGLER" d1 info termenbox-control --json >/dev/null 2>&1 || npx --yes "$WRANGLER" d1 create termenbox-control >/dev/null 2>&1 || { echo "d1 create failed"; exit 1; }
          id=$(npx --yes "$WRANGLER" d1 info termenbox-control --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.uuid||j.id||"")})')
          case "$id" in ????????-????-????-????-????????????) ;; *) echo "no database id"; exit 1;; esac
          sed -i "s/SET-BY-THE-DEPLOY-WORKFLOW/$id/" wrangler.toml
          grep -q SET-BY-THE-DEPLOY-WORKFLOW wrangler.toml && { echo "the id was not substituted"; exit 1; }
          # The schema is written with IF NOT EXISTS: running it again changes nothing.
          npx --yes "$WRANGLER" d1 execute termenbox-control --remote --file schema.sql >/dev/null 2>&1 || { echo "schema failed"; exit 1; }
          npx --yes "$WRANGLER" r2 bucket create termenbox-control --jurisdiction eu >/dev/null 2>&1 || true
          echo "database and bucket ready"
      - name: Deploy
        id: deploy
        working-directory: packages/control
        run: |
          out=$(npx --yes "$WRANGLER" deploy 2>&1) || { echo "deploy failed"; printf '%s\n' "$out" | grep -iE 'error|✘|code:|authenticat|permission|account' | grep -v WARNING | sed -E 's/[0-9a-f]{32}/<id>/g' | head -8 | cut -c1-200; exit 1; }
          url=$(printf '%s\n' "$out" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -n1)
          [ -n "$url" ] || { echo "no address in the deploy output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "control plane: $url"
      - name: Health
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.url }}/v1/health")
          echo "health: $code"
          [ "$code" = 200 ]

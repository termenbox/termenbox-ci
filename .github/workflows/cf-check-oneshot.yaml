# One-shot: reports which Cloudflare account the nightly token can reach, as status codes only. Deleted after use.
name: cf-check-oneshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: nightly
    steps:
      - name: Probe
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUR: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB: 93cd229e-b170-4981-b6d2-b061e4e53767
        run: |
          api() { curl -s -o /tmp/r.json -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          errs() { jq -r '[.errors[]?.code]|join(",")' /tmp/r.json 2>/dev/null; }
          c=$(api /user/tokens/verify); echo "token verify: http $c status=$(jq -r '.result.status // "?"' /tmp/r.json) errs=$(errs)"
          c=$(api "/accounts?per_page=50"); echo "accounts: http $c count=$(jq -r '.result|length' /tmp/r.json 2>/dev/null) errs=$(errs)"
          for a in 2ebe27d03814e04c2d72b0794028021d 187a93aa6a09acee72306a0322600398; do
            tag=${a%"${a#????}"}
            echo "account $tag...: visible=$(jq -r --arg a "$a" '[.result[]?|select(.id==$a)]|length' /tmp/r.json 2>/dev/null)"
          done
          c=$(api "/accounts?per_page=50")
          for a in 2ebe27d03814e04c2d72b0794028021d 187a93aa6a09acee72306a0322600398; do
            tag=${a%"${a#????}"}
            c=$(api "/accounts/$a/d1/database/$DB"); echo "$tag d1 get: http $c errs=$(errs)"
            c=$(api "/accounts/$a/pages/projects/termenbox-nightly"); echo "$tag pages get: http $c errs=$(errs)"
            c=$(api "/accounts/$a/r2/buckets/termenbox-releases"); echo "$tag r2 get: http $c errs=$(errs)"
          done
          if [ "$CUR" = 2ebe27d03814e04c2d72b0794028021d ]; then echo "nightly account secret: 2ebe"; elif [ "$CUR" = 187a93aa6a09acee72306a0322600398 ]; then echo "nightly account secret: 187a"; else echo "nightly account secret: other"; fi

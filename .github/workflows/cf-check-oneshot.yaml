# One-shot: reports what the nightly token reaches in the release account, as status codes only. Deleted after use.
name: cf-check-oneshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: nightly
    steps:
      - name: Probe
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ vars.R2_RELEASE_ACCOUNT_ID }}
          DB: 93cd229e-b170-4981-b6d2-b061e4e53767
        run: |
          api() { curl -s -o /tmp/r.json -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          errs() { jq -r '[.errors[]?.code]|join(",")' /tmp/r.json 2>/dev/null; }
          c=$(api "/accounts?per_page=50"); echo "accounts: http $c count=$(jq -r '.result|length' /tmp/r.json 2>/dev/null) has-release-account=$(jq -r --arg a "$ACC" '[.result[]?|select(.id==$a)]|length' /tmp/r.json 2>/dev/null)"
          c=$(api "/accounts/$ACC/d1/database/$DB"); echo "d1 get: http $c errs=$(errs)"
          c=$(api "/accounts/$ACC/pages/projects/termenbox-nightly"); echo "pages get: http $c errs=$(errs)"
          c=$(api "/accounts/$ACC/pages/projects"); echo "pages list: http $c errs=$(errs)"
          c=$(api "/accounts/$ACC/r2/buckets/termenbox-releases"); echo "r2 get: http $c errs=$(errs)"
          c=$(api "/accounts/$ACC/d1/database"); echo "d1 list: http $c errs=$(errs)"

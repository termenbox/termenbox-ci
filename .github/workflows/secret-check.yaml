name: secret-check
# Checks the secrets of each Environment without printing a value: not a placeholder, plausible format, and where the
# service allows it a live call (Cloudflare token verify, the channel's release key against release-keys.txt).
# beta, stable and cloud wait for the owner's approval like any run that uses their secrets.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ matrix.env }}
    strategy:
      fail-fast: false
      matrix:
        env: [nightly, site, smoke, beta, stable, cloud]
    env:
      ENVNAME: ${{ matrix.env }}
      SRC_TOKEN: ${{ secrets.SOURCE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
      TERMENBOX_CERT_SIGNING_KEY: ${{ secrets.TERMENBOX_CERT_SIGNING_KEY }}
      TERMENBOX_DIRECTORY_SALT: ${{ secrets.TERMENBOX_DIRECTORY_SALT }}
      TERMENBOX_GITHUB_CLIENT_ID: ${{ secrets.TERMENBOX_GITHUB_CLIENT_ID }}
      TERMENBOX_GITHUB_CLIENT_SECRET: ${{ secrets.TERMENBOX_GITHUB_CLIENT_SECRET }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check this environment's secrets
        run: |
          fail=0
          ok()  { echo "pass  $ENVNAME/$1"; }
          bad() { echo "FAIL  $ENVNAME/$1 ($2)"; fail=1; }
          # has NAME REGEX DESCRIPTION: set, not the placeholder, matching the format
          has() {
            eval "v=\${$1:-}"
            if [ -z "$v" ]; then return 0; fi   # not used in this environment
            if [ "$v" = "__FILL_ME__" ]; then bad "$1" "still the placeholder"; return 0; fi
            if [ -n "$2" ] && ! printf '%s' "$v" | grep -Eq "$2"; then bad "$1" "unexpected format: $3"; return 0; fi
            ok "$1"
          }
          has CLOUDFLARE_ACCOUNT_ID '^[0-9a-f]{32}$' "32 hex characters"
          has TERMENBOX_DIRECTORY_SALT '^.{32,}$' "32+ characters"
          has TERMENBOX_GITHUB_CLIENT_ID '^(Iv1\.|Ov23)[A-Za-z0-9]{8,}$' "an OAuth app client id"
          has TERMENBOX_GITHUB_CLIENT_SECRET '^[0-9a-f]{40}$' "40 hex characters"
          has GHCR_TOKEN '^ghp_[A-Za-z0-9]{36,}$' "a classic token (ghp_...) with write:packages; a fine-grained token cannot push packages"
          has R2_ACCESS_KEY_ID '^[0-9a-f]{32}$' "32 hex characters"
          has R2_SECRET_ACCESS_KEY '^[0-9a-f]{64}$' "64 hex characters"
          has ANTHROPIC_API_KEY '^(sk-ant-|nvapi-)' "starts with sk-ant- or nvapi-"
          has TERMENBOX_CERT_SIGNING_KEY '^.{32,}$' "32+ characters"
          # Cloudflare: a live verify (account-owned token, then user-owned)
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ "$CLOUDFLARE_API_TOKEN" != "__FILL_ME__" ]; then
            v=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
            printf '%s' "$v" | grep -q '"status":"active"' || v=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
            printf '%s' "$v" | grep -q '"status":"active"' && ok "CLOUDFLARE_API_TOKEN (active)" || bad CLOUDFLARE_API_TOKEN "not active"
          elif [ "$CLOUDFLARE_API_TOKEN" = "__FILL_ME__" ]; then bad CLOUDFLARE_API_TOKEN "still the placeholder"; fi
          # The release signing key: an OpenSSH private key whose public half is this channel's line in release-keys.txt
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            if [ "$RELEASE_SIGNING_KEY" = "__FILL_ME__" ]; then bad RELEASE_SIGNING_KEY "still the placeholder"
            else
              umask 077; printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/k"
              if pub=$(ssh-keygen -y -f "$RUNNER_TEMP/k" 2>/dev/null | awk '{print $2}') && [ -n "$pub" ]; then
                keys=$(curl -s -H "Authorization: Bearer $SRC_TOKEN" -H 'Accept: application/vnd.github.raw' "https://api.github.com/repos/termenbox/termenbox/contents/packages/server/release-keys.txt?ref=develop")
                if printf '%s\n' "$keys" | grep -v '^#' | awk -v ch="$ENVNAME" '{c="stable"; if ($4 ~ /^channel=/) c=substr($4,9); if (c==ch) print $3}' | grep -qxF "$pub"; then ok "RELEASE_SIGNING_KEY (matches the $ENVNAME key in release-keys.txt)"
                else bad RELEASE_SIGNING_KEY "valid key, but not the $ENVNAME key listed in release-keys.txt"; fi
              else bad RELEASE_SIGNING_KEY "not a readable OpenSSH private key"; fi
              rm -f "$RUNNER_TEMP/k"
            fi
          fi
          exit $fail

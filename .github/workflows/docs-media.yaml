name: Docs Media

# Renders the documentation videos on scripted data, puts them on a Pages preview and opens a review issue for the
# owner. It runs by hand (GitHub lets only people with write access run it) and at every stable release tag, where it renders
# the videos whose inputs changed since they were approved (scripts/docs-media-stale.mjs) and renders nothing when none did.
# Nothing is published by this workflow: the owner approves in the review issue. Never a pull-request-triggered run with
# secrets. Inputs reach the steps through env, never spliced into a script. Replaces dialog-videos.yaml once the first
# publication is approved (plan 7.2).
on:
  repository_dispatch:
    types: [source-tag]
  workflow_dispatch:
    inputs:
      case:
        description: all, stale (the videos whose inputs changed), stale-all (those and the ones that moved only by version), or case ids from `render.mjs --list`, separated by spaces
        type: string
        default: stale
      profile:
        description: Which screen
        type: choice
        options: [both, phone, desktop]
        default: both
      pace:
        description: Speed of the walkthrough
        type: choice
        options: [normal, slow]
        default: normal
      caption:
        description: Captions on the video
        type: choice
        options: ['on', 'off']
        default: 'on'
      voice:
        description: Add the spoken track (clips are committed in docs/media/voice; make them with voice-sync.mjs)
        type: choice
        options: ['on', 'off']
        default: 'on'

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: quiet {0}

env:
  TB_EVENT: ${{ github.event.client_payload.event || github.event_name }}
  TB_TAG: ${{ github.event.client_payload.tag }}

jobs:
  render:
    name: Render, preview and open the review
    # A tag event is a stable release only when the tag is vX.Y.Z: a beta or a nightly carries a suffix after a dash.
    if: github.event_name != 'repository_dispatch' || (startsWith(github.event.client_payload.tag, 'v') && !contains(github.event.client_payload.tag, '-'))
    environment: site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@bdbd793e55b6fc2bf0ca376be22060bef4e06622

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@bdbd793e55b6fc2bf0ca376be22060bef4e06622
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pnpm install --frozen-lockfile

      - name: Install the browser
        working-directory: packages/client
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Build the client and its e2e pages
        working-directory: packages/client
        run: pnpm run e2e:build

      # The case is a free string, so it is checked against the catalog before anything uses it.
      - name: Choose the cases
        id: pick
        working-directory: packages/client
        env:
          CASE: ${{ inputs.case || 'stale' }}
          PROFILE: ${{ inputs.profile || 'both' }}
        run: |
          node e2e/video/render.mjs --list --json > "$RUNNER_TEMP/catalog.json"
          # a marker that was deleted or renamed would leave the video out of its page without a word
          node ../../scripts/docs-media.mjs cases --catalog "$RUNNER_TEMP/catalog.json" ../../README.md $(find ../../docs -name '*.md')
          # stale and stale-all name the videos whose inputs changed since they were rendered; the list is made here, not typed
          case "$CASE" in
            stale) CASE=$(node ../../scripts/docs-media-stale.mjs --cases) || exit 1 ;;
            stale-all) CASE=$(node ../../scripts/docs-media-stale.mjs --cases --all) || exit 1 ;;
          esac
          export CASE
          node -e '
            const rows = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/catalog.json", "utf8"));
            const want = process.env.CASE.trim();
            const out = [];
            if (!want) {
              console.log("No video is stale: nothing to render.");
              out.push("go=false", "cases=", "profiles=", "real=false");
            } else {
              const ids = want.split(/\s+/);
              const pick = want === "all" ? rows.filter((r) => !r.template) : rows.filter((r) => ids.includes(r.id));
              const unknown = want === "all" ? [] : ids.filter((i) => !rows.some((r) => r.id === i));
              if (!pick.length || unknown.length) { console.error("unknown case " + unknown.join(" ") + "; choose all, stale, stale-all or case ids from: " + rows.map((r) => r.id).join(" ")); process.exit(1); }
              const profiles = process.env.PROFILE === "both" ? "phone desktop" : process.env.PROFILE;
              out.push("go=true", `cases=${pick.map((r) => r.id).join(" ")}`, `profiles=${profiles}`, `real=${pick.some((r) => r.real)}`);
            }
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
          '

      # The add-server walkthrough runs the real server binary (e2e/video/real-server.mjs).
      - name: Install Rust toolchain
        if: steps.pick.outputs.real == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.pick.outputs.real == 'true'
        with:
          shared-key: rust-ci
          save-if: false

      - name: Build the server
        if: steps.pick.outputs.real == 'true'
        run: cargo build --profile ci -p termenbox-server

      - name: Render
        if: steps.pick.outputs.go == 'true'
        working-directory: packages/client
        env:
          CASES: ${{ steps.pick.outputs.cases }}
          PROFILES: ${{ steps.pick.outputs.profiles }}
          PACE: ${{ inputs.pace || 'normal' }}
          CAPTION: ${{ inputs.caption || 'on' }}
          VOICE: ${{ inputs.voice || 'on' }}
          TERMENBOX_BIN: ${{ github.workspace }}/target/ci/termenbox-server
        run: |
          flags="--pace $PACE --skip-unsupported"; [ "$CAPTION" = off ] && flags="$flags --no-caption"
          if [ "$VOICE" = on ]; then
            # every sentence must already have its clip: the runner has no speech engine
            node e2e/video/voice-sync.mjs --check
            flags="$flags --voice"
          fi
          for c in $CASES; do
            for p in $PROFILES; do
              # shellcheck disable=SC2086
              node e2e/video/render.mjs --case "$c" --profile "$p" --out "$GITHUB_WORKSPACE/media" $flags
            done
          done
          ls -l "$GITHUB_WORKSPACE/media"

      - name: Build the review page
        if: steps.pick.outputs.go == 'true'
        run: node scripts/docs-media-review-page.mjs media

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.pick.outputs.go == 'true'
        with:
          name: docs-media-${{ github.run_id }}
          path: media
          retention-days: 7
          if-no-files-found: error

      - name: Install Wrangler
        if: steps.pick.outputs.go == 'true'
        run: npm install -g --ignore-scripts wrangler@4.158.0

      # A preview deployment on its own branch alias, never production (the site deploys from master).
      - name: Publish the preview
        if: steps.pick.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.TERMENBOX_SITE_PROJECT_NAME || 'termenbox-site' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          wrangler pages deploy media --project-name="$PROJECT" --branch="media-$RUN_ID"
          echo "PREVIEW_URL=https://media-$RUN_ID.$PROJECT.pages.dev" >> "$GITHUB_ENV"

      - name: Open the review issue
        if: steps.pick.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          GH_REPO: termenbox/termenbox-source
          RUN_ID: ${{ github.run_id }}
        run: |
          node scripts/docs-media-review-cli.mjs issue-body media > "$RUNNER_TEMP/body.md"
          gh label create docs-media --color 1d76db --description "Docs media review" 2>/dev/null || true
          title="Docs media review $RUN_ID"
          n=$(gh issue list --label docs-media --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue edit "$n" --body-file "$RUNNER_TEMP/body.md"
          else gh issue create --title "$title" --label docs-media --body-file "$RUNNER_TEMP/body.md"; fi

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@bdbd793e55b6fc2bf0ca376be22060bef4e06622
        with:
          key: ${{ secrets.LOG_KEY }}
          name: render-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            ${{ secrets.CLOUDFLARE_API_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}
            ${{ secrets.STATUS_TOKEN }}

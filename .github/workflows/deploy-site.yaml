name: Deploy landing site
run-name: "Deploy landing site · ${{ github.event.client_payload.pr && format('PR #{0}', github.event.client_payload.pr) || github.event.client_payload.tag || github.event.client_payload.event || 'manual' }}${{ (github.event.client_payload.sha || inputs.sha) && format(' · {0}', (github.event.client_payload.sha || inputs.sha)) || '' }}"

on:
  repository_dispatch:
    types: [source-master]
  # A stable release is published after master moves, so the changelog it adds reaches the site only through this: the site is
  # built again from the head of master when the release run has finished (a beta or a nightly carries a dash in its tag).
  workflow_run:
    workflows: ['Release (stable)']
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Source commit to run on (a test of this workflow from a ci-repo branch); empty means the head of develop'
        type: string
        required: false
        default: ''
      preview:
        description: 'Preview alias (letters, digits, dashes). Empty deploys production from master only.'
        required: false
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: quiet {0}

env:
  TB_EVENT: ${{ github.event.client_payload.event || github.event_name }}
  TB_TAG: ${{ github.event.client_payload.tag }}

jobs:
  # Generated: a push runs this workflow only when it changed one of the paths the original `on.push.paths` lists.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          EVENT: ${{ github.event.client_payload.event || 'other' }}
          BASE: ${{ github.event.client_payload.base }}
          SHA: ${{ (github.event.client_payload.sha || inputs.sha) }}
        run: |
          yes() { echo run=true >> "$GITHUB_OUTPUT"; exit 0; }
          case "$EVENT" in tag|pull_request|comment) echo run=false >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          [ "$EVENT" = push ] || yes
          [ -n "$BASE" ] || yes
          files=$(gh api "repos/termenbox/termenbox-source/compare/$BASE...$SHA" --jq '.files[].filename' 2>/dev/null) || yes
          for f in $files; do
            case "$f" in
              packages/site/*|scripts/check-site.mjs|scripts/build-site.mjs|scripts/docs-*.mjs|scripts/check-commands.mjs|scripts/check-release.mjs|docs/course/*|docs/media/*|docs/guide/*|docs/reference/*|docs/recipes/*|docs/generated/*|docs/docs-*.json|README.md|SECURITY.md) yes ;;
            esac
          done
          echo run=false >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Cloudflare Pages
    environment: site
    needs: [gate]
    if: needs.gate.outputs.run == 'true' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'repository_dispatch' && !contains(github.event.workflow_run.display_title, '-')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@bdbd793e55b6fc2bf0ca376be22060bef4e06622

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@bdbd793e55b6fc2bf0ca376be22060bef4e06622
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}
          remote: true
          branch: ${{ github.event_name == 'workflow_run' && 'master' || 'develop' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      # The page is static; this keeps it from shipping with a missing asset, a title past its length or a command that
      # differs from the README's.
      - name: Check the site
        run: node scripts/check-site.mjs

      # The changelog lists the stable releases of the public repo. A failure here (the API, an empty list) must not stop
      # a deploy that the gate already passed: the site then keeps its link to the Releases page.
      - name: Collect the stable releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/termenbox/termenbox/releases?per_page=40" --jq '[.[] | {tagName: .tag_name, name: .name, publishedAt: .published_at, body: .body, url: .html_url, isDraft: .draft, isPrerelease: .prerelease}]' > releases.json \
            || { echo "::warning::could not read the releases; the changelog will link to GitHub"; rm -f releases.json; }

      - name: Build the site with the course, its videos and the changelog
        run: |
          if [ -s releases.json ] && node scripts/build-site.mjs --releases releases.json; then :
          else
            [ ! -s releases.json ] || echo "::warning::the releases file was refused; building without the changelog"
            node scripts/build-site.mjs
          fi

      # What a reader copies must be what the sources say; a late failure on master warns and does not stop the deploy.
      - name: Check the install commands on the built site
        run: node scripts/check-commands.mjs --dist site-dist || echo "::warning::a page shows an install command that differs from packages/site/src/content/install.json"

      - name: Install Wrangler
        run: npm install -g --ignore-scripts wrangler@4.158.0

      # A preview goes to its own branch alias (https://course-<alias>.<project>.pages.dev), never production, so a branch can be
      # looked at on a phone before a release. Production deploys only from master.
      - name: Deploy to Cloudflare Pages
        run: |
          if [ -n "$PREVIEW" ]; then
            case "$PREVIEW" in *[!a-z0-9-]*) echo "preview must be lowercase letters, digits and dashes" >&2; exit 1;; esac
            BRANCH="course-$PREVIEW"
          elif [ "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/master | cut -f1)" ]; then
            BRANCH=master
          else
            if [ "$TB_EVENT" = push ]; then echo "not the head of master: nothing to deploy"; exit 0; fi
            echo "production deploys only from master; pass a preview alias" >&2; exit 1
          fi
          wrangler pages deploy site-dist --project-name="$PROJECT" --branch="$BRANCH"
          echo "Deployed to branch $BRANCH"
        env:
          PREVIEW: ${{ inputs.preview }}
          PROJECT: ${{ vars.TERMENBOX_SITE_PROJECT_NAME || 'termenbox-site' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@bdbd793e55b6fc2bf0ca376be22060bef4e06622
        with:
          key: ${{ secrets.LOG_KEY }}
          name: deploy-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            ${{ secrets.CLOUDFLARE_API_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

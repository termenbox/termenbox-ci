name: Build & Push Docker Image

run-name: "Image ${{ github.event.client_payload.tag || github.event.client_payload.event || 'manual' }}"

# The image tags follow the channels: a stable tag pushes latest, X.Y and X.Y.Z; a beta tag pushes beta
# and the exact version; a nightly pushes nightly and the exact version. `latest` moves only for a stable tag, never
# for a push to master, and there is no `edge`. release_plan.py decides, so the tags cannot drift from the release.
on:
  repository_dispatch:
    types: [source-pushed]
  workflow_call:
    inputs:
      sha: { description: 'commit to build', required: true, type: string }
      version: { description: 'full SemVer the image reports', required: true, type: string }
      tags: { description: 'space separated image tags to push', required: true, type: string }
      channel: { description: 'channel whose Environment and build cache the image uses', required: false, type: string, default: 'nightly' }
  workflow_dispatch:
    inputs:
      sha:
        description: 'Source commit to run on (a test of this workflow from a ci-repo branch); empty means the head of develop'
        type: string
        required: false
        default: ''
      tag:
        description: 'Docker tag (e.g. staging, v1.0.0); `latest` is refused here, a stable tag pushes it'
        required: true
        type: string
        default: 'staging'

# Each job asks for what it needs; the workflow itself only reads.
permissions:
  contents: read

defaults:
  run:
    shell: quiet {0}

# A new push to a pull request cancels the image build of the stale one. Tag, nightly and manual runs are never
# cancelled (their group is the run itself).
concurrency:
  group: docker-${{ (github.event.client_payload.event || github.event_name) == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ (github.event.client_payload.event || github.event_name) == 'pull_request' }}

env:
  TB_EVENT: ${{ github.event.client_payload.event || github.event_name }}
  TB_TAG: ${{ github.event.client_payload.tag }}
  REGISTRY: ghcr.io
  IMAGE_NAME: termenbox/termenbox
  PUSH: ${{ (github.event.client_payload.event || github.event_name) != 'pull_request' }}

jobs:
  # The one review of this run. It holds no secret and runs no code; every job that uses a channel Environment needs it
  # (scripts/check-approval-jobs.mjs), so the channel Environments carry secrets and a branch policy but no reviewer.
  approve:
    name: Approve
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: approve-beta
    steps:
      - shell: bash
        run: echo "approved"

  # Decides whether this run builds and what it pushes.
  plan:
    name: Plan the image tags
    needs: approve
    if: ${{ !cancelled() && (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    runs-on: ubuntu-latest
    # A manual run pushes any tag but latest, so it passes the review gate below, which reads the review repo with REVIEWS_TOKEN, a
    # secret of the beta Environment. A pull request and a release workflow's call have no Environment and pass no gate here.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'beta' || '' }}
    timeout-minutes: 5
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
      run: ${{ steps.p.outputs.run }}
      tags: ${{ steps.p.outputs.tags }}
      version: ${{ steps.p.outputs.version }}
      sha: ${{ steps.p.outputs.sha }}
      channel: ${{ steps.p.outputs.channel }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
      - uses: termenbox/termenbox-ci/.github/actions/release-tools@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d

      # The whole history: the security review gate below asks whether the commit is on master.
      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          depth: 0
          base: ${{ github.event.client_payload.base }}
          fetch: master
      - id: p
        env:
          CALL_TAGS: ${{ inputs.tags }}
          SHA: ${{ inputs.sha || (github.event.client_payload.sha || inputs.sha) }}
          CALL_VERSION: ${{ inputs.version }}
          CALL_CHANNEL: ${{ inputs.channel }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          BASE: ${{ github.event.client_payload.base }}
        run: |
          tags=""; version=""; run=true; channel=nightly
          if [ -n "$CALL_TAGS" ]; then
            # called by a release workflow, whose own event name this workflow sees; its gate has already passed
            tags="$CALL_TAGS"; version="$CALL_VERSION"; channel="$CALL_CHANNEL"
          elif [ "$TB_EVENT" = workflow_dispatch ]; then
            # `latest` moves only for a stable tag; a manual run may push any other tag.
            case " $DISPATCH_TAG " in
              *" latest "*) echo "::error::latest is pushed by a stable tag only, not by a manual run"; exit 1 ;;
            esac
            tags="$DISPATCH_TAG"
          elif [ "$TB_EVENT" = pull_request ]; then
            # the image is made of these paths; any other pull request has nothing to build (a failed diff builds)
            run=false
            files=$(git diff --name-only "$BASE...HEAD" 2>/dev/null || git diff --name-only "$BASE" HEAD 2>/dev/null) || run=true
            for f in $files; do
              case "$f" in
                docker/*|packages/core/*|packages/server/*|packages/agent/*|Cargo.toml|Cargo.lock) run=true ;;
              esac
            done
            [ "$run" = true ] || echo "::notice::no file of the image changed"
          else
            # Only a stable or beta tag, a manual run, a nightly call and a pull request build; anything else (the ci repo
            # also receives pushes to the development branch) builds and pushes nothing.
            echo "::notice::$TB_EVENT builds no image"; run=false
          fi
          {
            if [ "$TB_EVENT" = pull_request ]; then channel=""; fi
            echo "run=$run"; echo "channel=$channel"; echo "version=$version"; echo "sha=$SHA"
            echo "tags<<EOF"; for t in $tags; do echo "type=raw,value=$t"; done; echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # No image tag is pushed unless this step passes, so the build
      # jobs below (which need this one) never run. It covers a manual run; a pull request pushes
      # nothing and a release workflow (calling with its tags, after its own gate) is exempt.
      - name: Security review gate
        if: steps.p.outputs.run == 'true' && (github.event.client_payload.event || github.event_name) != 'pull_request' && inputs.tags == ''
        env:
          SHA: ${{ steps.p.outputs.sha }}
          GH_TOKEN: ${{ secrets.REVIEWS_TOKEN }}
        run: |
          # Rule 1: the gate runs from master's copy of its script and the scripts it runs, not from the commit's checkout.
          set -eu
          gate="$RUNNER_TEMP/gate"
          mkdir -p "$gate"
          for f in check-security-review.mjs check-security-surface.mjs check-security-counts.mjs; do
            git show "refs/remotes/origin/master:scripts/$f" > "$gate/$f" || { echo "scripts/$f is not on origin/master: the release gate cannot run, so no image is pushed"; exit 1; }
          done
          node "$gate/check-security-review.mjs" "$SHA"

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          key: ${{ secrets.LOG_KEY }}
          name: plan-${{ strategy.job-index }}
          status: ${{ job.status }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}
            ${{ secrets.REVIEWS_TOKEN }}
            ${{ secrets.REPORTER_APP_KEY }}

  # One native runner per architecture: no QEMU, so the Rust build runs at full speed. Build cache lives in GHCR, one per channel and architecture (a channel never reads a cache another one writes)
  # (the Actions cache has a 10 GB per-repository cap that two architectures' layers were filling).
  # A pull request builds amd64 only: it pushes nothing, and the arm64 build would only repeat the same compile.
  build:
    name: Build ${{ matrix.arch }}
    needs: plan
    # !cancelled() because the approve job above is skipped for a call from a release run, and a skipped ancestor
    # would otherwise skip this job too.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run == 'true' }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON((github.event.client_payload.event || github.event_name) == 'pull_request' && '{"include":[{"arch":"amd64","runner":"ubuntu-latest"}]}' || '{"include":[{"arch":"amd64","runner":"ubuntu-latest"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]}') }}
    environment: ${{ needs.plan.outputs.channel }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.GHCR_USER || 'termenbox' }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            TERMENBOX_BUILD=${{ needs.plan.outputs.sha }}
            TERMENBOX_RELEASE_VERSION=${{ needs.plan.outputs.version }}
          labels: org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache:${{ needs.plan.outputs.channel || 'nightly' }}-${{ matrix.arch }}
          cache-to: ${{ env.PUSH == 'true' && format('type=registry,ref={0}/{1}-cache:{2}-{3},mode=max', env.REGISTRY, env.IMAGE_NAME, needs.plan.outputs.channel || 'nightly', matrix.arch) || '' }}
      - name: Gate - compressed image size
        if: env.PUSH == 'true'
        env:
          IMAGE_MAX_MB: 160 # 119 MB when the gate was added; raise on purpose, in a reviewed change
        run: |
          ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          raw="$(docker buildx imagetools inspect --raw "$ref@${{ steps.build.outputs.digest }}")"
          # The pushed digest may be an index (image + attestation); follow it to the real image.
          inner="$(jq -r '[.manifests[]? | select(.platform.architecture != "unknown")][0].digest // empty' <<<"$raw")"
          [ -z "$inner" ] || raw="$(docker buildx imagetools inspect --raw "$ref@$inner")"
          bytes="$(jq '[.config.size, (.layers[].size)] | add' <<<"$raw")"
          mb=$((bytes / 1048576))
          echo "compressed image size (${{ matrix.arch }}): ${mb} MB (limit ${IMAGE_MAX_MB} MB)"
          [ "$mb" -le "$IMAGE_MAX_MB" ] || { echo "image too large"; exit 1; }
      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          key: ${{ secrets.LOG_KEY }}
          name: build-${{ strategy.job-index }}
          status: ${{ job.status }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          secrets: |-
            ${{ secrets.GHCR_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}
            ${{ secrets.REPORTER_APP_KEY }}

  # Joins the two single-architecture images into the multi-architecture tags users pull.
  manifest:
    name: Publish manifest
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build.result == 'success' && (github.event.client_payload.event || github.event_name) != 'pull_request' && needs.plan.outputs.run == 'true' }}
    needs: [plan, build]
    environment: ${{ needs.plan.outputs.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.GHCR_USER || 'termenbox' }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ needs.plan.outputs.tags }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          key: ${{ secrets.LOG_KEY }}
          name: manifest-${{ strategy.job-index }}
          status: ${{ job.status }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          secrets: |-
            ${{ secrets.GHCR_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.REPORTER_APP_KEY }}

  # The commit status `image` of a pull request or a push (scripts/land.sh requires it with `ci` and `go-getter`). A run
  # whose plan decides to build nothing reports success with that said, so a change with no image is not refused.
  status:
    name: Post the image status
    needs: [plan, build, manifest]
    if: ${{ always() && github.event_name == 'repository_dispatch' && (github.event.client_payload.event == 'pull_request' || github.event.client_payload.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: image
        shell: bash
        env:
          PLAN: ${{ needs.plan.result }}
          RUN: ${{ needs.plan.outputs.run }}
          BUILD: ${{ needs.build.result }}
          MANIFEST: ${{ needs.manifest.result }}
        run: |
          if [ "$PLAN" != success ] || [ "$BUILD" = failure ] || [ "$BUILD" = cancelled ] || [ "$MANIFEST" = failure ] || [ "$MANIFEST" = cancelled ]; then
            state=failure; desc="image build failed"
          elif [ "$RUN" != true ]; then
            state=success; desc="no image for this change"
          else
            state=success; desc="image built"
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "desc=$desc" >> "$GITHUB_OUTPUT"
      - uses: termenbox/termenbox-ci/.github/actions/post-status@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          sha: ${{ github.event.client_payload.sha }}
          context: image
          state: ${{ steps.image.outputs.state }}
          description: ${{ steps.image.outputs.desc }}

name: Limits probe

# The weekly probe of the mission resource limits. Two jobs on a free
# GitHub-hosted runner, a disposable machine: `ceilings` runs scripts/limits-probe.sh --run (memory and tasks ceilings
# held), `cpu` installs the Delegate=cpu drop-in with the runner's sudo and runs the processor burner
# (scripts/limits-probe.sh --cpu). A runner that cannot do it (no user systemd, no Landlock, cpu not delegated) is
# reported "unavailable" in the job summary and the job still passes; only a ceiling that does not hold fails a job.
# Never add a pull_request trigger: a fork PR could change this file and run its own code with the source checkout.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref to probe
        default: develop

permissions:
  contents: read

jobs:
  ceilings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: rt-src
        name: Token for the next step (contents)
        uses: termenbox/termenbox-ci/.github/actions/app-token@8a830ae40dc43ed9db9c18a5bc7d30c965eab7c1
        with:
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          permissions: '{"contents":"read"}'
      - name: Check out the source
        env:
          TOKEN: ${{ steps.rt-src.outputs.token }}
          REF: ${{ inputs.ref || 'develop' }}
        run: |
          set +x
          git -c credential.helper= clone --quiet "https://x-access-token:${TOKEN}@github.com/termenbox/termenbox-source.git" src >/dev/null 2>&1
          git -C src remote set-url origin https://github.com/termenbox/termenbox-source.git
          git -C src checkout --quiet --detach "origin/$REF" 2>/dev/null || git -C src checkout --quiet --detach "$REF"
      - name: Can this runner enforce limits?
        id: can
        run: |
          reason=""
          grep -qw landlock /sys/kernel/security/lsm 2>/dev/null || reason="no Landlock in the kernel LSM list"
          sudo loginctl enable-linger "$(id -un)" 2>/dev/null || true
          sudo systemctl start "user@$(id -u).service" 2>/dev/null || true
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user is-system-running >/dev/null 2>&1 || systemctl --user status >/dev/null 2>&1 || reason="${reason:+$reason; }no user systemd"
          if [ -n "$reason" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "### Limits probe: unavailable on this runner" >> "$GITHUB_STEP_SUMMARY"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Probe the memory and task ceilings
        if: steps.can.outputs.ok == 'true'
        env:
          TERMENBOX_LIMITS: '1'
          TERMENBOX_CONFIG_DIR: ${{ runner.temp }}/tb-config
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          sh src/scripts/limits-probe.sh --check
          out=$(sh src/scripts/limits-probe.sh --run)
          echo "$out"
          sh src/scripts/limits-probe.sh --reading
          {
            echo "### Limits probe"
            echo "$out"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$out" in *memory*) ;; *) echo "the memory ceiling did not hold"; exit 1 ;; esac
          case "$out" in *tasks*) ;; *) echo "the task ceiling did not hold"; exit 1 ;; esac

  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: rt-src
        name: Token for the next step (contents)
        uses: termenbox/termenbox-ci/.github/actions/app-token@8a830ae40dc43ed9db9c18a5bc7d30c965eab7c1
        with:
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          permissions: '{"contents":"read"}'
      - name: Check out the source
        env:
          TOKEN: ${{ steps.rt-src.outputs.token }}
          REF: ${{ inputs.ref || 'develop' }}
        run: |
          set +x
          git -c credential.helper= clone --quiet "https://x-access-token:${TOKEN}@github.com/termenbox/termenbox-source.git" src >/dev/null 2>&1
          git -C src remote set-url origin https://github.com/termenbox/termenbox-source.git
          git -C src checkout --quiet --detach "origin/$REF" 2>/dev/null || git -C src checkout --quiet --detach "$REF"
      - name: Install the Delegate=cpu drop-in (the installer's own body, one sudo)
        run: |
          # The body is read from the installer, so the drop-in the probe proves is the one users get.
          eval "$(sed -n '/^LIMITS_DROPIN_BODY=/,/Delegate=cpu"$/p' src/packages/client/installer/install.sh)"
          sudo mkdir -p /etc/systemd/system/user@.service.d
          printf '%s\n' "$LIMITS_DROPIN_BODY" | sudo tee /etc/systemd/system/user@.service.d/termenbox-limits.conf >/dev/null
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$(id -un)" 2>/dev/null || true
          sudo systemctl restart "user@$(id -u).service" 2>/dev/null || sudo systemctl start "user@$(id -u).service" 2>/dev/null || true
      - name: Processor burner
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          rc=0
          out=$(sh src/scripts/limits-probe.sh --cpu) || rc=$?
          echo "$out"
          {
            echo "### Limits probe: processor burner"
            echo "$out"
          } >> "$GITHUB_STEP_SUMMARY"
          # 3 is "unavailable" on this runner: reported, not a failure. 1 is a quota that did not hold.
          [ "$rc" = 0 ] || [ "$rc" = 3 ]
      - name: Remove the drop-in
        if: always()
        run: |
          sudo rm -f /etc/systemd/system/user@.service.d/termenbox-limits.conf
          sudo rmdir /etc/systemd/system/user@.service.d 2>/dev/null || true
          sudo systemctl daemon-reload

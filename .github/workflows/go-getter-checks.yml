# Generated by go-getter apply; do not edit. Tier-3 checks and CI-placed verification checks.
# The verification checks (format, lint, typecheck, build, test) are the cargo steps that ci.yaml already runs with a warm cache: fmt and clippy in rust-lint, the build in rust-build, the tests in rust-test. They are not repeated here: five cold cargo jobs with no cache and no toolchain setup only took runner slots (20 at once on the Free plan) and compiled the workspace five more times per run. `cargo check` is part of clippy, and a debug `cargo build` is part of the test build.
name: go-getter checks
run-name: "go-getter checks · ${{ github.event.client_payload.pr && format('PR #{0}', github.event.client_payload.pr) || github.event.client_payload.tag || github.event.client_payload.event || 'manual' }}${{ (github.event.client_payload.sha || inputs.sha) && format(' · {0}', (github.event.client_payload.sha || inputs.sha)) || '' }}"

on:
  repository_dispatch:
    types: [source-pushed]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Source commit to run on (a test of this workflow from a ci-repo branch); empty means the head of develop'
        type: string
        required: true
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: quiet {0}

# A new push to a PR cancels the stale run; master/develop runs are left to finish.
concurrency:
  group: go-getter-${{ github.event.client_payload.event }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event.client_payload.event == 'pull_request' }}

jobs:
  go-getter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d

      - if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          SHA: ${{ github.event.client_payload.sha }}
          STATE: pending
          DESC: running
        run: |
          [ -n "$GH_TOKEN" ] && [ -n "$SHA" ] || exit 0
          gh api -X POST "repos/termenbox/termenbox-source/statuses/$SHA" -f state="$STATE" -f context=go-getter \
            -f description="$DESC" -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null 2>&1 || true

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          depth: 0
          base: ${{ github.event.client_payload.base }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: sh .go-getter/bin/go-getter check --stage ci

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          key: ${{ secrets.LOG_KEY }}
          name: go-getter-checks-${{ strategy.job-index }}
          status: ${{ job.status }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}
            ${{ secrets.REPORTER_APP_KEY }}

      - if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          SHA: ${{ github.event.client_payload.sha }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESC: ${{ steps.finish.outputs.summary || 'go-getter checks' }}
        run: |
          [ -n "$GH_TOKEN" ] && [ -n "$SHA" ] || exit 0
          gh api -X POST "repos/termenbox/termenbox-source/statuses/$SHA" -f state="$STATE" -f context=go-getter \
            -f description="$DESC" -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null 2>&1 || true

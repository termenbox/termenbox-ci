name: Docs Media Review
run-name: "Docs Media Review · ${{ github.event.client_payload.pr && format('PR #{0}', github.event.client_payload.pr) || github.event.client_payload.tag || github.event.client_payload.event || 'manual' }}${{ github.event.client_payload.sha && format(' · {0}', github.event.client_payload.sha) || '' }}"

# A developer with write access picks a rendered video for the docs by ticking its line in the review issue and commenting `/approve` once (every ticked line goes in one branch), or sends it back with
# `/regen <case> [pace=slow|normal] [profile=phone|desktop] [caption=off] <note>`. Issue and comment events run THIS file from the default
# branch with the repository token for anyone who can comment, so the first step checks the actor's permission and every
# later step is skipped unless it is write, maintain or admin. The comment and the issue body reach the scripts only through env.
on:
  repository_dispatch:
    types: [source-comment]

permissions:
  contents: write
  issues: write
  actions: write

defaults:
  run:
    shell: quiet {0}

concurrency:
  group: docs-media-review-${{ github.event.client_payload.issue }}
  cancel-in-progress: false

env:
  TB_EVENT: ${{ github.event.client_payload.event || github.event_name }}
  TB_TAG: ${{ github.event.client_payload.tag }}

jobs:
  review:
    name: Approve or send back
    # Only the review issues, never a comment of our own.
    if: contains(fromJSON('["issue_comment","issue_edited"]'), github.event.client_payload.event)
    environment: docs
    runs-on: ubuntu-latest
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845

      - name: Check the actor's permission
        id: gate
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          GH_REPO: termenbox/termenbox-source
          EVENT: ${{ github.event.client_payload.event }}
          COMMENT_ID: ${{ github.event.client_payload.comment_id }}
          ISSUE: ${{ github.event.client_payload.issue }}
          SENDER: ${{ github.event.client_payload.actor }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "ok=false" >> "$GITHUB_OUTPUT"; echo "ignored: bad ids"; exit 0 ;; esac
          gh api "repos/termenbox/termenbox-source/issues/$ISSUE" > "$RUNNER_TEMP/issue.json"
          if ! jq -e '[.labels[].name] | index("docs-media")' "$RUNNER_TEMP/issue.json" >/dev/null || jq -e '.pull_request' "$RUNNER_TEMP/issue.json" >/dev/null; then
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "ignored: not a review issue"; exit 0
          fi
          if [ "$EVENT" = issue_edited ]; then
            # ticking a line edits the issue: that is an approval of the ticked lines
            ACTOR="$SENDER"; printf '/approve\n' > "$RUNNER_TEMP/comment.txt"
          else
            case "$COMMENT_ID" in ''|*[!0-9]*) echo "ok=false" >> "$GITHUB_OUTPUT"; echo "ignored: bad ids"; exit 0 ;; esac
            gh api "repos/termenbox/termenbox-source/issues/comments/$COMMENT_ID" > "$RUNNER_TEMP/comment.json"
            [ "$(jq -r '.issue_url | split("/") | last' "$RUNNER_TEMP/comment.json")" = "$ISSUE" ] || { echo "ok=false" >> "$GITHUB_OUTPUT"; echo "ignored: comment of another issue"; exit 0; }
            ACTOR=$(jq -r .user.login "$RUNNER_TEMP/comment.json")
            jq -r .body "$RUNNER_TEMP/comment.json" > "$RUNNER_TEMP/comment.txt"
          fi
          case "$ACTOR" in ''|null|*[!A-Za-z0-9-]*|*'[bot]') echo "ok=false" >> "$GITHUB_OUTPUT"; echo "ignored: author"; exit 0 ;; esac
          jq -r '.body // ""' "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/issue-body.txt"
          jq -r .title "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/issue-title.txt"
          echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"
          perm=$(gh api "repos/termenbox/termenbox-source/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in write|maintain|admin) echo "ok=true" >> "$GITHUB_OUTPUT" ;; *) echo "ok=false" >> "$GITHUB_OUTPUT"; echo "ignored: $ACTOR has $perm" ;; esac

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          remote: true
        if: steps.gate.outputs.ok == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: '24'

      - name: Work out what was asked
        id: ask
        if: steps.gate.outputs.ok == 'true'
        run: |
          COMMENT=$(cat "$RUNNER_TEMP/comment.txt"); BODY=$(cat "$RUNNER_TEMP/issue-body.txt"); TITLE=$(cat "$RUNNER_TEMP/issue-title.txt")
          run_id=$(printf '%s' "$TITLE" | sed -nE 's/^Docs media review ([0-9]+)$/\1/p')
          [ -n "$run_id" ] || { echo "not a review issue"; echo "action=none" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          # The cases of this review are the ones in its checklist; a command can name only those.
          ledger=$(printf '%s\n' "$BODY" | sed -nE 's/^- \[[ xX]\] ([a-z0-9-]+) (phone|desktop) ([0-9a-f]+)[[:space:]]*$/\1 \2 \3/p')
          catalog=$(printf '%s\n' "$ledger" | awk '{print $1}' | sort -u | tr '\n' ' ')
          parsed=$(COMMENT="$COMMENT" CATALOG="$catalog" node scripts/docs-media-review-cli.mjs parse)
          cmd=$(printf '%s' "$parsed" | jq -r '.cmd // "none"')
          if [ "$cmd" = approve ]; then
            want=$(printf '%s' "$parsed" | jq -r .case)
            if [ "$want" = ticked ]; then
              printf '%s\n' "$BODY" | sed -nE 's/^- \[[xX]\] ([a-z0-9-]+) (phone|desktop) ([0-9a-f]+)[[:space:]]*$/\1 \2 \3/p' > "$RUNNER_TEMP/approve.txt"
            else
              printf '%s\n' "$ledger" | awk -v w="$want" 'w == "all" || $1 == w' > "$RUNNER_TEMP/approve.txt"
            fi
            if [ -s "$RUNNER_TEMP/approve.txt" ]; then echo "action=approve" >> "$GITHUB_OUTPUT"; else echo "action=none" >> "$GITHUB_OUTPUT"; echo "nothing ticked"; fi
          elif [ "$cmd" = regen ]; then
            echo "action=regen" >> "$GITHUB_OUTPUT"
            printf '%s' "$parsed" > "$RUNNER_TEMP/regen.json"
          fi

      - name: Download the render
        if: steps.ask.outputs.action == 'approve'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.ask.outputs.run_id }}
        run: gh run download "$RUN_ID" -R "${{ github.repository }}" --name "docs-media-$RUN_ID" --dir "$RUNNER_TEMP/render"

      # The approved files travel in a branch the owner opens as a pull request: a pull request opened with the workflow token would
      # not start CI, and `develop` takes only squashed pull requests with green CI. The branch also fills any media markers already
      # placed in the README and the guide.
      - name: Approve
        id: approve
        if: steps.ask.outputs.action == 'approve'
        env:
          APPROVER: ${{ steps.gate.outputs.actor }}
          RUN_ID: ${{ steps.ask.outputs.run_id }}
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          GH_REPO: termenbox/termenbox-source
          ISSUE: ${{ github.event.client_payload.issue }}
          DOCS_TOKEN: ${{ secrets.DOCS_TOKEN }}
        run: |
          branch="docs/media-$RUN_ID"
          git config user.name "docs-media[bot]"
          git config user.email "docs-media-bot@users.noreply.github.com"
          git fetch --depth 1 origin develop
          git switch -c "$branch" FETCH_HEAD
          while read -r c p h; do
            node scripts/docs-media-review-cli.mjs approve "$RUNNER_TEMP/render" docs/media "$c" "$p" "$h"
          done < "$RUNNER_TEMP/approve.txt"
          node scripts/docs-media.mjs embed README.md docs/guide/*.md
          git add -A docs README.md
          git commit -m "docs(media): add the walkthroughs approved by $APPROVER" -m "Why: $APPROVER approved these videos in issue #$ISSUE (run $RUN_ID)." -m "What: adds the video, poster, stills and render.json of each approved line and fills the media markers."
          case "$branch" in docs/media-[0-9]*) ;; *) echo "refusing to push $branch"; exit 1 ;; esac
          git config --local --unset-all http.https://github.com/.extraheader || true
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DOCS_TOKEN" | base64 -w0)" push --force origin "refs/heads/$branch:refs/heads/$branch"
          url=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            printf 'Why: %s approved these videos in issue #%s (run %s).\n\nWhat: adds the video, poster, stills and render.json of each approved line and fills the media markers.\n' "$APPROVER" "$ISSUE" "$RUN_ID" > "$RUNNER_TEMP/pr.md"
            url=$(GH_TOKEN="$DOCS_TOKEN" gh pr create --base develop --head "$branch" --title "docs(media): add the walkthroughs approved in review $RUN_ID" --body-file "$RUNNER_TEMP/pr.md")
          fi
          printf 'Approved by %s. Pull request: %s\n' "$APPROVER" "$url" > "$RUNNER_TEMP/reply.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/reply.md"

      - name: Send back
        if: steps.ask.outputs.action == 'regen'
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          GH_REPO: termenbox/termenbox-source
          ISSUE: ${{ github.event.client_payload.issue }}
          CI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          c=$(jq -r .case "$RUNNER_TEMP/regen.json"); pace=$(jq -r .pace "$RUNNER_TEMP/regen.json")
          profile=$(jq -r .profile "$RUNNER_TEMP/regen.json"); caption=$(jq -r .caption "$RUNNER_TEMP/regen.json")
          note=$(jq -r .note "$RUNNER_TEMP/regen.json")
          GH_TOKEN="$CI_TOKEN" gh workflow run docs-media.yaml -R "${{ github.repository }}" -f case="$c" -f profile="$profile" -f pace="$pace" -f caption="$caption"
          gh label create video-needs-edit --color d93f0b --description "Sent back for a new render" 2>/dev/null || true
          gh issue edit "$ISSUE" --add-label video-needs-edit
          body=$(gh issue view "$ISSUE" --json body --jq .body | sed -E "s/^- \[[xX]\] ($c) (phone|desktop) /- [ ] \1 \2 /")
          gh issue edit "$ISSUE" --body "$body"
          printf 'Re-rendering `%s` (profile %s, pace %s, captions %s). Note kept: %s\n' "$c" "$profile" "$pace" "$caption" "$note" > "$RUNNER_TEMP/reply.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/reply.md"

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: review-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.DOCS_TOKEN }}
            ${{ secrets.GITHUB_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}
            ${{ secrets.STATUS_TOKEN }}

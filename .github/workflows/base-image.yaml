# Generated from the Termenbox source. Do not edit here.
name: Build Base Image
run-name: "Build Base Image · ${{ github.event.client_payload.pr && format('PR #{0}', github.event.client_payload.pr) || github.event.client_payload.tag || github.event.client_payload.event || 'manual' }}${{ github.event.client_payload.sha && format(' · {0}', substring(github.event.client_payload.sha, 0, 8)) || '' }}"

# The runtime base (node, tmux, git, ...) changes rarely. Rebuilding it weekly picks up OS security fixes;
# app builds then start FROM it and skip all package installs.
on:
  repository_dispatch:
    types: [source-master]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: quiet {0}

env:
  IMAGE: ghcr.io/termenbox/termenbox-base

jobs:
  # Generated: a push runs this workflow only when it changed one of the paths the original `on.push.paths` lists.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          EVENT: ${{ github.event.client_payload.event || 'other' }}
          BASE: ${{ github.event.client_payload.base }}
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          yes() { echo run=true >> "$GITHUB_OUTPUT"; exit 0; }
          case "$EVENT" in tag|pull_request|comment) echo run=false >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          [ "$EVENT" = push ] || yes
          [ -n "$BASE" ] || yes
          files=$(gh api "repos/termenbox/termenbox-source/compare/$BASE...$SHA" --jq '.files[].filename' 2>/dev/null) || yes
          for f in $files; do
            case "$f" in
              docker/Dockerfile.base|.github/workflows/base-image.yaml) yes ;;
            esac
          done
          echo run=false >> "$GITHUB_OUTPUT"

  base:
    name: Build & Push base
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@main

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@main
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          BUILDKIT_PROGRESS: quiet
        with:
          context: docker
          file: docker/Dockerfile.base
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_id }}

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@main
        with:
          key: ${{ secrets.LOG_KEY }}
          name: base-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.GITHUB_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

name: Build Base Image
run-name: "Build Base Image · ${{ github.event.client_payload.pr && format('PR #{0}', github.event.client_payload.pr) || github.event.client_payload.tag || github.event.client_payload.event || 'manual' }}${{ (github.event.client_payload.sha || inputs.sha) && format(' · {0}', (github.event.client_payload.sha || inputs.sha)) || '' }}"

# The runtime base (node, tmux, git, ...) changes rarely. App builds start FROM it and skip all package installs, and the
# release images carry whatever it holds, so it is built only from a commit that is already on master (a reviewed
# release) and the job refuses any other commit. A rebuilt base reaches the app image when the
# digest in docker/Dockerfile is moved in a reviewed change (.github/scripts/check-pins.sh --images lists it).
on:
  repository_dispatch:
    types: [source-master]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Source commit to build: it must be on master'
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: quiet {0}

env:
  IMAGE: ghcr.io/termenbox/termenbox-base

jobs:
  # Generated: a push runs this workflow only when it changed one of the paths the original `on.push.paths` lists.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          EVENT: ${{ github.event.client_payload.event || 'other' }}
          BASE: ${{ github.event.client_payload.base }}
          SHA: ${{ (github.event.client_payload.sha || inputs.sha) }}
        run: |
          yes() { echo run=true >> "$GITHUB_OUTPUT"; exit 0; }
          case "$EVENT" in tag|pull_request|comment) echo run=false >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          [ "$EVENT" = push ] || yes
          [ -n "$BASE" ] || yes
          files=$(gh api "repos/termenbox/termenbox-source/compare/$BASE...$SHA" --jq '.files[].filename' 2>/dev/null) || yes
          for f in $files; do
            case "$f" in
              docker/Dockerfile.base) yes ;;
            esac
          done
          echo run=false >> "$GITHUB_OUTPUT"

  base:
    name: Build & Push base
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - name: The commit is on master
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          SHA: ${{ (github.event.client_payload.sha || inputs.sha) }}
        shell: bash
        run: |
          status=$(gh api "repos/termenbox/termenbox-source/compare/master...$SHA" --jq .status) || { echo "cannot compare $SHA with master"; exit 1; }
          case "$status" in identical|behind) ;; *) echo "$SHA is not on master: the base image is built only from a released commit"; exit 1 ;; esac
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          BUILDKIT_PROGRESS: quiet
        with:
          context: docker
          file: docker/Dockerfile.base
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_id }}

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          key: ${{ secrets.LOG_KEY }}
          name: base-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.GITHUB_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}
            ${{ secrets.STATUS_TOKEN }}

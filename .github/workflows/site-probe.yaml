name: site-probe
# One-shot: prints status codes only for the site Environment's Cloudflare credentials. Deleted after use.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: site
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Probe
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/$1"; }
          echo "account id length ${#CF_ACCOUNT}"
          echo "token verify: $(code user/tokens/verify) account-token verify: $(code accounts/$CF_ACCOUNT/tokens/verify)"
          echo "pages projects list: $(code accounts/$CF_ACCOUNT/pages/projects)"
          echo "pages project termenbox-site: $(code accounts/$CF_ACCOUNT/pages/projects/termenbox-site)"

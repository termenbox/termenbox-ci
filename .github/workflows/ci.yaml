name: CI
run-name: "CI · ${{ github.event.client_payload.pr && format('PR #{0}', github.event.client_payload.pr) || github.event.client_payload.tag || github.event.client_payload.event || 'manual' }}${{ (github.event.client_payload.sha || inputs.sha) && format(' · {0}', (github.event.client_payload.sha || inputs.sha)) || '' }}"

on:
  repository_dispatch:
    types: [source-pushed]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Source commit to run on (a test of this workflow from a ci-repo branch); empty means the head of develop'
        type: string
        required: true
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: quiet {0}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# A new push to a PR cancels the stale run. Every push to master/develop gets a group of its own (the commit), so no
# run is cancelled or replaced while pending: each merge gets a full result, a chance to refresh the caches, and can
# be found by the nightly (`workflow_run`) and by a release gate that asks for a green run of a commit.
#
# This file is canonical for the build setup: release-build.yaml follows it (same cargo env, same cache keys, the
# bundled tmux restored from what the tmux job saved) and never writes the caches itself.
concurrency:
  group: ci-${{ github.event.client_payload.event }}-${{ github.event.client_payload.event == 'push' && (github.event.client_payload.sha || inputs.sha) || format('pr-{0}', github.event.client_payload.pr) }}
  cancel-in-progress: ${{ github.event.client_payload.event == 'pull_request' }}

# Caches (Swatinem/rust-cache) are written only by pushes to master/develop (save-if). A PR restores from its base
# branch and never writes, so PR branches cannot evict the 10 GB budget that master/develop caches live in.
#
# Job graph (the critical path is rust-build -> e2e / browsers-real; lint and tests run beside it, not before it):
#   changes                                       (what the pull request touches: docs only skips every job, server-only skips `browsers`)
#   client                                        (typecheck, build, unit tests, bundle gate)
#   rust-lint | rust-build | rust-test            (three cargo jobs in parallel instead of one long chain)
#   browsers                                      (scripted servers, no binary: starts immediately)
#   e2e, browsers-real        needs rust-build    (real server binary)
#   static (x86_64, aarch64) -> e2e-static, installer (+ tmux)
#   ci                                            (single result for branch protection)

jobs:
  # Decides which jobs a pull request needs, from the paths it changes (.github/scripts/ci-scope.sh holds the lists).
  # Every push to master/develop runs everything: those runs write the caches and are what a release gate and the
  # nightly look for. A job that is skipped here skips the jobs that need it as well; the result job at the end
  # accepts exactly those skips and nothing else.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
      code: ${{ steps.scope.outputs.code }}
      scripted: ${{ steps.scope.outputs.scripted }}
      media: ${{ steps.scope.outputs.media }}
      smoke: ${{ steps.scope.outputs.smoke }}
      browsers_matrix: ${{ steps.matrices.outputs.browsers }}
      real_matrix: ${{ steps.matrices.outputs.real }}
      static_matrix: ${{ steps.matrices.outputs.static }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845

      - if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          SHA: ${{ github.event.client_payload.sha }}
          STATE: pending
          DESC: running
        run: |
          [ -n "$GH_TOKEN" ] && [ -n "$SHA" ] || exit 0
          gh api -X POST "repos/termenbox/termenbox-source/statuses/$SHA" -f state="$STATE" -f context=ci \
            -f description="$DESC" -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null 2>&1 || true

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - name: Scope
        id: scope
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          EVENT: ${{ github.event.client_payload.event }}
          PR: ${{ github.event.client_payload.pr }}
        run: |
          if [ "$EVENT" = push ]; then
            # A push repeats the run its pull request passed: build, lint, unit tests and one Chromium leg, and the
            # `ci` status still posts. The other engines and the binaries run on the daily run.
            printf 'code=true\nscripted=true\nmedia=true\nsmoke=true\n' | tee -a "$GITHUB_OUTPUT"
            echo '[{"engine":"firefox"},{"engine":"webkit"},{"engine":"chromium","runs":"desktop:1440x900:2"}]' > skip.json
            echo '[]' > skip_static.json
          elif [ "$EVENT" != pull_request ]; then
            # A manual or daily run does everything.
            printf 'code=true\nscripted=true\nmedia=true\nsmoke=false\n' | tee -a "$GITHUB_OUTPUT"
            echo '[]' > skip.json
            echo '[]' > skip_static.json
          else
            # A failed or empty lookup reads as "everything changed": the script then turns every job on.
            gh api --paginate "repos/termenbox/termenbox-source/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > paths.txt || : > paths.txt
            sh .github/scripts/ci-scope.sh < paths.txt | tee -a "$GITHUB_OUTPUT"
            echo 'smoke=false' | tee -a "$GITHUB_OUTPUT"
            # A pull request runs Chromium always and WebKit only when the client changed (WebKit is the proxy for
            # iOS Safari 16.4+); Firefox and the aarch64 binary run on the daily run. An empty lookup counts as a
            # client change.
            if [ ! -s paths.txt ] || grep -q '^packages/client/' paths.txt; then
              echo '[{"engine":"firefox"}]' > skip.json
            else
              echo '[{"engine":"firefox"},{"engine":"webkit"}]' > skip.json
            fi
            echo '[{"arch":"aarch64"}]' > skip_static.json
          fi

      # The matrices of the jobs that depend on the event. `exclude` does not apply to an `include`-only matrix, so each
      # job takes its legs from here: every leg of the list below minus the legs that match a skip entry.
      - name: Matrices
        id: matrices
        shell: bash
        run: |
          cat > browsers.json <<'JSON'
          [
            { "engine": "chromium", "runs": "desktop:1024x768:1" },
            { "engine": "chromium", "runs": "desktop:1440x900:2" },
            { "engine": "firefox", "runs": "desktop:1024x768:1" },
            { "engine": "firefox", "runs": "desktop:1440x900:2" },
            { "engine": "webkit", "runs": "desktop:1024x768:1" },
            { "engine": "webkit", "runs": "desktop:1440x900:2" },
            { "engine": "webkit", "runs": "phone:390x844:3" }
          ]
          JSON
          cat > real.json <<'JSON'
          [
            { "name": "chromium", "engine": "chromium", "runs": "realserver:1024x768:1 realserver:1440x900:2" },
            { "name": "firefox", "engine": "firefox", "runs": "realserver:1024x768:1 realserver:1440x900:2" },
            { "name": "webkit-desktop", "engine": "webkit", "runs": "realserver:1024x768:1 realserver:1440x900:2" },
            { "name": "webkit-phone", "engine": "webkit", "runs": "realserver:390x844:3 phone-real:390x844:3" }
          ]
          JSON
          cat > static.json <<'JSON'
          [
            { "arch": "x86_64", "runner": "ubuntu-latest", "target": "x86_64-unknown-linux-musl" },
            { "arch": "aarch64", "runner": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-musl" }
          ]
          JSON
          pick() { jq -c --slurpfile skip "$2" '. as $all | $all | map(select(. as $e | ($skip[0] | any(. as $s | $s | to_entries | all(.value == $e[.key]))) | not))' "$1"; }
          echo "browsers=$(pick browsers.json skip.json)" | tee -a "$GITHUB_OUTPUT"
          echo "real=$(pick real.json skip.json)" | tee -a "$GITHUB_OUTPUT"
          echo "static=$(pick static.json skip_static.json)" | tee -a "$GITHUB_OUTPUT"

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: changes-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}
            ${{ secrets.STATUS_TOKEN }}

  client:
    name: Client (typecheck, build)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.media == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: ${{ github.event.client_payload.event == 'push' && 'pnpm' || '' }}

      - if: github.event.client_payload.event != 'push'
        uses: ./.github/actions/pnpm-restore

      - run: pnpm install --frozen-lockfile

      - name: Check the installer script
        run: for f in packages/client/installer/install.sh packages/client/public/uninstall.sh scripts/install-verified.sh scripts/uninstall-verified.sh; do sh -n $f && dash -n $f; done

      - name: Check the landing site (metadata, structured data, assets, the install command)
        run: node scripts/check-site.mjs

      # The landing site deploys for exactly the paths it renders: the gate of deploy-site.yaml in this repo equals what the build reads.
      - name: Read the deploy gate of the landing site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .ci-gate
          persist-credentials: false
          sparse-checkout: .github/workflows/deploy-site.yaml
          sparse-checkout-cone-mode: false

      - name: Check the landing site deploys for exactly the paths it renders
        env:
          TERMENBOX_CI_DIR: .ci-gate
        run: |
          if [ -f scripts/check-site-deploy-paths.mjs ]; then
            node --test scripts/check-site-deploy-paths.test.mjs
            node scripts/check-site-deploy-paths.mjs
          fi

      - name: Test the docs-media scripts (review rules, review page, embed markers, input hash)
        run: |
          node --test scripts/docs-media-review.test.mjs
          node scripts/docs-media-review-page.mjs --self-test
          node scripts/docs-media.mjs --self-test
          node scripts/docs-media-upload.mjs --self-test
          node scripts/docs-course.mjs --self-test
          node scripts/video-flicker.mjs --self-test
          node scripts/check-media-gate.mjs
          node scripts/build-site.mjs --self-test && node scripts/build-site.mjs
          node scripts/docs-media.mjs check --site site-dist docs/course/0*.md
          node scripts/check-course.mjs --self-test
          if [ -d docs/course ]; then node packages/client/e2e/video/render.mjs --list --json > "$RUNNER_TEMP/catalog.json" && node scripts/check-course.mjs --catalog "$RUNNER_TEMP/catalog.json"; fi
          node packages/client/e2e/video/inputs-hash.mjs --self-test
          node packages/client/e2e/video/voice-sync.mjs --check

      - name: Gate - native packages stay out of the client
        run: |
          node --test scripts/check-native-parity.test.mjs
          node scripts/check-native-parity.mjs

      - name: Typecheck the client (svelte-check)
        run: pnpm --filter termenbox-client run check

      - run: pnpm --filter termenbox-client run build

      - run: pnpm --filter termenbox-client run test

      - name: Status model harness self-tests (no browser, no server)
        run: |
          node packages/client/e2e/status-invariants.selftest.mjs
          node scripts/fake-claude.test.mjs --offline
          node scripts/status-smoke.test.mjs
          sh scripts/status-smoke.sh --dry-run

      - name: Gate - client bundle size
        run: pnpm --filter termenbox-client run check:bundle

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: client-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

  # The optional wrappers: the icon and bridge generators, the injected bridge and the Electron
  # main process with its navigation/CSP tests. Platform builds still need their own hosts (R76 step 5); this
  # keeps the shared native code from rotting in the meantime.
  native:
    name: Native wrappers (assets, bridge, electron)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: ${{ github.event.client_payload.event == 'push' && 'pnpm' || '' }}

      - if: github.event.client_payload.event != 'push'
        uses: ./.github/actions/pnpm-restore

      - run: pnpm install --frozen-lockfile

      - name: Generate the icons and splash from assets/icon.svg
        run: pnpm --filter termenbox-native run build:assets

      - name: Build and typecheck the injected bridge
        run: |
          pnpm --filter termenbox-native run build:bridge
          pnpm --filter termenbox-native run typecheck:bridge

      # The Electron sub-project installs its own dependencies (it is outside the pnpm workspace), and only the
      # main process is compiled here, so the Electron binary itself is not downloaded.
      - name: Build the Electron main process and check its security rules
        working-directory: packages/native/electron
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm install --no-audit --no-fund
          npm test

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: native-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

  rust-lint:
    name: Rust (fmt, clippy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rust-lint
          save-if: ${{ github.event.client_payload.event == 'push' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: rust-lint-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

  # The release server binary the browser jobs drive. Nothing else runs in this job, so e2e and browsers-real start as
  # soon as it is compiled instead of waiting for clippy and the debug test build.
  rust-build:
    name: Rust (release build)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rust-ci
          save-if: ${{ github.event.client_payload.event == 'push' }}

      # The ci profile (Cargo.toml) skips fat LTO and single-threaded codegen: the browser jobs need a working server
      # fast, and the shipped bytes are the static builds below.
      - name: Build workspace
        run: cargo build --workspace --profile ci

      - name: Keep the server binary for the browser end-to-end job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: termenbox-server
          path: target/ci/termenbox-server
          retention-days: 1

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: rust-build-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

  rust-test:
    name: Rust (tests)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rust-test
          save-if: ${{ github.event.client_payload.event == 'push' }}

      - name: Install tmux (end-to-end tests drive real sessions)
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Run tests
        run: cargo test --workspace
        env:
          # The container updater's test uses the runner's Docker and a local registry.
          TERMENBOX_E2E_DOCKER: "1"

      # The tests of the release scripts that moved to release/ run in this repository's repo-checks.
      - name: Test the bundle check, the deploy ref check and the pin check
        run: |
          sh .github/scripts/test-verify-bundle.sh
          sh .github/scripts/test-check-deploy-ref.sh
          sh .github/scripts/test-check-pins.sh
          sh .github/scripts/test-ci-scope.sh

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: rust-test-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

  # Real Chrome against the real server binary: login and claim over WebRTC, typing, reconnect with screen replay,
  # plus the resource gates (server RSS with 10 sessions, CPU while output streams). Only GitHub is a stand-in.
  #
  # The script list is spread over the shards by suite.mjs (heaviest first, weights in that file): to use more machines,
  # add a number to `shard`.
  e2e:
    name: Browser end-to-end and resource gates (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [changes, rust-build]
    if: needs.changes.outputs.smoke != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: ${{ github.event.client_payload.event == 'push' && 'pnpm' || '' }}

      - if: github.event.client_payload.event != 'push'
        uses: ./.github/actions/pnpm-restore

      - run: pnpm install --frozen-lockfile

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: termenbox-server
          path: bin

      - run: chmod +x bin/termenbox-server

      - run: pnpm --filter termenbox-client run e2e:build

      - name: Browser end-to-end scripts and resource gates (e2e/suite.mjs lists them)
        working-directory: packages/client
        env:
          TERMENBOX_BIN: ${{ github.workspace }}/bin/termenbox-server
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
          # The workspace roll-up invariants fail the run (plan workspace-status-rollup, step 5), not just list.
          STATUS_ROLLUP: strict
        run: node e2e/suite.mjs server --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-failure-chromium-server-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: e2e-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

  # The browser binaries and their OS deps (GStreamer + codec stack for WebKit) are baked into the
  # CI image (docker/Dockerfile.ci, .github/workflows/ci-image.yaml); the matrix jobs start from it
  # so `playwright-core install --with-deps` — which used to stall on azure.archive.ubuntu.com — no
  # longer runs at all. Chromium is the runner's Chrome, so the chromium leg stays on the bare
  # runner and skips the container.
  browsers:
    name: Browser matrix (${{ matrix.engine }}, ${{ matrix.runs }})
    needs: changes
    if: needs.changes.outputs.scripted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.browsers_matrix) }}
    container: ${{ matrix.engine != 'chromium' && 'ghcr.io/termenbox/termenbox-ci:latest' || '' }}
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: ${{ github.event.client_payload.event == 'push' && 'pnpm' || '' }}

      - if: github.event.client_payload.event != 'push'
        uses: ./.github/actions/pnpm-restore

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter termenbox-client run e2e:build

      - name: Run the scripts (size:ratio list from the matrix)
        shell: bash
        working-directory: packages/client
        env:
          # HOME is not set here: an empty string for chromium reaches the server and the browser as HOME="".
          # The container legs export HOME=/root in the script below.
          RUN_ENGINE: ${{ matrix.engine }}
          RUN_LIST: ${{ matrix.runs }}
          RUN_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: |
          # Firefox/WebKit run as root in the container; Playwright needs HOME=/root (the container's
          # default HOME=/github/home is owned by uid 1001 and fails the sandbox check). Chromium runs
          # on the bare runner as user `runner` and keeps its inherited HOME.
          [ "$RUN_ENGINE" != "chromium" ] && export HOME=/root
          fail=0
          for run in $RUN_LIST; do
            IFS=: read -r suite size dpr <<< "$run"
            tag="$suite-$RUN_ENGINE-$size-${dpr}x"
            echo "=== $tag ==="
            mkdir -p "$RUN_ARTIFACTS/$tag"
            E2E_ENGINE="$RUN_ENGINE" E2E_VIEWPORT="$size" E2E_DPR="$dpr" E2E_ARTIFACTS="$RUN_ARTIFACTS/$tag" \
              node e2e/suite.mjs "$suite" || { echo "::error::$tag failed"; fail=1; }
          done
          exit $fail

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-failure-${{ matrix.engine }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: browsers-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

  # R36: the same engines against the real server binary and real tmux (attach, switch, reconnect, keys, selection, mouse
  # reporting, resize, the 720/1024 breakpoints). WebSocket only; WebRTC and the resource gates stay in the Chromium job above.
  # The phone scripts that need the real server: touch.mjs, run.mjs and wizard.mjs stay in the Chromium server job (CDP,
  # resource gates, fake camera). Four legs of two runs each keep the legs about the same length.
  #
  # Firefox and WebKit run in the CI image (docker/Dockerfile.ci) so their browser binaries, OS deps and tmux are already
  # present and no apt step runs in the matrix. Chromium uses the runner's Chrome and the runner's tmux.
  #
  # The server binary downloaded for the non-chromium legs is the static musl build, not the dynamic
  # build from rust-build. The CI image is bookworm-slim (glibc 2.36), but the dynamic binary is built on
  # ubuntu-latest (glibc 2.39) and refuses to load inside the container: "GLIBC_2.38 not found". The static musl
  # binary has no glibc dependency and is also the production binary, so this matches what users install.
  browsers-real:
    name: Browser matrix, real server (${{ matrix.name }})
    needs: [changes, rust-build, static]
    if: needs.changes.outputs.smoke != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.real_matrix) }}
    container: ${{ matrix.engine != 'chromium' && 'ghcr.io/termenbox/termenbox-ci:latest' || '' }}
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845
      - uses: termenbox/termenbox-ci/.github/actions/release-tools@e737203677459b53d9f48012f376e46b2d809845

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: ${{ github.event.client_payload.event == 'push' && 'pnpm' || '' }}

      - if: github.event.client_payload.event != 'push'
        uses: ./.github/actions/pnpm-restore

      - run: pnpm install --frozen-lockfile

      # Chromium leg keeps using the dynamic build from rust-build (it runs on the bare ubuntu-latest runner
      # where glibc 2.39 is available). The container legs use the static musl build (no glibc dependency).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: matrix.engine == 'chromium'
        with:
          name: termenbox-server
          path: bin

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: matrix.engine != 'chromium'
        with:
          name: termenbox-server-musl-x86_64
          path: bin

      - run: chmod +x bin/termenbox-server

      - run: pnpm --filter termenbox-client run e2e:build

      - name: Run the scripts (suite:size:ratio list from the matrix)
        shell: bash
        working-directory: packages/client
        env:
          # HOME is not set here: an empty string for chromium reaches the server and the browser as HOME="".
          # The container legs export HOME=/root in the script below.
          TERMENBOX_BIN: ${{ github.workspace }}/bin/termenbox-server
          RUN_ENGINE: ${{ matrix.engine }}
          RUN_LIST: ${{ matrix.runs }}
          RUN_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: |
          [ "$RUN_ENGINE" != "chromium" ] && export HOME=/root
          fail=0
          for run in $RUN_LIST; do
            IFS=: read -r suite size dpr <<< "$run"
            tag="$suite-$RUN_ENGINE-$size-${dpr}x"
            echo "=== $tag ==="
            mkdir -p "$RUN_ARTIFACTS/$tag"
            E2E_ENGINE="$RUN_ENGINE" E2E_VIEWPORT="$size" E2E_DPR="$dpr" E2E_ARTIFACTS="$RUN_ARTIFACTS/$tag" \
              node e2e/suite.mjs "$suite" || { echo "::error::$tag failed"; fail=1; }
            # The runs used to be separate machines: leave nothing of one run for the next.
            tmux kill-server 2>/dev/null || true
          done
          exit $fail

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-failure-real-${{ matrix.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: browsers-real-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

  # The native host mode ships one static musl binary per architecture: no glibc, no OpenSSL,
  # nothing to install. Build both on the native runners and fail if anything is linked dynamically.
  static:
    name: Static binary (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.smoke != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.static_matrix) }}
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Name the apt cache
        id: apt-key
        run: echo "key=apt-static-${{ matrix.arch }}-${ImageVersion:-0}-musl-tools-cmake" >> "$GITHUB_OUTPUT"

      - name: Restore the apt packages
        id: apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: ${{ steps.apt-key.outputs.key }}

      - name: Install the musl toolchain (aws-lc-rs compiles C code)
        id: apt-install
        if: steps.apt.outputs.cache-hit != 'true'
        run: |
          # The packages come from the cache when it has them, so a run does not depend on the Ubuntu mirrors; a
          # miss installs them (retrying a mirror that does not answer) and keeps the downloaded .deb files.
          ok=0
          for wait in 0 10 30; do
            sleep "$wait"
            if sudo apt-get update && sudo apt-get install -y musl-tools cmake; then ok=1; break; fi
            # No Ubuntu host answered (the whole ubuntu.com zone can be down): take the next try from a mirror under
            # another name. apt still checks the signed Release files, so the host adds no trust.
            base=https://mirror.us.leaseweb.net/ubuntu/
            [ "$(dpkg --print-architecture)" = amd64 ] || base=https://mirror.us.leaseweb.net/ubuntu-ports/
            sudo sed -i -E "s#(mirror\+file:/etc/apt/apt-mirrors\.txt|https?://[a-z0-9.-]*ubuntu\.com/ubuntu(-ports)?/)#$base#g" /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          done
          [ "$ok" = 1 ]
          mkdir -p ~/apt-debs
          if ls /var/cache/apt/archives/*.deb >/dev/null 2>&1; then
            cp /var/cache/apt/archives/*.deb ~/apt-debs/
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the cached apt packages
        if: steps.apt.outputs.cache-hit == 'true'
        run: sudo dpkg -i ~/apt-debs/*.deb

      - name: Save the apt packages
        # Like this job's Rust cache: a pull request only restores, and the job does not run on a push at all.
        if: (github.event.client_payload.event == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && steps.apt-install.outputs.saved == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: ${{ steps.apt-key.outputs.key }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: static-${{ matrix.arch }}
          key: ${{ matrix.target }}
          save-if: ${{ github.event.client_payload.event == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release -p termenbox-server --target ${{ matrix.target }}

      - name: Gate - the binary is fully static
        run: |
          bin=target/${{ matrix.target }}/release/termenbox-server
          strip "$bin"
          file "$bin"
          # A static binary has no program interpreter and needs no shared library (ldd words this differently
          # for static and static-pie files, so read the ELF headers instead).
          if readelf -l "$bin" | grep -q INTERP; then echo "the binary asks for a dynamic loader"; exit 1; fi
          if readelf -d "$bin" 2>/dev/null | grep -q NEEDED; then echo "the binary needs shared libraries:"; readelf -d "$bin" | grep NEEDED; exit 1; fi
          ls -l "$bin"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: termenbox-server-musl-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/termenbox-server
          retention-days: 1

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: static-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

  # The same end-to-end test as above against the static binary, so musl-specific problems (DNS, DTLS, PTY, the
  # directory announce) cannot reach a release unnoticed.
  e2e-static:
    name: Browser end-to-end with the static binary
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: ${{ github.event.client_payload.event == 'push' && 'pnpm' || '' }}

      - if: github.event.client_payload.event != 'push'
        uses: ./.github/actions/pnpm-restore

      - run: pnpm install --frozen-lockfile

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: termenbox-server-musl-x86_64
          path: bin

      - run: chmod +x bin/termenbox-server

      - run: pnpm --filter termenbox-client run e2e:build

      - name: Run the browser end-to-end test
        working-directory: packages/client
        env:
          TERMENBOX_BIN: ${{ github.workspace }}/bin/termenbox-server
        run: node e2e/run.mjs

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: e2e-static-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

  # The bundled tmux, built from the pinned sources and put through its gate (static, runs with an
  # empty PATH and no terminfo, drives a session in control mode). The installer job installs this very binary.
  #
  # The build does not depend on the version or the commit, only on the pinned sources in build-tmux.sh, so it is cached
  # by the hash of that script: a hit skips the toolchain install and the build, and the gate runs either way.
  # Both architectures are built here because the releases ship both and restore exactly these entries (a release run
  # only reads them). Only the x86_64 binary is uploaded as an artifact, as before; the installer job uses that one.
  # The cache is written by pushes only, after the gate has passed. Keep every input of the build inside build-tmux.sh
  # (or add the other files to the hash below), or a change to them will not rebuild.
  tmux:
    name: Bundled tmux (static, ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Restore the tmux build
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmux-out
          key: tmux-${{ matrix.arch }}-${{ hashFiles('.github/scripts/build-tmux.sh') }}

      - name: Name the apt cache
        if: steps.cache.outputs.cache-hit != 'true'
        id: apt-key
        run: echo "key=apt-tmux-${{ matrix.arch }}-${ImageVersion:-0}-musl-tools-bison" >> "$GITHUB_OUTPUT"

      - name: Restore the apt packages
        if: steps.cache.outputs.cache-hit != 'true'
        id: apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: ${{ steps.apt-key.outputs.key }}

      - name: Install the musl toolchain
        id: apt-install
        if: (steps.cache.outputs.cache-hit != 'true') && steps.apt.outputs.cache-hit != 'true'
        run: |
          # The packages come from the cache when it has them, so a run does not depend on the Ubuntu mirrors; a
          # miss installs them (retrying a mirror that does not answer) and keeps the downloaded .deb files.
          ok=0
          for wait in 0 10 30; do
            sleep "$wait"
            if sudo apt-get update && sudo apt-get install -y musl-tools bison; then ok=1; break; fi
            # No Ubuntu host answered (the whole ubuntu.com zone can be down): take the next try from a mirror under
            # another name. apt still checks the signed Release files, so the host adds no trust.
            base=https://mirror.us.leaseweb.net/ubuntu/
            [ "$(dpkg --print-architecture)" = amd64 ] || base=https://mirror.us.leaseweb.net/ubuntu-ports/
            sudo sed -i -E "s#(mirror\+file:/etc/apt/apt-mirrors\.txt|https?://[a-z0-9.-]*ubuntu\.com/ubuntu(-ports)?/)#$base#g" /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          done
          [ "$ok" = 1 ]
          mkdir -p ~/apt-debs
          if ls /var/cache/apt/archives/*.deb >/dev/null 2>&1; then
            cp /var/cache/apt/archives/*.deb ~/apt-debs/
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the cached apt packages
        if: (steps.cache.outputs.cache-hit != 'true') && steps.apt.outputs.cache-hit == 'true'
        run: sudo dpkg -i ~/apt-debs/*.deb

      - name: Save the apt packages
        if: github.event.client_payload.event == 'push' && steps.apt-install.outputs.saved == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: ${{ steps.apt-key.outputs.key }}

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: .github/scripts/build-tmux.sh tmux-out

      - name: Gate
        run: .github/scripts/check-tmux.sh tmux-out/tmux

      - name: Save the tmux build
        if: github.event.client_payload.event == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmux-out
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.arch == 'x86_64'
        with:
          name: tmux-musl-x86_64
          path: |
            tmux-out/tmux
            tmux-out/tmux-COPYING
            tmux-out/tmux-libevent-LICENSE
            tmux-out/tmux-ncurses-COPYING
          retention-days: 1

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: tmux-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

  # The native installer run for real: a machine with systemd, a release signed with a throwaway
  # key, then install, install again, a refused tampered release, and a revert that restores the machine.
  installer:
    name: Native installer (${{ matrix.image }}, ${{ matrix.mode }})
    needs: [static, tmux]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: ['jrei/systemd-debian:12', 'jrei/systemd-ubuntu:24.04']
        mode: [host-user, host-me, host]
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845
      - uses: termenbox/termenbox-ci/.github/actions/release-tools@e737203677459b53d9f48012f376e46b2d809845

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: termenbox-server-musl-x86_64
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tmux-musl-x86_64
          path: tmux-dist

      - name: Make signed test releases (0.1.0, a newer one, a broken one, a frozen one), each with the bundled tmux
        run: .github/scripts/make-test-releases.sh release/termenbox-server work tmux-dist

      - name: Start a machine with systemd
        run: |
          docker run -d --name machine --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD/work/release:/release" -v "$PWD/work/release2:/release2" \
            -v "$PWD/work/release3:/release3" -v "$PWD/work/release4:/release4" \
            -v "$PWD/packages/client/installer/install.sh:/install.sh:ro" -v "$PWD/packages/client/public/uninstall.sh:/uninstall.sh:ro" \
            -v "$PWD/work/keys.txt:/keys.txt:ro" -v "$PWD/.github/scripts/test-native-install.sh:/test.sh:ro" \
            -v "$PWD/.github/scripts/test-user-install.sh:/test-user.sh:ro" \
            ${{ matrix.image }}
          sleep 8
          # If the image's own Ubuntu hosts do not answer, install from a mirror under another name (apt still checks
          # the signed Release files). Debian images have no ubuntu.com source, so the rewrite leaves them alone.
          docker exec machine sh -c 'apt-get update -qq; apt-get install -y -qq curl openssh-client ca-certificates iproute2 >/dev/null || { sed -i -E "s#https?://[a-z0-9.-]*ubuntu\.com/ubuntu/#http://mirror.us.leaseweb.net/ubuntu/#g" /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null; apt-get update -qq && apt-get install -y -qq curl openssh-client ca-certificates iproute2 >/dev/null; }'

      - name: Install, update, roll back, handle requests, refuse tampering, revert
        # host-me needs no root: it is tested as a normal user in a machine of its own, by its own script.
        run: |
          if [ "${{ matrix.mode }}" = host-me ]; then docker exec machine sh /test-user.sh; else docker exec machine sh /test.sh ${{ matrix.mode }}; fi

      - name: Service log (on failure)
        if: failure()
        run: docker exec machine journalctl -u termenbox --no-pager | tail -50

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: installer-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

  # The container install and its updater run for real: a machine with systemd and the runner's Docker
  # daemon, a local registry, and signed manifests that name the images by digest.
  container-installer:
    name: Container installer
    needs: [static]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845
      - uses: termenbox/termenbox-ci/.github/actions/release-tools@e737203677459b53d9f48012f376e46b2d809845

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: termenbox-server-musl-x86_64
          path: release

      - name: Start a machine with systemd and the runner's Docker
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          chmod +x release/termenbox-server
          # The socket is mounted outside /var/run, which the machine's systemd replaces with a tmpfs.
          docker run -d --name machine --privileged --cgroupns=host --network host -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v /var/run/docker.sock:/docker.sock -v "$(readlink -f "$(which docker)")":/usr/local/bin/docker:ro \
            -v "$RUNNER_TEMP/work:$RUNNER_TEMP/work" -v "$PWD/.github/scripts:/scripts:ro" -v "$TB_RELEASE_TOOLS:/release-tools:ro" \
            -v "$PWD/packages/client/installer/install.sh:/install.sh:ro" -v "$PWD/packages/client/public/uninstall.sh:/uninstall.sh:ro" \
            -v "$PWD/release/termenbox-server:/server:ro" jrei/systemd-debian:12
          sleep 8
          # If the image's own Ubuntu hosts do not answer, install from a mirror under another name (apt still checks
          # the signed Release files). Debian images have no ubuntu.com source, so the rewrite leaves them alone.
          docker exec machine sh -c 'apt-get update -qq; apt-get install -y -qq curl openssh-client ca-certificates iproute2 python3 >/dev/null || { sed -i -E "s#https?://[a-z0-9.-]*ubuntu\.com/ubuntu/#http://mirror.us.leaseweb.net/ubuntu/#g" /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null; apt-get update -qq && apt-get install -y -qq curl openssh-client ca-certificates iproute2 python3 >/dev/null; }'

      - name: Install, update by digest, roll back an unhealthy image, uninstall
        run: docker exec -e DOCKER_HOST=unix:///docker.sock machine sh /scripts/test-container-install.sh /server "$RUNNER_TEMP/work"

      - name: Logs (on failure)
        if: failure()
        run: docker logs termenbox-ci 2>&1 | tail -50

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: container-installer-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

  # One result for branch protection: require this check instead of the individual jobs, and the graph above can be
  # reshaped without touching the repository settings again. A skipped job is a failure unless `changes` said the pull
  # request cannot affect it: `code` false skips everything, `scripted` false skips the scripted-server browser matrix,
  # and `media` true keeps the Client job (the docs-media gate) even when `code` is false.
  # Checks the public attack-surface map and register (scripts/check-security-surface.mjs) and, on a pull request that
  # touches a path of .github/security-edges.txt, leaves one comment naming the map rows to re-read.
  # Runs on `pull_request` with the default token only; a fork's token is read-only, so its comment step is allowed to fail.
  security-surface:
    name: Security surface
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Test and run the check
        run: |
          node --test scripts/check-security-surface.test.mjs scripts/check-security-review.test.mjs scripts/check-release-gate.test.mjs scripts/check-pinned-actions.test.mjs scripts/check-job-environments.test.mjs scripts/bundle-sign.test.mjs scripts/install-verified.test.mjs scripts/check-template-review.test.mjs scripts/check-deploy-token-scope.test.mjs scripts/check-workflow-secrets.test.mjs scripts/check-security-jobs.test.mjs scripts/check-pnpm-audit.test.mjs scripts/check-cert-kid.test.mjs scripts/check-image-pins.test.mjs
          node scripts/check-security-surface.mjs
          node scripts/check-pinned-actions.mjs
          node scripts/check-image-pins.mjs --workflows
          node scripts/check-job-environments.mjs
          node scripts/check-workflow-secrets.mjs
          node scripts/check-security-jobs.mjs

      - name: Comment when an edge path changed
        if: github.event.client_payload.event == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          PR: ${{ github.event.client_payload.pr }}
        run: |
          gh api --paginate "repos/termenbox/termenbox-source/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/paths.txt"
          node scripts/check-security-surface.mjs --changed "$RUNNER_TEMP/paths.txt" --comment "$RUNNER_TEMP/comment.md"
          [ -s "$RUNNER_TEMP/comment.md" ] || exit 0
          old=$(gh api --paginate "repos/termenbox/termenbox-source/issues/$PR/comments" --jq '.[] | select(.body | startswith("<!-- security-surface-check -->")) | .id' | head -n 1)
          if [ -n "$old" ]; then
            gh api -X PATCH "repos/termenbox/termenbox-source/issues/comments/$old" -F body=@"$RUNNER_TEMP/comment.md"
          else
            gh api -X POST "repos/termenbox/termenbox-source/issues/$PR/comments" -F body=@"$RUNNER_TEMP/comment.md"
          fi

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: security-surface-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}
            ${{ secrets.STATUS_TOKEN }}

  # Supply chain (plan step C.5): the workflow linter (policy in .github/zizmor.yml), `cargo deny` for advisories and the
  # licence policy (deny.toml), and `pnpm audit` against the dated allowlist (.github/audit-allowlist.txt).
  # Runs for every pull request, whatever it touches, because a new advisory appears without any change here.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          min-severity: high

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: packages/server/Cargo.toml
          command: check licenses advisories

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Audit the npm dependencies
        run: node scripts/check-pnpm-audit.mjs

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: supply-chain-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

  # No commit of a pull request, and no test it adds,
  # names a private finding id or an unpublished advisory id. Runs for every pull request, whatever it touches.
  commit-ids:
    name: Commit ids
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}
          depth: 0
          base: ${{ github.event.client_payload.base }}
      - name: Check the commits of the pull request
        if: github.event.client_payload.event == 'pull_request'
        env:
          BASE: ${{ github.event.client_payload.base }}
          HEAD: ${{ (github.event.client_payload.sha || inputs.sha) }}
        run: node scripts/check-commit-ids.mjs "$BASE" "$HEAD"

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: commit-ids-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

  # Pushes only: drops the older generations of every cache group (each rust-cache and setup-node save leaves the
  # previous entry behind), so the 10 GB budget holds the newest entry of each group instead of five of them.
  cache-prune:
    name: Prune old caches
    needs: [rust-lint, rust-build, rust-test, static, client, e2e]
    if: github.event.client_payload.event == 'push' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Keep the newest entry of every cache group
        run: |
          for g in rust-lint rust-ci rust-test static-x86_64 static-aarch64; do
            .github/scripts/prune-caches.sh "v0-rust-$g-" 1
          done
          for g in static-x86_64 static-aarch64 tmux-x86_64 tmux-aarch64; do
            .github/scripts/prune-caches.sh "apt-$g-" 1
          done
          .github/scripts/prune-caches.sh node-cache- 2
          .github/scripts/prune-caches.sh codeql-overlay-base-database- 2

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: cache-prune-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

  ci:
    name: CI result
    if: ${{ always() }}
    needs: [changes, security-surface, supply-chain, commit-ids, client, rust-lint, rust-build, rust-test, e2e, browsers, browsers-real, static, e2e-static, tmux, installer, container-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845

      - name: Fail unless every job succeeded or was rightly skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          out = needs["changes"]["outputs"]
          bad = []
          for name, job in needs.items():
              result = job["result"]
              if result == "success":
                  continue
              smoke_skips = ("e2e", "browsers-real", "static", "e2e-static", "installer", "container-installer")
              allowed = result == "skipped" and ((out.get("code") == "false" and not (name == "client" and out.get("media") != "false")) or (name == "browsers" and out.get("scripted") == "false") or (out.get("smoke") == "true" and name in smoke_skips))
              if not allowed:
                  bad.append(name + ": " + result)
          print("code=%s scripted=%s media=%s smoke=%s" % (out.get("code"), out.get("scripted"), out.get("media"), out.get("smoke")))
          if bad:
              print("not green: " + ", ".join(bad))
              sys.exit(1)
          '

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: ci-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
          needs: ${{ toJSON(needs) }}

      - if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          SHA: ${{ github.event.client_payload.sha }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESC: ${{ steps.finish.outputs.summary || 'ci result' }}
        run: |
          [ -n "$GH_TOKEN" ] && [ -n "$SHA" ] || exit 0
          gh api -X POST "repos/termenbox/termenbox-source/statuses/$SHA" -f state="$STATE" -f context=ci \
            -f description="$DESC" -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null 2>&1 || true

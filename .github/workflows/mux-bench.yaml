name: Mux bench

# A one-shot harness for a daemon benchmark: it builds termenbox-mux at two refs of the source, then runs the same
# load against both, interleaved (A B A B ...) in one job, so the difference between them is not the difference between
# two minutes of a shared machine. Only the daemon's CPU and latency numbers reach the log; every build output goes to
# a file that is uploaded encrypted. Never add a pull_request trigger: a fork PR could change this file and print the
# checkout.
on:
  workflow_dispatch:
    inputs:
      ref_a:
        description: Source ref of variant A (the baseline)
        default: develop
      ref_b:
        description: Source ref of variant B (the change)
        default: develop
      panes:
        description: Panes in the daemon
        default: '100'
      noisy:
        description: Panes redrawing a screen at 20 lines a second
        default: '33'
      seconds:
        description: Seconds per measurement
        default: '45'
      rounds:
        description: Interleaved rounds
        default: '5'
      servers:
        description: Pair mode only, servers run side by side (a list such as 1,2)
        default: '1'
      diag:
        description: Pair mode only, true runs the diagnosis (25 panes, a third working, noisy panes named claude and plain, and with perf on the server) instead of the table
        default: 'false'
      mode:
        description: load (daemon CPU and status latency, ref A against ref B), attach (keystroke latency and flood cost of the daemon, tmux and a raw PTY, on ref B) or stage (cost of each stage of the daemon's output path, and perf/strace counts per typed key, on ref B) or pair (plan step 6.3, the whole path, termenbox-server plus the daemon against termenbox-server plus the pinned tmux, 25 to 500 panes, idle and with a third working, one and two servers, on ref B)
        default: load

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - id: rt-src
        name: Token for the next step (contents)
        uses: termenbox/termenbox-ci/.github/actions/app-token@8a830ae40dc43ed9db9c18a5bc7d30c965eab7c1
        with:
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          permissions: '{"contents":"read"}'
      - name: Check out both refs
        env:
          TOKEN: ${{ steps.rt-src.outputs.token }}
          REF_A: ${{ inputs.ref_a }}
          REF_B: ${{ inputs.ref_b }}
        run: |
          set +x
          git -c credential.helper= clone --quiet "https://x-access-token:${TOKEN}@github.com/termenbox/termenbox-source.git" src >/dev/null 2>&1
          git -C src remote set-url origin https://github.com/termenbox/termenbox-source.git
          for v in a b; do
            ref=$REF_A; [ "$v" = b ] && ref=$REF_B
            sha=$(git -C src rev-parse --verify --quiet "origin/$ref" || git -C src rev-parse --verify --quiet "$ref") || { echo "no ref for $v"; exit 1; }
            git -C src worktree add --quiet --detach "../$v" "$sha" >/dev/null 2>&1 || { echo "worktree $v failed"; exit 1; }
          done
          echo "checked out A=${REF_A} B=${REF_B}"
      - name: Build both daemons (output withheld)
        id: build
        if: inputs.mode == 'load'
        run: |
          set +e
          { for v in a b; do (cd "$v" && cargo build --release -p termenbox-mux --target-dir "$PWD/../target-$v") || exit 1; done; } > build.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Run the load, interleaved
        id: bench
        if: inputs.mode == 'load' && steps.build.outputs.exit == '0'
        env:
          PANES: ${{ inputs.panes }}
          NOISY: ${{ inputs.noisy }}
          SECONDS_EACH: ${{ inputs.seconds }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          set +e
          echo "runner: $(nproc) cores, load $(cut -d' ' -f1-3 /proc/loadavg)"
          : > results.txt
          i=1
          while [ "$i" -le "$ROUNDS" ]; do
            for v in a b; do
              line=$(MUXBIN="$PWD/target-$v/release/termenbox-mux" python3 b/scripts/mux-load.py "$PANES" "$NOISY" "$SECONDS_EACH" 2>>bench.err)
              echo "$v $line" | tee -a results.txt
              pkill -x termenbox-mux
            done
            i=$((i + 1))
          done
          echo "exit=0" >> "$GITHUB_OUTPUT"
      # The tmux the owner runs is the pinned static build of the release, not the runner's apt tmux:
      # take the one ci.yaml saved (same key as release-build.yaml) and build it only when it is not there.
      - name: Restore the pinned tmux built by CI
        id: tmux
        if: inputs.mode == 'attach' || inputs.mode == 'pair'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmux-out
          key: tmux-x86_64-${{ hashFiles('src/.github/scripts/build-tmux.sh') }}
      - name: Build the pinned tmux (pinned sources, static)
        if: (inputs.mode == 'attach' || inputs.mode == 'pair') && steps.tmux.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -qq bison >/dev/null 2>&1
          (cd src && .github/scripts/build-tmux.sh ../tmux-out) > tmux-build.log 2>&1 || { tail -5 tmux-build.log; exit 1; }
      - name: Attach bench (ref B; output withheld except the table)
        id: attach
        if: inputs.mode == 'attach'
        env:
          ROUNDS: ${{ inputs.rounds }}
        run: |
          set +e
          export PATH="$PWD/tmux-out:$PATH"
          echo "runner: $(nproc) cores, load $(cut -d' ' -f1-3 /proc/loadavg), $(command -v tmux) $(tmux -V)"
          (cd b && sh scripts/mux-attach-bench.sh --rounds "$ROUNDS" > ../attach.out 2> ../bench.err)
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          grep -E '^(#|row |median )' attach.out | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pair bench (ref B; table in the next step)
        id: pair
        if: inputs.mode == 'pair'
        env:
          ROUNDS: ${{ inputs.rounds }}
          SECONDS_EACH: ${{ inputs.seconds }}
          PANES: ${{ inputs.panes }}
          SERVERS: ${{ inputs.servers }}
          DIAG: ${{ inputs.diag }}
        run: |
          set +e
          export PATH="$PWD/tmux-out:$PATH"
          EXTRA=""
          if [ "$DIAG" = true ]; then
            sudo apt-get install -y -qq linux-tools-common linux-tools-generic >/dev/null 2>&1
            sudo sysctl -q -w kernel.perf_event_paranoid=-1
            EXTRA="--diag"
          fi
          echo "runner: $(nproc) cores, load $(cut -d' ' -f1-3 /proc/loadavg), $(command -v tmux) $(tmux -V)"
          : > pair.out; : > bench.err
          (cd b && CARGO_PROFILE_RELEASE_STRIP=false timeout 20m cargo build --release -p termenbox-server) > build.log 2>&1 || { echo "exit=1" >> "$GITHUB_OUTPUT"; exit 0; }
          SERVERBIN="$PWD/b/target/release/termenbox-server" timeout 25m python3 b/scripts/mux-pair-bench.py --panes "$PANES" --servers "$SERVERS" --rounds "$ROUNDS" --seconds "$SECONDS_EACH" $EXTRA > pair.out 2> bench.err
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Pair table and the tail of the script's stderr
        if: always() && inputs.mode == 'pair'
        run: |
          { echo '```'; grep -E '^(#|row |fail |median |verdict|threads |perf )' pair.out; echo '--- tail of bench.err'; tail -40 bench.err; echo '--- tail of build.log'; tail -5 build.log; echo '```'; } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stage bench and per-key profile (ref B; output withheld except the tables)
        id: stage
        if: inputs.mode == 'stage'
        run: |
          set +e
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic strace >/dev/null 2>&1
          sudo sysctl -q -w kernel.perf_event_paranoid=-1
          echo "runner: $(nproc) cores, load $(cut -d' ' -f1-3 /proc/loadavg)"
          (cd b && sh scripts/mux-stage-bench.sh --mb 200 > ../stage.out 2> ../bench.err)
          rc=$?
          (cd b && OUT="$PWD/../profile" sh scripts/mux-stage-bench.sh --profile > ../profile.out 2>> ../bench.err)
          echo "exit=$((rc + $?))" >> "$GITHUB_OUTPUT"
          { echo '```'; cat stage.out profile.out; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Medians
        if: inputs.mode == 'load' && steps.bench.outputs.exit == '0'
        run: |
          python3 - <<'P' | tee -a "$GITHUB_STEP_SUMMARY"
          import re, statistics as st
          rows = {"a": [], "b": []}
          for l in open("results.txt"):
              m = re.match(r"(a|b) panes .*daemon ([\d.]+)%.*wake-ups/s ([\d.]+).*p50 (\d+) p99 (\d+)", l)
              if m: rows[m[1]].append(tuple(float(x) for x in m.groups()[1:]))
          print("| variant | runs | CPU % (median) | wake-ups/s | p50 ms | p99 ms (median, max) |\n|---|---|---|---|---|---|")
          for v, r in rows.items():
              if r:
                  col = lambda i: [x[i] for x in r]
                  print(f"| {v.upper()} | {len(r)} | {st.median(col(0)):.2f} | {st.median(col(1)):.0f} | {st.median(col(2)):.0f} | {st.median(col(3)):.0f}, {max(col(3)):.0f} |")
          P
      - name: Encrypt logs
        if: always()
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          touch build.log bench.err
          cat build.log bench.err > all.log
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in all.log -out all.log.enc 2>/dev/null || true
          rm -f build.log bench.err all.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mux-bench-log-encrypted
          path: all.log.enc
          retention-days: 7
      - name: Result
        env:
          MODE: ${{ inputs.mode }}
          BUILD: ${{ steps.build.outputs.exit }}
          BENCH: ${{ steps.bench.outputs.exit }}
          ATTACH: ${{ steps.attach.outputs.exit }}
          STAGE: ${{ steps.stage.outputs.exit }}
          PAIR: ${{ steps.pair.outputs.exit }}
        run: |
          if [ "$MODE" = attach ]; then test "$ATTACH" = 0; elif [ "$MODE" = stage ]; then test "$STAGE" = 0; elif [ "$MODE" = pair ]; then test "$PAIR" = 0; else test "$BUILD" = 0 && test "$BENCH" = 0; fi

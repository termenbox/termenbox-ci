name: Dialog Videos

# Captioned walkthroughs of the New workspace dialog, rendered on scripted data (packages/client/e2e/video).
# Dispatch only: never on a push, a pull request or a schedule. No secrets and no model call.
on:
  workflow_dispatch:
    inputs:
      case:
        description: Which walkthrough
        type: choice
        options: [all, recent-folder, other-agent, browse-folder, type-path]
        default: all
      profile:
        description: Which screen
        type: choice
        options: [phone, desktop, both]
        default: both

permissions:
  contents: read

defaults:
  run:
    shell: quiet {0}

jobs:
  render:
    name: Render the walkthroughs
    runs-on: ubuntu-latest
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@c793fdd572460ac87af14956e6676e4c1dac25f6

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@c793fdd572460ac87af14956e6676e4c1dac25f6
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pnpm install --frozen-lockfile

      - name: Install the browser
        working-directory: packages/client
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Build the client and its e2e pages
        working-directory: packages/client
        run: pnpm run e2e:build

      - name: Render
        working-directory: packages/client
        env:
          CASE: ${{ inputs.case }}
          PROFILE: ${{ inputs.profile }}
        run: |
          cases="$CASE"; [ "$cases" = all ] && cases="recent-folder other-agent browse-folder type-path"
          profiles="$PROFILE"; [ "$profiles" = both ] && profiles="phone desktop"
          for c in $cases; do
            for p in $profiles; do
              node e2e/video/render.mjs --case "$c" --profile "$p" --out "$GITHUB_WORKSPACE/videos"
            done
          done
          ls -l "$GITHUB_WORKSPACE/videos"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dialog-videos
          path: videos
          retention-days: 7
          if-no-files-found: error

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@c793fdd572460ac87af14956e6676e4c1dac25f6
        with:
          key: ${{ secrets.LOG_KEY }}
          name: render-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

name: Status Smoke

# Tier 3 of the agent status model: real Claude on haiku against the tier-2
# fixtures. Manual only and never a required check: it spends tokens from the ANTHROPIC_API_KEY secret (an API key,
# not a subscription login). Run it after a Claude release to see whether the hook order drifted.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Claude Code version to test (npm)
        default: '2.1.308'
      cases:
        description: Comma-separated cases (empty runs all five)
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: quiet {0}

jobs:
  smoke:
    name: Real Claude against the fixtures
    environment: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          sha: ${{ github.event.client_payload.sha }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install tmux and Claude Code
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sudo apt-get update && sudo apt-get install -y tmux
          npm install -g "@anthropic-ai/claude-code@$VERSION"
      - name: Compare hook order with the fixtures
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CASES: ${{ inputs.cases }}
        run: sh scripts/status-smoke.sh ${CASES:+--cases "$CASES"}

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          key: ${{ secrets.LOG_KEY }}
          name: smoke-${{ strategy.job-index }}
          status: ${{ job.status }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          secrets: |-
            ${{ secrets.ANTHROPIC_API_KEY }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.REPORTER_APP_KEY }}

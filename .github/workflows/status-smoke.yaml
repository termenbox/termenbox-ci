# GENERATED by scripts/port-workflow.py from termenbox/termenbox .github/workflows/status-smoke.yaml. Do not edit here: change the original and port again.
name: Status Smoke

# Tier 3 of the agent status model (plan docs/plans/archive/agent-status-model.md D.7): real Claude on haiku against the tier-2
# fixtures. Manual only and never a required check: it spends tokens from the ANTHROPIC_API_KEY secret (an API key,
# not a subscription login: fact 0071). Run it after a Claude release to see whether the hook order drifted.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Claude Code version to test (npm)
        default: '2.1.308'
      cases:
        description: Comma-separated cases (empty runs all five)
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: quiet {0}

jobs:
  smoke:
    name: Real Claude against the fixtures
    environment: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@main

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@main
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install tmux and Claude Code
        run: |
          sudo apt-get update && sudo apt-get install -y tmux
          npm install -g "@anthropic-ai/claude-code@${{ inputs.version }}"
      - name: Compare hook order with the fixtures
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CASES: ${{ inputs.cases }}
        run: sh scripts/status-smoke.sh ${CASES:+--cases "$CASES"}

      - if: always()
        uses: termenbox/termenbox-ci/.github/actions/finish@main
        with:
          key: ${{ secrets.LOG_KEY }}
          name: smoke-${{ strategy.job-index }}

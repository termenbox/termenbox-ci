name: Template Review
run-name: "Template Review · ${{ github.event.client_payload.pr && format('PR #{0}', github.event.client_payload.pr) || github.event.client_payload.tag || github.event.client_payload.event || 'manual' }}${{ github.event.client_payload.sha && format(' · {0}', github.event.client_payload.sha) || '' }}"

# The owner accepts a UI slice's templates on its probe page, with one tap, before the slice is wired.
# Dispatch builds the e2e probe pages, publishes them to a Cloudflare Pages preview on their own branch alias (never production) and
# opens a review issue with a link and a checkbox per page. Ticking a box (anyone with write access) labels the issue `accepted-<page>`
# and comments. Issue events run THIS file from the default branch. The `gate` job (read-only token) checks the editor's permission;
# the `accept` job, which holds the write-scoped token, needs it and runs only when it passes. The issue body reaches the script only
# through env.
on:
  repository_dispatch:
    types: [source-comment]
  workflow_dispatch:
    inputs:
      pages:
        description: Probe pages to publish, space separated (packages/client/e2e/<page>.html), for example "fleet"
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: quiet {0}

env:
  TB_EVENT: ${{ github.event.client_payload.event || github.event_name }}
  TB_TAG: ${{ github.event.client_payload.tag }}

jobs:
  publish:
    name: Publish the probe pages and open the review
    environment: site
    if: (github.event.client_payload.event || github.event_name) == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 20
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@main

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@main
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build the client and its e2e pages
        working-directory: packages/client
        run: pnpm run e2e:build

      - name: Check the pages exist
        env:
          PAGES: ${{ inputs.pages }}
        run: |
          for p in $PAGES; do
            case "$p" in *[!a-z0-9-]*|'') echo "bad page name: $p"; exit 1 ;; esac
            [ -f "packages/client/e2e/dist/$p.html" ] || { echo "no probe page $p"; exit 1; }
          done

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Publish the preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.TERMENBOX_SITE_PROJECT_NAME || 'termenbox-site' }}
        run: |
          sha=$(git rev-parse --short=8 HEAD)
          wrangler pages deploy packages/client/e2e/dist --project-name="$PROJECT" --branch="review-$sha"
          echo "SHA=$sha" >> "$GITHUB_ENV"
          echo "PREVIEW_URL=https://review-$sha.$PROJECT.pages.dev" >> "$GITHUB_ENV"

      - name: Open the review issue
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          GH_REPO: termenbox/termenbox-source
          PAGES: ${{ inputs.pages }}
        run: |
          # shellcheck disable=SC2086
          node scripts/template-review.mjs body "$SHA" "$PREVIEW_URL" $PAGES > "$RUNNER_TEMP/body.md"
          gh label create template-review --color 5319e7 --description "Template review" 2>/dev/null || true
          title="Template review $SHA"
          n=$(gh issue list --label template-review --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue edit "$n" --body-file "$RUNNER_TEMP/body.md"
          else gh issue create --title "$title" --label template-review --body-file "$RUNNER_TEMP/body.md"; fi

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@main
        with:
          key: ${{ secrets.LOG_KEY }}
          name: publish-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            ${{ secrets.CLOUDFLARE_API_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}
            ${{ secrets.STATUS_TOKEN }}

  gate:
    name: Check the editor's permission
    if: github.event.client_payload.event == 'issue_edited'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
      ok: ${{ steps.check.outputs.ok }}
      actor: ${{ steps.check.outputs.actor }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@main

      - name: Check the editor's permission
        id: check
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          GH_REPO: termenbox/termenbox-source
          ISSUE: ${{ github.event.client_payload.issue }}
          ACTOR: ${{ github.event.client_payload.actor }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "bad ids"; exit 0 ;; esac
          case "$ACTOR" in ''|*[!A-Za-z0-9-]*|*'[bot]') echo "ignored: author"; exit 0 ;; esac
          gh api "repos/termenbox/termenbox-source/issues/$ISSUE" > "$RUNNER_TEMP/issue.json"
          if ! jq -e '[.labels[].name] | index("template-review")' "$RUNNER_TEMP/issue.json" >/dev/null || jq -e '.pull_request' "$RUNNER_TEMP/issue.json" >/dev/null; then
            echo "ignored: not a review issue"; exit 0
          fi
          echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"
          perm=$(gh api "repos/termenbox/termenbox-source/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in write|maintain|admin) echo "ok=true" >> "$GITHUB_OUTPUT" ;; *) echo "ignored: $ACTOR has $perm" ;; esac

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@main
        with:
          key: ${{ secrets.LOG_KEY }}
          name: gate-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.STATUS_TOKEN }}

  accept:
    name: Record an acceptance
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: template-review-${{ github.event.client_payload.issue }}
      cancel-in-progress: false
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@main

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@main
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Label and comment on each newly ticked page
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          GH_REPO: termenbox/termenbox-source
          ISSUE: ${{ github.event.client_payload.issue }}
          ACTOR: ${{ needs.gate.outputs.actor }}
        run: |
          case "$ISSUE" in ''|*[!0-9]*) echo "bad ids"; exit 1 ;; esac
          AFTER=$(gh api "repos/termenbox/termenbox-source/issues/$ISSUE" --jq '.body // ""')
          me=$(gh api user --jq .login)
          BEFORE=$(gh api --paginate "repos/termenbox/termenbox-source/issues/$ISSUE/comments" --jq ".[] | select(.user.login == \"$me\") | .body" \
            | sed -n 's/^Accepted `\([a-z0-9-]*\)` at `\([0-9a-f]*\)`.*/- [x] accept \1 \2/p')
          export BEFORE AFTER
          node scripts/template-review.mjs ticked | jq -r '.ticked[] | "\(.page) \(.sha)"' | while read -r page sha; do
            gh label create "accepted-$page" --color 0e8a16 --description "Template accepted by the owner" 2>/dev/null || true
            gh issue edit "$ISSUE" --add-label "accepted-$page"
            gh issue comment "$ISSUE" --body "Accepted \`$page\` at \`$sha\` (ticked by @$ACTOR). The wiring step may start."
          done

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@main
        with:
          key: ${{ secrets.LOG_KEY }}
          name: accept-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}
            ${{ secrets.STATUS_TOKEN }}

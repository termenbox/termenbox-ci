name: Release freeze

# Publishes a signed freeze for one channel: the channel's current manifest with "freeze": true
# and a newer version, signed by that channel's release key in its GitHub Environment. Every updater and installer that
# follows the channel then stops. The freeze is lifted by releasing a version newer than the freeze; the release
# workflows refuse an older one while it holds (check_not_frozen.sh). The steps to run it are in SECURITY.md.
# The freeze goes to R2 first, because installers and updaters read the download host before the mirror: it is written to
# the channel's pointer (and, for stable, the beta pointer a beta server also follows) with the same forward-only rule and
# the same key pair as a release (publish_r2.sh --freeze), and then to the Releases of the product repo. A run that fails after
# R2 can be run again with the same version while the mirror still holds the old manifest: the pointer already holds the
# freeze and only the mirror is finished.
# publish=false does everything but publish, with a throwaway key.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to freeze'
        type: choice
        options: [stable, beta, nightly]
        required: true
      version:
        description: 'Version of the freeze: full SemVer, newer than the one the channel holds now'
        type: string
        required: true
      notes:
        description: 'Text shown with the freeze'
        type: string
        default: ''
      publish:
        description: 'Publish the freeze (otherwise a dry run that publishes nothing)'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: quiet {0}

# A group of its own per channel, never the release's (r2-pointers-*): a freeze must not wait in the one pending slot of
# a release's group and be replaced by a later release. Two freezes of one channel queue (a third replaces the one still
# waiting, which is a freeze to run again). A freeze and a release that overlap on a pointer are kept apart by
# publish_r2.sh alone: it reads the pointer right before writing it and writes only a newer version, and a freeze reads
# its channel's pointer back and fails unless it holds the freeze, so a displaced freeze is a red run to repeat.
concurrency:
  group: r2-freeze-${{ inputs.channel }}
  cancel-in-progress: false

env:
  TB_EVENT: ${{ github.event.client_payload.event || github.event_name }}
  TB_TAG: ${{ github.event.client_payload.tag }}

jobs:
  # The one review of this run. It holds no secret and runs no code; every job that uses a channel Environment needs it
  # (scripts/check-approval-jobs.mjs), so the channel Environments carry secrets and a branch policy but no reviewer.
  approve:
    name: Approve
    if: ${{ inputs.channel != 'nightly' }}
    runs-on: ubuntu-latest
    environment: approve-${{ inputs.channel }}
    steps:
      - shell: bash
        run: echo "approved"

  freeze:
    needs: approve
    if: ${{ !cancelled() && (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    name: Freeze ${{ inputs.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The channel's signing key is the secret RELEASE_SIGNING_KEY of this environment.
    environment: ${{ inputs.channel }}
    permissions:
      contents: write
    env:
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
      PUBLISH: ${{ inputs.publish }}
      GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
      GH_REPO: termenbox/termenbox
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@c793fdd572460ac87af14956e6676e4c1dac25f6
      - uses: termenbox/termenbox-ci/.github/actions/release-tools@c793fdd572460ac87af14956e6676e4c1dac25f6

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@c793fdd572460ac87af14956e6676e4c1dac25f6
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Read the manifest the channel holds now
        run: |
          mkdir -p dist
          case "$CHANNEL" in
            stable) gh release download "$(gh release view --json tagName -q .tagName)" -p manifest.json -D dist ;;
            *) gh release download "channel-$CHANNEL" -p manifest.json -D dist ;;
          esac
          jq -r '"holds \(.version) (\(.channel), freeze=\(.freeze))"' dist/manifest.json

      - name: Write the freeze
        run: |
          python3 "$TB_RELEASE_TOOLS/freeze_manifest.py" dist/manifest.json dist/freeze.json "$VERSION" "$CHANNEL" --notes "$NOTES"
          mv dist/freeze.json dist/manifest.json
          cat dist/manifest.json

      - name: Sign the freeze
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          case "$CHANNEL" in stable) kid=r1 ;; beta) kid=b1 ;; nightly) kid=n1 ;; esac
          if [ -n "$RELEASE_SIGNING_KEY" ] && [ "$PUBLISH" = true ]; then
            printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release_key"
            keys=packages/server/release-keys.txt
          elif [ "$PUBLISH" = true ]; then
            echo "RELEASE_SIGNING_KEY is not set in the $CHANNEL environment: refusing to publish an unsigned freeze"; exit 1
          else
            echo "::warning::dry run: signing with a throwaway key"
            ssh-keygen -q -t ed25519 -N '' -C throwaway -f "$RUNNER_TEMP/release_key"
            bound=""; [ "$CHANNEL" = stable ] || bound=" channel=$CHANNEL"
            echo "$kid $(cut -d' ' -f1,2 "$RUNNER_TEMP/release_key.pub")$bound" > "$RUNNER_TEMP/release-keys.txt"
            keys="$RUNNER_TEMP/release-keys.txt"
          fi
          sh "$TB_RELEASE_TOOLS/sign_manifest.sh" "$RUNNER_TEMP/release_key" "$keys" "$kid" "$CHANNEL" dist/manifest.json
          rm -f "$RUNNER_TEMP/release_key"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-freeze
          path: |
            dist/manifest.json
            dist/manifest.json.sig
          retention-days: 7

      # R2 first: what installers and updaters read. The channel's own pointer must take the freeze (the script fails
      # otherwise); a stable freeze also covers the beta pointer, which only moves when the freeze is newer than it.
      - name: Publish the freeze to R2
        if: inputs.publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_RELEASE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_RELEASE_BUCKET }}
        run: |
          aliases=""; [ "$CHANNEL" != stable ] || aliases="channel-beta"
          sh "$TB_RELEASE_TOOLS/publish_r2.sh" --freeze dist "$CHANNEL" "$VERSION" "$aliases"

      # Stable's address is the GitHub latest release, so a stable freeze is a release of its own that holds only the
      # manifest and its signature; the binaries stay under the tag the manifest names. It also moves channel-beta,
      # which a beta server follows too. A beta or nightly freeze moves that channel's alias.
      - name: Publish
        if: inputs.publish
        run: |
          if [ "$CHANNEL" = stable ]; then
            gh release create "v$VERSION" --title "v$VERSION (freeze)" --latest \
              --notes "Signed freeze of the stable channel: updaters and the installer stop until a newer release. ${NOTES}" \
              dist/manifest.json dist/manifest.json.sig
            sh "$TB_RELEASE_TOOLS/update_alias.sh" channel-beta dist/manifest.json dist/manifest.json.sig
          else
            sh "$TB_RELEASE_TOOLS/update_alias.sh" "channel-$CHANNEL" dist/manifest.json dist/manifest.json.sig
          fi

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@c793fdd572460ac87af14956e6676e4c1dac25f6
        with:
          key: ${{ secrets.LOG_KEY }}
          name: freeze-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.MIRROR_TOKEN }}
            ${{ secrets.R2_RELEASE_ACCESS_KEY_ID }}
            ${{ secrets.R2_RELEASE_SECRET_ACCESS_KEY }}
            ${{ secrets.RELEASE_SIGNING_KEY }}
            ${{ secrets.SOURCE_TOKEN }}

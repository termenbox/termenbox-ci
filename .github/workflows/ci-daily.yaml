name: CI daily
run-name: "CI daily · the head of develop"

# A push to develop runs a smoke set and a pull request runs one desktop size and the phone (WebKit only when the client
# changed), see ci.yaml. Everything else (Firefox, every size, the full WebKit matrix, both static binaries, the installers) runs here once
# a day on the head of develop. A red run is fixed like a red push: the failing job posts its scrubbed log to the
# rolling failure issue, and this run writes no commit status. The run also refreshes the static-binary caches, which
# a push no longer writes.
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Run the full CI on the head of develop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: rt-develop
        name: Token to read the head of develop
        uses: termenbox/termenbox-ci/.github/actions/app-token@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          permissions: '{"contents":"read"}'
      - name: Dispatch ci.yaml on the head of develop
        shell: bash
        env:
          SOURCE_TOKEN: ${{ steps.rt-develop.outputs.token }}
        run: |
          set -eu
          sha=$(GH_TOKEN="$SOURCE_TOKEN" gh api repos/termenbox/termenbox-source/commits/develop -q .sha)
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "no develop sha"; exit 1; }
          gh workflow run ci.yaml --ref main -R "$GITHUB_REPOSITORY" -f sha="$sha"

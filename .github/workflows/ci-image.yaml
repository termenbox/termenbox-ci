name: Build CI Image
run-name: "Build CI Image · ${{ github.event.client_payload.pr && format('PR #{0}', github.event.client_payload.pr) || github.event.client_payload.tag || github.event.client_payload.event || 'manual' }}${{ (github.event.client_payload.sha || inputs.sha) && format(' · {0}', (github.event.client_payload.sha || inputs.sha)) || '' }}"

# CI image for the browser matrix jobs. The Playwright OS deps and browser binaries change rarely;
# rebuilding weekly picks up OS security fixes and a new Playwright build, and the matrix jobs then
# start FROM it and skip the apt install that used to stall on azure.archive.ubuntu.com.
on:
  repository_dispatch:
    types: [source-pushed]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Source commit to run on (a test of this workflow from a ci-repo branch); empty means the head of develop'
        type: string
        required: false
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: quiet {0}

env:
  IMAGE: ghcr.io/termenbox/termenbox-ci

jobs:
  # Generated: a push runs this workflow only when it changed one of the paths the original `on.push.paths` lists.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          EVENT: ${{ github.event.client_payload.event || 'other' }}
          BASE: ${{ github.event.client_payload.base }}
          SHA: ${{ (github.event.client_payload.sha || inputs.sha) }}
        run: |
          yes() { echo run=true >> "$GITHUB_OUTPUT"; exit 0; }
          case "$EVENT" in tag|pull_request|comment) echo run=false >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          [ "$EVENT" = push ] || yes
          [ -n "$BASE" ] || yes
          files=$(gh api "repos/termenbox/termenbox-source/compare/$BASE...$SHA" --jq '.files[].filename' 2>/dev/null) || yes
          for f in $files; do
            case "$f" in
              docker/Dockerfile.ci) yes ;;
            esac
          done
          echo run=false >> "$GITHUB_OUTPUT"

  ci:
    name: Build & Push CI
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@e737203677459b53d9f48012f376e46b2d809845

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@e737203677459b53d9f48012f376e46b2d809845
        with:
          sha: ${{ (github.event.client_payload.sha || inputs.sha) }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: push
        env:
          BUILDKIT_PROGRESS: quiet
        with:
          context: .
          file: docker/Dockerfile.ci
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_id }}

      # ci.yaml pulls this image by digest. This run cannot change ci.yaml (only the owner opens a branch here), so when the
      # new digest is not the one ci.yaml pins, it posts that digest, and nothing else, to the rolling `CI failures` issue;
      # the next change to ci.yaml bumps both container lines. The monthly sweep's ci-image-age fails a bump left 60 days.
      - name: Say when the digest moved
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_TOKEN: ${{ secrets.LOG_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) exit 1 ;; esac
          [ "${#DIGEST}" -eq 71 ] && [ -z "$(printf '%s' "${DIGEST#sha256:}" | tr -d 0-9a-f)" ] || exit 1
          pins="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/ci.yaml?ref=main" -H 'Accept: application/vnd.github.raw' \
            | grep -o 'termenbox-ci@sha256:[0-9a-f]\{64\}' | sed 's/.*@//' | sort -u)" || exit 1
          [ "$pins" = "$DIGEST" ] && exit 0
          [ -n "$LOG_TOKEN" ] || exit 1
          export GH_TOKEN="$LOG_TOKEN" GH_REPO=termenbox/termenbox-source
          n="$(gh issue list --label ci-failure --state open --search '"CI failures" in:title' --json number,title --jq '[.[] | select(.title == "CI failures")][0].number // empty')" || exit 1
          if [ -z "$n" ]; then
            gh label create ci-failure --color B60205 --description "A job of the ci repo failed" >/dev/null 2>&1 || true
            url="$(gh issue create --title "CI failures" --label ci-failure --body "Rolling log of failed ci-repo jobs: one comment per failure, scrubbed. Written by termenbox-ci .github/actions/finish.")" && n="${url##*/}"
          fi
          [ -n "$n" ] && gh issue comment "$n" --body "ci-image moved: $IMAGE@$DIGEST" >/dev/null

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@e737203677459b53d9f48012f376e46b2d809845
        with:
          key: ${{ secrets.LOG_KEY }}
          name: ci-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.GITHUB_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}
          needs: ${{ toJSON(needs) }}

      - if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          SHA: ${{ (github.event.client_payload.sha || inputs.sha) }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESC: ${{ steps.finish.outputs.summary || 'ci result' }}
        run: |
          [ -n "$GH_TOKEN" ] && [ -n "$SHA" ] || exit 0
          gh api -X POST "repos/termenbox/termenbox-source/statuses/$SHA" -f state="$STATE" -f context=ci \
            -f description="$DESC" -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null 2>&1 || true

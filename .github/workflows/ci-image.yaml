# GENERATED by scripts/port-workflow.py from termenbox/termenbox .github/workflows/ci-image.yaml. Do not edit here: change the original and port again.
name: Build CI Image

# CI image for the browser matrix jobs. The Playwright OS deps and browser binaries change rarely;
# rebuilding weekly picks up OS security fixes and a new Playwright build, and the matrix jobs then
# start FROM it and skip the apt install that used to stall on azure.archive.ubuntu.com.
on:
  repository_dispatch:
    types: [source-pushed]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: quiet {0}

env:
  IMAGE: ghcr.io/termenbox/termenbox-ci

jobs:
  # Generated: a push runs this workflow only when it changed one of the paths the original `on.push.paths` lists.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          EVENT: ${{ github.event.client_payload.event || 'other' }}
          BASE: ${{ github.event.client_payload.base }}
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          yes() { echo run=true >> "$GITHUB_OUTPUT"; exit 0; }
          case "$EVENT" in tag|pull_request|comment) echo run=false >> "$GITHUB_OUTPUT"; exit 0 ;; esac
          [ "$EVENT" = push ] || yes
          [ -n "$BASE" ] || yes
          files=$(gh api "repos/termenbox/termenbox/compare/$BASE...$SHA" --jq '.files[].filename' 2>/dev/null) || yes
          for f in $files; do
            case "$f" in
              docker/Dockerfile.ci|.github/workflows/ci-image.yaml) yes ;;
            esac
          done
          echo run=false >> "$GITHUB_OUTPUT"

  ci:
    name: Build & Push CI
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@main

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@main
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          BUILDKIT_PROGRESS: quiet
        with:
          context: .
          file: docker/Dockerfile.ci
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_id }}

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@main
        with:
          key: ${{ secrets.LOG_KEY }}
          name: ci-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.GITHUB_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}
          needs: ${{ toJSON(needs) }}

      - if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STATUS_TOKEN }}
          SHA: ${{ github.event.client_payload.sha }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESC: ${{ steps.finish.outputs.summary || 'ci result' }}
        run: |
          [ -n "$GH_TOKEN" ] && [ -n "$SHA" ] || exit 0
          gh api -X POST "repos/termenbox/termenbox/statuses/$SHA" -f state="$STATE" -f context=ci \
            -f description="$DESC" -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null 2>&1 || true

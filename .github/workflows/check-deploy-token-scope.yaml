# GENERATED by scripts/port-workflow.py from termenbox/termenbox .github/workflows/check-deploy-token-scope.yaml. Do not edit here: change the original and port again.
name: Check Deploy Token Scope

# Step 4.4 of docs/plans/security-surface-review.md: weekly, confirm each environment's Cloudflare token is active, expires,
# and is refused on reads outside a deploy. It runs inside the protected environment that holds the token, never on a
# pull request. The job has no GITHUB_TOKEN permissions, so the commit is fetched anonymously and no action is used.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: quiet {0}

env:
  TB_EVENT: ${{ github.event.client_payload.event || github.event_name }}
  TB_TAG: ${{ github.event.client_payload.tag }}

jobs:
  scope:
    name: Token scope (${{ matrix.environment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: [stable, beta, nightly, cloud, site]
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@main

      - name: Fetch the script
        env:
          REPO: termenbox/termenbox
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          git init -q .
          git fetch -q --depth 1 "https://github.com/$REPO.git" "$SHA"
          git checkout -q FETCH_HEAD
      - name: Check the token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: node scripts/check-deploy-token-scope.mjs "$ENVIRONMENT"

      - if: always()
        uses: termenbox/termenbox-ci/.github/actions/finish@main
        with:
          key: ${{ secrets.LOG_KEY }}
          name: scope-${{ strategy.job-index }}

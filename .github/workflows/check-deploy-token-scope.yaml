name: Check Deploy Token Scope

# Weekly, confirm each environment's Cloudflare token is active, expires,
# and is refused on reads outside a deploy. It runs inside the protected environment that holds the token, never on a
# pull request. The job has no GITHUB_TOKEN permissions, so the commit is fetched anonymously and no action is used.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: quiet {0}

env:
  TB_EVENT: ${{ github.event.client_payload.event || github.event_name }}
  TB_TAG: ${{ github.event.client_payload.tag }}

jobs:
  scope:
    name: Token scope (${{ matrix.environment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: [stable, beta, nightly, cloud, site]
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - name: Check the token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: node scripts/check-deploy-token-scope.mjs "$ENVIRONMENT"

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          key: ${{ secrets.LOG_KEY }}
          name: scope-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            ${{ secrets.CLOUDFLARE_API_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

name: Build the source

# Public harness. The source is read with a read-only token.
# Public logs must never carry source: every step's output goes to a file, the job log shows only exit codes,
# and the file is uploaded encrypted. Never add a pull_request trigger: a fork PR
# could change this file and print the checkout.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit of the source
        default: develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the source
        env:
          TOKEN: ${{ secrets.SOURCE_TOKEN }}
          REF: ${{ github.event.inputs.ref || github.event.client_payload.ref || 'develop' }}
        run: |
          set +x
          git -c credential.helper= clone --quiet "https://x-access-token:${TOKEN}@github.com/termenbox/termenbox-source.git" src >/dev/null 2>&1
          git -C src remote set-url origin https://github.com/termenbox/termenbox-source.git
          git -C src checkout --quiet "$REF" >/dev/null 2>&1
          echo "checked out ${REF}"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Build and test (output withheld)
        id: run
        working-directory: src
        run: |
          set +e
          { cargo build --workspace --release && cargo test --workspace \
            && pnpm install --frozen-lockfile && pnpm -r build && pnpm -r test; } > ../build.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Encrypt log
        if: always()
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in build.log -out build.log.enc 2>/dev/null || true
          rm -f build.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: build-log-encrypted
          path: build.log.enc
          retention-days: 7
      - name: Result
        run: test "${{ steps.run.outputs.exit }}" = 0

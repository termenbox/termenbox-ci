name: Release (stable)
run-name: "Release (stable) · ${{ github.event.client_payload.pr && format('PR #{0}', github.event.client_payload.pr) || github.event.client_payload.tag || github.event.client_payload.event || 'manual' }}${{ github.event.client_payload.sha && format(' · {0}', github.event.client_payload.sha) || '' }}"

# A tag vX.Y.Z on master publishes the stable release: binaries, tmux, a manifest signed by the stable key
# `r1` from the `stable` environment, and the GitHub "latest" release. It also moves channel-beta when this release is newer
# than the last beta, because a beta server follows the stable line too. The Docker tags come from docker-build.yaml.
# Run by hand it does everything but publish, so the pipeline can be tested.

on:
  repository_dispatch:
    types: [source-tag]
  workflow_dispatch:
    inputs:
      version:
        description: 'X.Y.Z for a dry run (nothing is published)'
        default: '0.0.0'

permissions:
  contents: read

defaults:
  run:
    shell: quiet {0}

env:
  TB_EVENT: ${{ github.event.client_payload.event || github.event_name }}
  TB_TAG: ${{ github.event.client_payload.tag }}

jobs:
  # The one review of this run. It holds no secret and runs no code; every job that uses a channel Environment needs it
  # (scripts/check-approval-jobs.mjs), so the channel Environments carry secrets and a branch policy but no reviewer.
  approve:
    name: Approve
    if: ${{ !contains(github.event.client_payload.tag || format('v{0}', inputs.version), '-') }}
    runs-on: ubuntu-latest
    environment: approve-stable
    steps:
      - shell: bash
        run: echo "approved"

  gate:
    needs: approve
    if: ${{ !cancelled() && needs.approve.result == 'success' }}
    name: Gate
    runs-on: ubuntu-latest
    # The gate reads the review repo with REVIEWS_TOKEN, a secret of this Environment; the review itself is the approve job above.
    environment: stable
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
      run: ${{ steps.g.outputs.run }}
      version: ${{ steps.g.outputs.version }}
      tag: ${{ steps.g.outputs.tag }}
      aliases: ${{ steps.g.outputs.aliases }}
      docker_tags: ${{ steps.g.outputs.docker_tags }}
      publish: ${{ steps.g.outputs.publish }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
      - uses: termenbox/termenbox-ci/.github/actions/release-tools@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          sha: ${{ github.event.client_payload.sha }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          depth: 0
          base: ${{ github.event.client_payload.base }}
          fetch: master
          branch: master
      - id: rt-commits
        name: Token for the next step (contents/statuses)
        uses: termenbox/termenbox-ci/.github/actions/app-token@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          permissions: '{"contents":"read","statuses":"read"}'
      - id: g
        env:
          GH_TOKEN: ${{ steps.rt-commits.outputs.token }}
          GH_REPO: termenbox/termenbox-source
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "$TB_EVENT" = tag ]; then
            tag="$TB_TAG"; publish=true
          else
            tag="v$DISPATCH_VERSION"; publish=false
          fi
          plan="$(python3 "$TB_RELEASE_TOOLS/release_plan.py" tag "$tag")"
          channel="$(jq -r .channel <<<"$plan")"
          if [ "$channel" != stable ]; then
            echo "::notice::$tag is not a stable tag; nothing to do"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          crate="$(grep -m1 '^version' packages/server/Cargo.toml | cut -d'"' -f2)"
          version="$(jq -r .version <<<"$plan")"
          if [ "$publish" = true ]; then
            [ "$version" = "$crate" ] || { echo "tag $tag does not match packages/server/Cargo.toml version $crate"; exit 1; }
            git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/master || { echo "$tag is not on master (decision 0129): a stable release comes only from master"; exit 1; }
            # What is released is what CI built and tested (the nightly asks the same of its commit).
            green="$(gh api "repos/termenbox/termenbox-source/commits/$(git rev-parse HEAD)/status" --jq '[.statuses[]|select(.context=="ci" and .state=="success")]|length')"
            [ "${green:-0}" -gt 0 ] || { echo "no green CI run for $(git rev-parse HEAD): a stable release is built from a commit CI has passed (wait for CI, then push the tag again)"; exit 1; }
          fi
          {
            echo "run=true"; echo "publish=$publish"; echo "version=$version"; echo "tag=$tag"
            echo "aliases=$(jq -r '.aliases | join(" ")' <<<"$plan")"
            echo "docker_tags=$(jq -r '.docker_tags | join(" ")' <<<"$plan")"
          } >> "$GITHUB_OUTPUT"
      # No signing job runs unless this step passes.
      # It also runs on a dry run, so a stale or open review shows up before a real tag does.
      - name: Security review gate
        if: steps.g.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.REVIEWS_TOKEN }}
        run: |
          # Rule 1: the gate runs from master's copy of its script and the scripts it runs, not from the release
          # commit's checkout. A script not yet on master stops the release.
          set -eu
          gate="$RUNNER_TEMP/gate"
          mkdir -p "$gate"
          for f in check-security-review.mjs check-security-surface.mjs check-security-counts.mjs; do
            git show "refs/remotes/origin/master:scripts/$f" > "$gate/$f" || { echo "scripts/$f is not on origin/master: the release gate cannot run, so nothing is released"; exit 1; }
          done
          node "$gate/check-security-review.mjs" "$(git rev-parse HEAD)"

      # A signed freeze (release-freeze.yaml) holds the channel until a release newer than it is made.
      - name: Freeze gate
        if: steps.g.outputs.run == 'true' && steps.g.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: termenbox/termenbox
          VERSION: ${{ steps.g.outputs.version }}
        run: sh "$TB_RELEASE_TOOLS/check_not_frozen.sh" stable "$VERSION"

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@fda5883ce5ffd5a13831b5c1b14ba8ad6d46435d
        with:
          key: ${{ secrets.LOG_KEY }}
          name: gate-${{ strategy.job-index }}
          status: ${{ job.status }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          secrets: |-
            ${{ secrets.GITHUB_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}
            ${{ secrets.STATUS_TOKEN }}
            ${{ secrets.REVIEWS_TOKEN }}
            ${{ secrets.REPORTER_APP_KEY }}

  # A pull request and a push run a reduced set of browsers and sizes; a stable release is built from a
  # commit the full set has passed. This job asks for that result: a green full run of this exact commit (the daily run
  # or an earlier try), or it starts one and waits. It holds no secret and runs no code from the source: only the run's own
  # token, which starts and reads a workflow of this repo, as ci-daily does. A red full run stops the release; the fix is a new
  # commit, not a rerun.
  full-ci:
    name: Full CI
    needs: gate
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.run == 'true' && needs.gate.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: write
      contents: read
    steps:
      - name: A green full run of this commit, or one started now
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -eu
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "no release commit"; exit 1; }
          # Only a run of main counts (the sha input also tests a change to the workflow from a ci-repo branch).
          runs() { gh run list --workflow ci.yaml --event workflow_dispatch --branch main -L 60 --json databaseId,displayTitle,createdAt,status,conclusion \
            --jq "[.[] | select(.displayTitle | endswith(\" · $SHA\"))]"; }
          if [ "$(runs | jq '[.[] | select(.conclusion == "success")] | length')" -gt 0 ]; then
            echo "a full run of $SHA already passed"; exit 0
          fi
          # A red full run of this commit stops the release: the fix is a new commit, and this job does not start a second run
          # of the same commit that could pass by chance.
          red=$(runs | jq -r '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out")][0].databaseId // empty')
          [ -z "$red" ] || { echo "the full run of $SHA is red (run $red): a stable release needs a new commit with a green full run"; exit 1; }
          # A full run of this commit that is still going is waited for, not started twice.
          id=$(runs | jq -r '[.[] | select(.status != "completed")][0].databaseId // empty')
          if [ -z "$id" ]; then
            start=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run ci.yaml --ref main -f sha="$SHA"
            for _ in $(seq 1 30); do
              id=$(runs | jq -r --arg t "$start" '[.[] | select(.createdAt >= $t)][0].databaseId // empty')
              [ -n "$id" ] && break
              sleep 10
            done
          fi
          [ -n "$id" ] || { echo "the full run did not start"; exit 1; }
          # A slow refresh: a watch at the default 3 s costs about a thousand API calls an hour, the limit of this token.
          gh run watch "$id" -i 30 --exit-status >/dev/null || { echo "the full run of $SHA is red or was cancelled (run $id): a stable release needs a new commit with a green full run"; exit 1; }

  # GitHub does not start a workflow for a tag its own token created, and a second run would need its own approvals, so
  # the image is built by calling the workflow in this run. The release waits for the image tag and signs its digests.
  image:
    name: Image
    needs: [gate, full-ci]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.full-ci.result == 'success' && needs.gate.outputs.run == 'true' && needs.gate.outputs.publish == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-build.yaml
    secrets: inherit
    with:
      sha: ${{ github.event.client_payload.sha }}
      version: ${{ needs.gate.outputs.version }}
      tags: ${{ needs.gate.outputs.docker_tags }}
      channel: stable

  release:
    name: Release
    needs: [gate, full-ci]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.run == 'true' && (needs.full-ci.result == 'success' || needs.full-ci.result == 'skipped') }}
    permissions:
      actions: read
      contents: write
      deployments: write
      packages: read
    uses: ./.github/workflows/release-build.yaml
    secrets: inherit
    with:
      channel: stable
      kid: r1
      version: ${{ needs.gate.outputs.version }}
      tag: ${{ needs.gate.outputs.tag }}
      sha: ${{ github.event.client_payload.sha }}
      publish: ${{ needs.gate.outputs.publish == 'true' }}
      prerelease: false
      latest: true
      aliases: ${{ needs.gate.outputs.aliases }}
      deploy: true
      notes: |-
        Known and accepted for this release:
        - The web client at app.termenbox.dev is deployed after this release is published, once its bundle has been signed offline. Until then the previous client is served; it verifies this release's signed manifest in the same way.
        - The signing and update trust roots were reviewed by the maintainer's own process only, not by an independent human reader.

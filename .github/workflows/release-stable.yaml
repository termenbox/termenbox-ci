# GENERATED by scripts/port-workflow.py from termenbox/termenbox .github/workflows/release-stable.yaml. Do not edit here: change the original and port again.
name: Release (stable)

# A tag vX.Y.Z on master publishes the stable release (decision 0130): binaries, tmux, a manifest signed by the stable key
# `r1` from the `stable` environment, and the GitHub "latest" release. It also moves channel-beta when this release is newer
# than the last beta, because a beta server follows the stable line too. The Docker tags come from docker-build.yaml.
# Run by hand it does everything but publish, so the pipeline can be tested.

on:
  repository_dispatch:
    types: [source-pushed]
  workflow_dispatch:
    inputs:
      version:
        description: 'X.Y.Z for a dry run (nothing is published)'
        default: '0.0.0'

permissions:
  contents: read

defaults:
  run:
    shell: quiet {0}

env:
  TB_EVENT: ${{ github.event.client_payload.event || github.event_name }}
  TB_TAG: ${{ github.event.client_payload.tag }}

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
      version: ${{ steps.g.outputs.version }}
      tag: ${{ steps.g.outputs.tag }}
      aliases: ${{ steps.g.outputs.aliases }}
      publish: ${{ steps.g.outputs.publish }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@main

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@main
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          depth: 0
          base: ${{ github.event.client_payload.base }}
          remote: true
      - id: g
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          GH_REPO: termenbox/termenbox
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "$TB_EVENT" = tag ]; then
            tag="$TB_TAG"; publish=true
          else
            tag="v$DISPATCH_VERSION"; publish=false
          fi
          plan="$(python3 .github/scripts/release_plan.py tag "$tag")"
          channel="$(jq -r .channel <<<"$plan")"
          if [ "$channel" != stable ]; then
            echo "::notice::$tag is not a stable tag; nothing to do"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          crate="$(grep -m1 '^version' packages/server/Cargo.toml | cut -d'"' -f2)"
          version="$(jq -r .version <<<"$plan")"
          if [ "$publish" = true ]; then
            [ "$version" = "$crate" ] || { echo "tag $tag does not match packages/server/Cargo.toml version $crate"; exit 1; }
            git fetch -q origin master
            git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/master || { echo "$tag is not on master (decision 0129): a stable release comes only from master"; exit 1; }
            # What is released is what CI built and tested (the nightly asks the same of its commit).
            green="$(gh api "repos/termenbox/termenbox/commits/$(git rev-parse HEAD)/status" --jq '[.statuses[]|select(.context=="ci" and .state=="success")]|length')"
            [ "${green:-0}" -gt 0 ] || { echo "no green CI run for $(git rev-parse HEAD): a stable release is built from a commit CI has passed (wait for CI, then push the tag again)"; exit 1; }
          fi
          {
            echo "run=true"; echo "publish=$publish"; echo "version=$version"; echo "tag=$tag"
            echo "aliases=$(jq -r '.aliases | join(" ")' <<<"$plan")"
          } >> "$GITHUB_OUTPUT"
      # GUARDRAIL a-release-needs-its-security-review-closed: no signing job runs unless this step passes.
      # It also runs on a dry run, so a stale or open review shows up before a real tag does.
      - name: Security review gate
        if: steps.g.outputs.run == 'true'
        run: |
          # Rule 1: the gate runs from master's copy of its script and the script it imports, not from the release
          # commit's checkout. A script not yet on master stops the release.
          set -eu
          git fetch -q origin master
          gate="$RUNNER_TEMP/gate"
          mkdir -p "$gate"
          for f in check-security-review.mjs check-security-surface.mjs; do
            git show "origin/master:scripts/$f" > "$gate/$f" || { echo "scripts/$f is not on origin/master: the release gate cannot run, so nothing is released"; exit 1; }
          done
          node "$gate/check-security-review.mjs" "$(git rev-parse HEAD)"

      # A signed freeze (release-freeze.yaml) holds the channel until a release newer than it is made.
      - name: Freeze gate
        if: steps.g.outputs.run == 'true' && steps.g.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          GH_REPO: termenbox/termenbox
          VERSION: ${{ steps.g.outputs.version }}
        run: sh .github/scripts/check_not_frozen.sh stable "$VERSION"

      - if: always()
        uses: termenbox/termenbox-ci/.github/actions/finish@main
        with:
          key: ${{ secrets.LOG_KEY }}
          name: gate-${{ strategy.job-index }}

  release:
    name: Release
    needs: gate
    if: needs.gate.outputs.run == 'true'
    permissions:
      contents: write
      deployments: write
      packages: read
    uses: ./.github/workflows/release-build.yaml
    secrets: inherit
    with:
      channel: stable
      kid: r1
      version: ${{ needs.gate.outputs.version }}
      tag: ${{ needs.gate.outputs.tag }}
      sha: ${{ github.event.client_payload.sha }}
      publish: ${{ needs.gate.outputs.publish == 'true' }}
      prerelease: false
      latest: true
      aliases: ${{ needs.gate.outputs.aliases }}
      deploy: true

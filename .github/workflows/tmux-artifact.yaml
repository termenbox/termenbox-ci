name: tmux artifact

# Publishes the pinned tmux (static, built from the sources pinned in build-tmux.sh) as a release of this public repo,
# so a bench downloads it in seconds instead of depending on a cache that GitHub evicts after a week. The release is
# named by the hash of the build script, as the cache key was: moving a pin in build-tmux.sh means a new release and
# nothing else. Running it twice does nothing the second time. The binary is built here from the pinned sources and put
# through the same gate as the bundled one; the licence texts of tmux, libevent and ncurses go beside it.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Source commit or branch to build the script from
        default: develop

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@8a830ae40dc43ed9db9c18a5bc7d30c965eab7c1

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@8a830ae40dc43ed9db9c18a5bc7d30c965eab7c1
        with:
          sha: ${{ inputs.sha }}
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}

      - name: Name the release and look for it
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="tmux-$(sha256sum .github/scripts/build-tmux.sh | cut -c1-16)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo termenbox/termenbox-ci >/dev/null 2>&1; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "$tag is published already"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the musl toolchain
        if: steps.rel.outputs.have != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools bison

      - name: Build
        if: steps.rel.outputs.have != 'true'
        run: .github/scripts/build-tmux.sh tmux-out

      - name: Gate
        if: steps.rel.outputs.have != 'true'
        run: .github/scripts/check-tmux.sh tmux-out/tmux

      - name: Publish
        if: steps.rel.outputs.have != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          mkdir pub
          cp tmux-out/tmux pub/tmux-x86_64-linux
          cp tmux-out/tmux-COPYING tmux-out/tmux-libevent-LICENSE tmux-out/tmux-ncurses-COPYING pub/
          (cd pub && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          gh release create "$TAG" pub/* --repo termenbox/termenbox-ci --title "$TAG" \
            --notes "The pinned tmux, static, from the sources pinned in build-tmux.sh (build script hash ${TAG#tmux-}). Licence texts and SHA256SUMS beside the binary."

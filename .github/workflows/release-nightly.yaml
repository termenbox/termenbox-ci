# GENERATED by scripts/port-workflow.py from termenbox/termenbox .github/workflows/release-nightly.yaml. Do not edit here: change the original and port again.
name: Release (nightly)

# One nightly a day from a develop commit whose CI is green (decisions 0129, 0130). It runs when CI finishes green on
# develop (the first green commit of a UTC day becomes that day's nightly) and at 00:00 UTC as a fallback, which
# builds the newest green develop commit. It never builds a red head: the commit comes from a successful CI run,
# not from the branch tip. Tag vYYYY.MM.DD-nightly, manifest version X.Y.Z-nightly.YYYYMMDD, signed by the
# nightly key `n1` from the `nightly` environment. Keeps 14 days of nightlies, never the one channel-nightly
# points at. Run by hand it is a dry run unless `publish` is ticked.
#
# It publishes to the nightly/ path of the R2 bucket and to the Releases of the ci repo (release-build.yaml, decision
# 0212), and nothing else: no stable or beta path, key or alias. It does not call the security review gate (decision 0133).
# The Releases it reads and prunes are those of the ci repo, with the workflow token (CI_TOKEN and CI_REPO below); the
# other GH_TOKEN reads the private source.

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the release (otherwise a dry run that publishes nothing)'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: quiet {0}

# Two triggers can overlap (CI finishing at midnight); a second run waits and then sees today's release.
concurrency:
  group: release-nightly
  cancel-in-progress: false

env:
  TB_EVENT: ${{ github.event.client_payload.event || github.event_name }}
  TB_TAG: ${{ github.event.client_payload.tag }}

jobs:
  select:
    name: Select the commit
    # a workflow_run fires for every CI run on a branch named develop, including a failed one and a pull request's
    if: (github.event.client_payload.event || github.event_name) != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
      run: ${{ steps.s.outputs.run }}
      sha: ${{ steps.s.outputs.sha }}
      tag: ${{ steps.s.outputs.tag }}
      version: ${{ steps.s.outputs.version }}
      aliases: ${{ steps.s.outputs.aliases }}
      docker_tags: ${{ steps.s.outputs.docker_tags }}
      publish: ${{ steps.s.outputs.publish }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@main

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@main
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          depth: 0
          base: ${{ github.event.client_payload.base }}
          remote: true
      - id: s
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          GH_REPO: termenbox/termenbox
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}
          CI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_REPO: termenbox/termenbox-ci
          EVENT: ${{ (github.event.client_payload.event || github.event_name) }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
        run: |
          git fetch -q origin develop
          if [ "$EVENT" = workflow_run ]; then
            sha="$RUN_SHA"
          else
            sha=""; for c in $(gh api "repos/termenbox/termenbox/commits?sha=develop&per_page=30" --jq '.[].sha'); do
            n="$(GH_TOKEN="$STATUS_TOKEN" gh api "repos/termenbox/termenbox/commits/$c/status" --jq '[.statuses[]|select(.context=="ci" and .state=="success")]|length')"
            if [ "${n:-0}" -gt 0 ]; then sha="$c"; break; fi
          done
          fi
          [ -n "$sha" ] || { echo "::notice::no green CI run on develop; nothing to release"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          git merge-base --is-ancestor "$sha" origin/develop || { echo "::notice::$sha is not on develop; nothing to release"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          publish=true
          if [ "$EVENT" = workflow_dispatch ] && [ "$DISPATCH_PUBLISH" != true ]; then publish=false; fi

          core="$(git show "$sha:packages/server/Cargo.toml" | grep -m1 '^version' | cut -d'"' -f2)"
          plan="$(python3 .github/scripts/release_plan.py nightly "$core" "$(date -u +%Y%m%d)")"
          tag="$(jq -r .tag <<<"$plan")"

          # A signed freeze (release-freeze.yaml) holds the channel until a release newer than it is made.
          if [ "$publish" = true ] && ! GH_TOKEN="$CI_TOKEN" GH_REPO="$CI_REPO" sh .github/scripts/check_not_frozen.sh nightly "$(jq -r .version <<<"$plan")"; then
            echo "::notice::nightly is frozen; nothing to release"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$publish" = true ]; then
            if GH_TOKEN="$CI_TOKEN" GH_REPO="$CI_REPO" gh release view "$tag" >/dev/null 2>&1; then
              echo "::notice::$tag already exists; one nightly a day"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # the ci repo has no tag at the source commit: the last nightly's notes name the commit it was built from
            last="$(GH_TOKEN="$CI_TOKEN" GH_REPO="$CI_REPO" gh release list --limit 100 --json tagName -q '.[].tagName' | grep -E '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-nightly$' | sort | tail -1)" || last=""
            if [ -n "$last" ] && GH_TOKEN="$CI_TOKEN" GH_REPO="$CI_REPO" gh release view "$last" --json body -q .body | grep -q "$sha"; then
              echo "::notice::$last was built from this commit; nothing changed"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          {
            echo "run=true"; echo "sha=$sha"; echo "publish=$publish"; echo "tag=$tag"
            echo "version=$(jq -r .version <<<"$plan")"
            echo "aliases=$(jq -r '.aliases | join(" ")' <<<"$plan")"
            echo "docker_tags=$(jq -r '.docker_tags | join(" ")' <<<"$plan")"
          } >> "$GITHUB_OUTPUT"

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@main
        with:
          key: ${{ secrets.LOG_KEY }}
          name: select-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.GITHUB_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}
            ${{ secrets.STATUS_TOKEN }}

  release:
    name: Release
    needs: select
    if: needs.select.outputs.run == 'true'
    permissions:
      actions: read
      contents: write
      deployments: write
      packages: read
    uses: ./.github/workflows/release-build.yaml
    secrets: inherit
    with:
      channel: nightly
      kid: n1
      version: ${{ needs.select.outputs.version }}
      tag: ${{ needs.select.outputs.tag }}
      sha: ${{ needs.select.outputs.sha }}
      publish: ${{ needs.select.outputs.publish == 'true' }}
      prerelease: true
      latest: false
      aliases: ${{ needs.select.outputs.aliases }}
      notes: 'Nightly build of develop at ${{ needs.select.outputs.sha }}. Not a supported release: it is for trying what is coming.'

  # GitHub does not start a workflow for a tag its own token created, so the image is built by calling the workflow. It
  # runs beside the release, which waits for the image tag and signs its digests into the manifest (decision 0155).
  image:
    name: Image
    needs: select
    if: needs.select.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-build.yaml
    secrets: inherit
    with:
      sha: ${{ needs.select.outputs.sha }}
      version: ${{ needs.select.outputs.version }}
      tags: ${{ needs.select.outputs.docker_tags }}

  deploy:
    name: Deploy the client
    needs: [select, release]
    if: needs.select.outputs.publish == 'true'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-pages.yaml
    secrets: inherit
    with:
      channel: nightly
      sha: ${{ needs.select.outputs.sha }}
      version: ${{ needs.select.outputs.version }}

  prune:
    name: Prune old nightlies
    needs: [select, release]
    if: needs.select.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@main

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@main
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          remote: true
      - name: Delete nightlies older than 14 days (never the alias target)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: termenbox/termenbox-ci
        run: sh .github/scripts/prune_nightlies.sh 14

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@main
        with:
          key: ${{ secrets.LOG_KEY }}
          name: prune-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.GITHUB_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

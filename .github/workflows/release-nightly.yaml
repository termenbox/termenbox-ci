name: Release (nightly)

# One nightly a day, at 00:00 UTC, from the newest develop commit whose `ci` status is green. It never builds a red
# head: the commit comes from a green status, not from the branch tip. (A run of this repo's CI names no source commit,
# so the nightly does not follow it; the cron is the only trigger.)
# Tag vYYYY.MM.DD-nightly (-nightly.N for the Nth of a day), manifest version X.Y.Z-nightly.YYYYMMDD (.N), signed by the
# nightly key `n1` from the `nightly` environment. Keeps 14 days of nightlies, never the one channel-nightly
# points at. Run by hand it is a dry run unless `publish` is ticked.
#
# It publishes to the nightly/ path of the R2 bucket and to the Releases of the product repo (release-build.yaml), and nothing else: no stable or beta path, key or alias. It does not call the security review gate.
# The Releases it reads are those of the public product repo, with the workflow token (CI_TOKEN and CI_REPO below); the
# prune job deletes in them with MIRROR_TOKEN of the nightly environment; the other GH_TOKEN reads the source.

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the release (otherwise a dry run that publishes nothing)'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: quiet {0}

# A manual run can overlap the cron; a second run waits and then sees today's release.
concurrency:
  group: release-nightly
  cancel-in-progress: false

env:
  TB_EVENT: ${{ github.event.client_payload.event || github.event_name }}
  TB_TAG: ${{ github.event.client_payload.tag }}

jobs:
  select:
    name: Select the commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
      run: ${{ steps.s.outputs.run }}
      sha: ${{ steps.s.outputs.sha }}
      tag: ${{ steps.s.outputs.tag }}
      version: ${{ steps.s.outputs.version }}
      aliases: ${{ steps.s.outputs.aliases }}
      docker_tags: ${{ steps.s.outputs.docker_tags }}
      publish: ${{ steps.s.outputs.publish }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@97805a74052190f48fd211a681c2feacf054eac3
      - uses: termenbox/termenbox-ci/.github/actions/release-tools@97805a74052190f48fd211a681c2feacf054eac3

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@97805a74052190f48fd211a681c2feacf054eac3
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          depth: 0
          base: ${{ github.event.client_payload.base }}
          fetch: develop
      - id: s
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          GH_REPO: termenbox/termenbox-source
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}
          CI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_REPO: termenbox/termenbox
          EVENT: ${{ (github.event.client_payload.event || github.event_name) }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
        run: |
          sha=""; for c in $(gh api "repos/termenbox/termenbox-source/commits?sha=develop&per_page=30" --jq '.[].sha'); do
          n="$(GH_TOKEN="$STATUS_TOKEN" gh api "repos/termenbox/termenbox-source/commits/$c/status" --jq '[.statuses[]|select(.context=="ci" and .state=="success")]|length')"
          if [ "${n:-0}" -gt 0 ]; then sha="$c"; break; fi
          done
          [ -n "$sha" ] || { echo "::notice::no green CI run on develop; nothing to release"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          git merge-base --is-ancestor "$sha" origin/develop || { echo "::notice::$sha is not on develop; nothing to release"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          publish=true
          if [ "$EVENT" = workflow_dispatch ] && [ "$DISPATCH_PUBLISH" != true ]; then publish=false; fi

          core="$(git show "$sha:packages/server/Cargo.toml" | grep -m1 '^version' | cut -d'"' -f2)"
          day="$(date -u +%Y%m%d)"
          # Any number of nightlies a day: the first keeps X.Y.Z-nightly.YYYYMMDD, the next ones add .2, .3. A version is
          # never overwritten, so the next free number is read from the download host, which is where a version lives.
          n=1
          if [ "$publish" = true ]; then
            while :; do
              v="${core}-nightly.${day}"; [ "$n" -eq 1 ] || v="$v.$n"
              curl -g -fsSI "https://dl.termenbox.dev/nightly/$v/manifest.json" >/dev/null 2>&1 || break
              n=$((n + 1))
              [ "$n" -le 99 ] || { echo "::error::99 nightlies today; refusing another"; exit 1; }
            done
          fi
          plan="$(python3 "$TB_RELEASE_TOOLS/release_plan.py" nightly "$core" "$day" "$n")"
          tag="$(jq -r .tag <<<"$plan")"

          # A signed freeze (release-freeze.yaml) holds the channel until a release newer than it is made.
          if [ "$publish" = true ] && ! GH_TOKEN="$CI_TOKEN" GH_REPO="$CI_REPO" sh "$TB_RELEASE_TOOLS/check_not_frozen.sh" nightly "$(jq -r .version <<<"$plan")"; then
            echo "::notice::nightly is frozen; nothing to release"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$publish" = true ]; then
            if GH_TOKEN="$CI_TOKEN" GH_REPO="$CI_REPO" gh release view "$tag" >/dev/null 2>&1; then
              echo "::notice::$tag already exists in the mirror but not on the download host; resolve it by hand"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # the product repo has no tag at the source commit: the last nightly's notes name the commit it was built from
            last="$(GH_TOKEN="$CI_TOKEN" GH_REPO="$CI_REPO" gh release list --limit 100 --json tagName -q '.[].tagName' | grep -E '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-nightly(\.[0-9]+)?$' | sort -V | tail -1)" || last=""
            if [ -n "$last" ] && GH_TOKEN="$CI_TOKEN" GH_REPO="$CI_REPO" gh release view "$last" --json body -q .body | grep -q "$sha"; then
              echo "::notice::$last was built from this commit; nothing changed"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          {
            echo "run=true"; echo "sha=$sha"; echo "publish=$publish"; echo "tag=$tag"
            echo "version=$(jq -r .version <<<"$plan")"
            echo "aliases=$(jq -r '.aliases | join(" ")' <<<"$plan")"
            echo "docker_tags=$(jq -r '.docker_tags | join(" ")' <<<"$plan")"
          } >> "$GITHUB_OUTPUT"

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@97805a74052190f48fd211a681c2feacf054eac3
        with:
          key: ${{ secrets.LOG_KEY }}
          name: select-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.GITHUB_TOKEN }}
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}
            ${{ secrets.STATUS_TOKEN }}

  release:
    name: Release
    needs: select
    if: needs.select.outputs.run == 'true'
    permissions:
      actions: read
      contents: write
      deployments: write
      packages: read
    uses: ./.github/workflows/release-build.yaml
    secrets: inherit
    with:
      channel: nightly
      kid: n1
      version: ${{ needs.select.outputs.version }}
      tag: ${{ needs.select.outputs.tag }}
      sha: ${{ needs.select.outputs.sha }}
      publish: ${{ needs.select.outputs.publish == 'true' }}
      prerelease: true
      latest: false
      aliases: ${{ needs.select.outputs.aliases }}
      notes: 'Nightly build of develop at ${{ needs.select.outputs.sha }}. Not a supported release: it is for trying what is coming.'

  # GitHub does not start a workflow for a tag its own token created, so the image is built by calling the workflow. It
  # runs beside the release, which waits for the image tag and signs its digests into the manifest.
  image:
    name: Image
    needs: select
    if: needs.select.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-build.yaml
    secrets: inherit
    with:
      sha: ${{ needs.select.outputs.sha }}
      version: ${{ needs.select.outputs.version }}
      tags: ${{ needs.select.outputs.docker_tags }}

  deploy:
    name: Deploy the client
    needs: [select, release]
    if: needs.select.outputs.publish == 'true'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-pages.yaml
    secrets: inherit
    with:
      channel: nightly
      sha: ${{ needs.select.outputs.sha }}
      version: ${{ needs.select.outputs.version }}

  prune:
    name: Prune old nightlies
    needs: [select, release]
    if: needs.select.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: nightly
    permissions:
      contents: read
    outputs:
      fail: ${{ steps.finish.outputs.summary }}
    steps:
      - uses: termenbox/termenbox-ci/.github/actions/setup-quiet@97805a74052190f48fd211a681c2feacf054eac3
      - uses: termenbox/termenbox-ci/.github/actions/release-tools@97805a74052190f48fd211a681c2feacf054eac3

      - uses: termenbox/termenbox-ci/.github/actions/checkout-private@97805a74052190f48fd211a681c2feacf054eac3
        with:
          sha: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - name: Delete nightlies older than 14 days (never the alias target)
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          GH_REPO: termenbox/termenbox
        run: sh "$TB_RELEASE_TOOLS/prune_nightlies.sh" 14

      - if: always()
        id: finish
        uses: termenbox/termenbox-ci/.github/actions/finish@97805a74052190f48fd211a681c2feacf054eac3
        with:
          key: ${{ secrets.LOG_KEY }}
          name: prune-${{ strategy.job-index }}
          status: ${{ job.status }}
          log-token: ${{ secrets.LOG_TOKEN }}
          secrets: |-
            ${{ secrets.LOG_KEY }}
            ${{ secrets.LOG_TOKEN }}
            ${{ secrets.MIRROR_TOKEN }}
            ${{ secrets.SOURCE_TOKEN }}

name: Fleet scale bench

# A one-shot harness for the client's fleet list: it builds the e2e bundle of
# one source ref and runs e2e/fleet-scale.mjs, which drives the real App over a scripted server (a generated fleet of N missions, status
# changes at a rate, an agent_events rate, a CPU throttle) and prints one JSON row per run: script ms from hand-over to the end of the
# frame, frame times, long tasks, elements, JS heap, collections, bytes in. Sizes and throttles are interleaved run by run (a difference
# between them is not the difference between two minutes of a shared machine). Only the `row` lines reach the log; every build output goes
# to a file that is uploaded encrypted. Never add a pull_request trigger: a fork PR could change this file and print the checkout.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref to measure (a branch, tag or sha of termenbox-source)
        default: docs/fleet-scale-rendering-plan
      missions:
        description: Fleet sizes, a list such as 100,500,1000
        default: '100,1000'
      throttle:
        description: CPU throttle rates, a list such as 1,4
        default: '1,4'
      rate:
        description: Status messages a second
        default: '10'
      per_change:
        description: Missions changed by one message
        default: '3'
      events:
        description: agent_events a second (0 is off)
        default: '0'
      seconds:
        description: Seconds per run
        default: '10'
      rounds:
        description: Interleaved rounds
        default: '3'
      asks:
        description: Percent of missions that need you (9 is the stress mix; 2 is the row the budgets are read on)
        default: '9'
      profile:
        description: Run each size with a V8 CPU profile and a scroll pass; prints the profile, elements_by and scroll rows (round 1 only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - id: rt-src
        name: Token for the next step (contents)
        uses: termenbox/termenbox-ci/.github/actions/app-token@8a830ae40dc43ed9db9c18a5bc7d30c965eab7c1
        with:
          app-id: ${{ secrets.REPORTER_APP_ID }}
          app-key: ${{ secrets.REPORTER_APP_KEY }}
          permissions: '{"contents":"read"}'
      - name: Check out the ref
        env:
          TOKEN: ${{ steps.rt-src.outputs.token }}
          REF: ${{ inputs.ref }}
        run: |
          set +x
          git -c credential.helper= clone --quiet "https://x-access-token:${TOKEN}@github.com/termenbox/termenbox-source.git" src >/dev/null 2>&1
          git -C src remote set-url origin https://github.com/termenbox/termenbox-source.git
          sha=$(git -C src rev-parse --verify --quiet "origin/$REF" || git -C src rev-parse --verify --quiet "$REF") || { echo "no such ref"; exit 1; }
          git -C src checkout --quiet --detach "$sha" >/dev/null 2>&1 || { echo "checkout failed"; exit 1; }
          echo "checked out ${REF} ($(printf '%.8s' "$sha"))"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Build the e2e bundle (output withheld)
        id: build
        run: |
          set +e
          (cd src && pnpm install --frozen-lockfile && cd packages/client && pnpm run e2e:build) > build.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Run the fleet, interleaved (output withheld except the rows)
        id: bench
        if: steps.build.outputs.exit == '0'
        env:
          MISSIONS: ${{ inputs.missions }}
          THROTTLE: ${{ inputs.throttle }}
          RATE: ${{ inputs.rate }}
          PER_CHANGE: ${{ inputs.per_change }}
          EVENTS: ${{ inputs.events }}
          SECONDS_PER_RUN: ${{ inputs.seconds }}
          ROUNDS: ${{ inputs.rounds }}
          PROFILE: ${{ inputs.profile }}
          ASKS: ${{ inputs.asks }}
        run: |
          set +e
          echo "runner: $(nproc) cores, load $(cut -d' ' -f1-3 /proc/loadavg), $(google-chrome --version 2>/dev/null)"
          cd src/packages/client
          : > ../../../rows.txt
          rc=0
          i=1
          while [ "$i" -le "$ROUNDS" ]; do
            for m in $(echo "$MISSIONS" | tr ',' ' '); do
              for t in $(echo "$THROTTLE" | tr ',' ' '); do
                # The profile run is its own run of the round-1 pass, so the plain rows of every round stay comparable.
                if [ "$PROFILE" = true ] && [ "$i" -eq 1 ]; then
                  node e2e/fleet-scale.mjs --missions "$m" --throttle "$t" --rate "$RATE" --per-change "$PER_CHANGE" --events "$EVENTS" --seconds "$SECONDS_PER_RUN" --asks "$ASKS" --profile --scroll > ../../../prof.out 2>> ../../../bench.err || rc=1
                  grep -E '^(\{|profile |elements_by )' ../../../prof.out | sed "s/^{/prof {\"missions\":$m,\"throttle\":$t,/;t;s/^/prof-line missions=$m throttle=$t /" | tee -a ../../../rows.txt
                fi
                node e2e/fleet-scale.mjs --missions "$m" --throttle "$t" --rate "$RATE" --per-change "$PER_CHANGE" --events "$EVENTS" --seconds "$SECONDS_PER_RUN" --asks "$ASKS" > ../../../one.out 2>> ../../../bench.err || rc=1
                grep '^{' ../../../one.out | sed "s/^{/{\"round\":$i,/" | sed 's/^/row /' | tee -a ../../../rows.txt
              done
            done
            i=$((i + 1))
          done
          [ -s ../../../rows.txt ] || rc=1
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          { echo '```'; cat ../../../rows.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Encrypt logs
        if: always()
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          touch build.log bench.err
          cat build.log bench.err > all.log
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LOG_KEY -in all.log -out all.log.enc 2>/dev/null || true
          rm -f build.log bench.err all.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: fleet-scale-bench-log-encrypted
          path: all.log.enc
          retention-days: 7
      - name: Result
        env:
          BUILD: ${{ steps.build.outputs.exit }}
          BENCH: ${{ steps.bench.outputs.exit }}
        run: test "$BUILD" = 0 && test "$BENCH" = 0

name: repo-checks
# The checks of this repository's own files. No secrets, read-only token: it also runs for a pull request.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # the whole history, so check-self-refs can tell whether a commit is on main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Every workflow and action file parses
        run: |
          python3 -c 'import sys,yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]' .github/workflows/*.y*ml .github/actions/*/action.yml
      - name: Every action reference is a full commit
        run: node scripts/check-action-refs.mjs
      - name: Every self-reference names one commit of main
        run: node scripts/check-self-refs.mjs
      - name: The release gates carry their token
        run: node scripts/check-gate-token.mjs
      - name: No release or deploy workflow uses the apt-cached action
        run: node scripts/check-apt-cached-scope.mjs
      - name: No job keeps the source token in .git/config
        run: |
          if grep -rnE 'remote: true|extraheader' .github/workflows .github/actions | grep -v 'unset-all' | grep -v ' -c '; then echo 'a credential in .git/config'; exit 1; fi
      - name: Comments name nothing internal
        run: node scripts/check-public-comments.mjs
      - name: One approval per run
        run: node scripts/check-approval-jobs.mjs
      - name: Registry build caches carry the release channel
        run: node scripts/check-cache-refs.mjs
      - name: Pages deployments share one concurrency group
        run: node scripts/check-pages-group.mjs
      - name: The sweep's checks read this repo
        run: |
          node sweep/check-pinned-actions.mjs
          node sweep/check-job-environments.mjs
      - name: No untrusted trigger reaches a secret or an unguarded write token
        run: node sweep/check-workflow-secrets.mjs
      - name: No fuzzer or audit job publishes its output
        run: node sweep/check-security-jobs.mjs
      - name: Lint the workflows
        # the version the monthly sweep installs; high findings only, the policy and its reasons are in .github/zizmor.yml
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet zizmor==1.32.0
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --min-severity high --config .github/zizmor.yml .github/workflows
      - name: Tests of the checks and of the Worker triggers
        run: node --test sweep/*.test.mjs scripts/check-action-refs.test.mjs scripts/check-self-refs.test.mjs scripts/check-gate-token.test.mjs scripts/checkout-private.test.mjs scripts/app-token.test.mjs scripts/check-apt-cached-scope.test.mjs scripts/check-pages-group.test.mjs scripts/check-approval-jobs.test.mjs scripts/check-cache-refs.test.mjs release/verify_origin.test.mjs worker/triggers.test.mjs worker/app-token.test.mjs
      - name: Tests of the release scripts
        run: |
          for t in release/test-*.sh; do echo "$t"; sh "$t" > /dev/null; done
          python3 -B -m unittest discover -s release -p 'test_*.py'

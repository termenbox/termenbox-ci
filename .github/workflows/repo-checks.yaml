name: repo-checks
# The checks of this repository's own files. No secrets, read-only token: it also runs for a pull request.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Every action reference is a full commit
        run: node scripts/check-action-refs.mjs
      - name: Comments name nothing internal
        run: node scripts/check-public-comments.mjs
      - name: Tests of the checks and of the Worker triggers
        run: node --test scripts/check-action-refs.test.mjs worker/triggers.test.mjs

name: repo-checks
# The checks of this repository's own files. No secrets, read-only token: it also runs for a pull request.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Every action reference is a full commit
        run: node scripts/check-action-refs.mjs
      - name: The release gates carry their token
        run: node scripts/check-gate-token.mjs
      - name: Comments name nothing internal
        run: node scripts/check-public-comments.mjs
      - name: One approval per run
        run: node scripts/check-approval-jobs.mjs
      - name: Pages deployments share one concurrency group
        run: node scripts/check-pages-group.mjs
      - name: The sweep's checks read this repo
        run: |
          node sweep/check-pinned-actions.mjs
          node sweep/check-job-environments.mjs
      - name: Tests of the checks and of the Worker triggers
        run: node --test sweep/*.test.mjs scripts/check-action-refs.test.mjs scripts/check-gate-token.test.mjs scripts/check-pages-group.test.mjs scripts/check-approval-jobs.test.mjs release/verify_origin.test.mjs worker/triggers.test.mjs
      - name: Tests of the release scripts
        run: |
          for t in release/test-*.sh; do echo "$t"; sh "$t" > /dev/null; done
          python3 -B -m unittest discover -s release -p 'test_*.py'
